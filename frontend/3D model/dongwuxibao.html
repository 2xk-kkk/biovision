<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动物细胞 — 3D 交互模型</title>
<style>
  :root{--bg:#0d1117;--panel:rgba(13,17,23,0.9);--text:#e6edf3;--muted:#8b949e;--cyan:#79c0ff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--text);background:var(--bg)}
  #cv{position:fixed;inset:0}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(13,17,23,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.07)}
  .back-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.05);color:#c9d1d9;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all .25s;flex-shrink:0}
  .back-btn:hover{background:rgba(255,255,255,.12);border-color:#fff;box-shadow:0 0 14px rgba(121,192,255,.2)}
  .topbar h1{font-size:15px;font-weight:600;letter-spacing:.5px;background:linear-gradient(90deg,var(--cyan),#f0a040);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .topbar-actions{margin-left:auto;display:flex;gap:6px}
  .tb-btn{padding:5px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#b0b8c0;font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s;white-space:nowrap}
  .tb-btn:hover{background:rgba(255,255,255,.1);color:#e6edf3}
  .tb-btn.on{background:rgba(121,192,255,.15);border-color:rgba(121,192,255,.4);color:var(--cyan)}
  .legend{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:50;background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;min-width:175px;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .legend h3{font-size:11px;color:var(--muted);margin-bottom:10px;letter-spacing:1px}
  .lg-item{display:flex;align-items:center;gap:9px;padding:5px 6px;margin:1px -6px;border-radius:5px;font-size:11px;color:#b0b8c0;cursor:pointer;transition:background .15s}
  .lg-item:hover{background:rgba(255,255,255,.04)}
  .lg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .lg-dot.mem{background:rgba(190,210,225,.8);border:2px solid rgba(210,225,240,.9)}
  .lg-dot.nuc{background:#b07cd8}
  .lg-dot.mit{background:#e74c3c}
  .lg-dot.er{background:#5dade2}
  .lg-dot.gol{background:#f4d03f}
  .lg-dot.lys{background:#58d68d}
  .lg-dot.cen{background:#1abc9c}
  .info-popup{position:fixed;z-index:200;pointer-events:none;opacity:0;transform:translate(-50%,-115%);transition:opacity .25s,transform .25s;background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:13px 16px;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:250px;backdrop-filter:blur(12px)}
  .info-popup.show{opacity:1;transform:translate(-50%,-130%)}
  .info-popup h4{font-size:13px;margin-bottom:5px}
  .info-popup p{font-size:11px;color:var(--muted);line-height:1.55}
  .info-popup::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid rgba(13,17,23,.95)}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;padding:7px 18px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--muted);letter-spacing:.5px;backdrop-filter:blur(8px);pointer-events:none}
  .hint em{color:var(--cyan);font-style:normal}
</style>
</head>
<body>

<div class="topbar">
  <a href="main.html" class="back-btn">←</a>
  <h1>动物细胞结构</h1>
  <div class="topbar-actions">
    <button class="tb-btn on" id="btnAuto" onclick="toggleAuto()">⟳ 自动旋转</button>
    <button class="tb-btn on" id="btnLabel" onclick="toggleLabels()">🏷 标注</button>
    <button class="tb-btn" onclick="resetView()">↺ 重置</button>
  </div>
</div>

<canvas id="cv"></canvas>

<div class="legend">
  <h3>细胞结构</h3>
  <div class="lg-item" data-p="mem"><div class="lg-dot mem"></div> 细胞膜</div>
  <div class="lg-item" data-p="nuc"><div class="lg-dot nuc"></div> 细胞核</div>
  <div class="lg-item" data-p="mit"><div class="lg-dot mit"></div> 线粒体</div>
  <div class="lg-item" data-p="er"><div class="lg-dot er"></div> 内质网</div>
  <div class="lg-item" data-p="gol"><div class="lg-dot gol"></div> 高尔基体</div>
  <div class="lg-item" data-p="lys"><div class="lg-dot lys"></div> 溶酶体</div>
  <div class="lg-item" data-p="cen"><div class="lg-dot cen"></div> 中心粒</div>
</div>

<div class="info-popup" id="popup"><h4 id="popTitle"></h4><p id="popDesc"></p></div>
<div class="hint">🖱 <em>拖拽</em>旋转 | 🔍 <em>滚轮</em>缩放 | 👆 <em>点击</em>细胞器看详情</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== 场景 =====
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('cv'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1117);
scene.fog=new THREE.Fog(0x0d1117,16,45);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.5,60);
camera.position.set(4.5,2.5,10.5);camera.lookAt(0,0,0);

// 光照
scene.add(new THREE.AmbientLight(0x556677,4));
const key=new THREE.DirectionalLight(0xfff8ee,7);key.position.set(10,8,8);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.near=0.5;key.shadow.camera.far=50;
key.shadow.camera.left=-14;key.shadow.camera.right=14;key.shadow.camera.top=14;key.shadow.camera.bottom=-14;
key.shadow.bias=-0.0001;scene.add(key);
scene.add(new THREE.DirectionalLight(0x8899cc,2).position.set(-6,0,-4));
scene.add(new THREE.DirectionalLight(0xb0c8ff,2.5).position.set(0,-3,6));

// Controls
const ctrl=new OrbitControls(camera,renderer.domElement);
ctrl.target.set(0,0,0);ctrl.enableDamping=true;ctrl.dampingFactor=0.08;
ctrl.minDistance=5;ctrl.maxDistance=22;ctrl.autoRotate=true;ctrl.autoRotateSpeed=0.3;
ctrl.update();

// ===== 材质 =====
const matMem=new THREE.MeshPhysicalMaterial({color:0xc8dae8,roughness:0.25,metalness:0.03,transparent:true,opacity:0.28,depthWrite:false});
const matNucOut=new THREE.MeshStandardMaterial({color:0x9b59b6,roughness:0.22,metalness:0.08,transparent:true,opacity:0.75});
const matNucIn=new THREE.MeshStandardMaterial({color:0xd7bde2,roughness:0.35,metalness:0.03});
const matNol=new THREE.MeshStandardMaterial({color:0x5b2c6f,roughness:0.2,metalness:0.1});
const matPore=new THREE.MeshStandardMaterial({color:0xe8d0f0,roughness:0.15,metalness:0.12});
const matMito=new THREE.MeshStandardMaterial({color:0xe74c3c,roughness:0.25,metalness:0.06});
const matCrista=new THREE.MeshStandardMaterial({color:0x922b21,roughness:0.35,metalness:0.04});
const matER=new THREE.MeshStandardMaterial({color:0x5dade2,roughness:0.3,metalness:0.05});
const matRibo=new THREE.MeshStandardMaterial({color:0x1a5276,roughness:0.25,metalness:0.08});
const matGolgi=new THREE.MeshStandardMaterial({color:0xf4d03f,roughness:0.25,metalness:0.07});
const matLyso=new THREE.MeshStandardMaterial({color:0x58d68d,roughness:0.22,metalness:0.08,emissive:0x1a6e3a,emissiveIntensity:0.15});
const matCen=new THREE.MeshStandardMaterial({color:0x1abc9c,roughness:0.2,metalness:0.1});

const clickTargets=[];
function clk(g,d){g.userData=d;clickTargets.push(g);}

// ===== 细胞膜（大球） =====
const cellR=3.8;
const memGeo=new THREE.SphereGeometry(cellR,56,40);
const mem=new THREE.Mesh(memGeo,matMem);mem.renderOrder=1;
scene.add(mem);
clk(mem,{name:'mem',title:'细胞膜（质膜）',desc:'以磷脂双分子层为基本骨架，镶嵌蛋白质。具有选择透过性，控制物质进出细胞，参与细胞间信息交流。',color:'#c8dae8'});

// 细胞质基质背景（微弱半透明填充）
const cytoGeo=new THREE.SphereGeometry(cellR-0.15,32,24);
const cyto=new THREE.Mesh(cytoGeo,new THREE.MeshBasicMaterial({color:0x2a3040,transparent:true,opacity:0.12,depthWrite:false}));
scene.add(cyto);

// ===== 细胞核 =====
const nucG=new THREE.Group();nucG.position.set(-1.0,0.8,0.3);scene.add(nucG);
// 核膜外层
const nucOuter=new THREE.Mesh(new THREE.SphereGeometry(1.35,36,24),matNucOut);nucG.add(nucOuter);
// 核质
const nucInner=new THREE.Mesh(new THREE.SphereGeometry(1.2,36,24),matNucIn);nucG.add(nucInner);
// 核仁
const nol=new THREE.Mesh(new THREE.SphereGeometry(0.5,20,16),matNol);
nol.position.set(0.3,0.25,0.35);nucG.add(nol);
// 染色质团块（模拟）
for(let i=0;i<18;i++){
  const phi=Math.acos(2*Math.random()-1),theta=Math.random()*Math.PI*2;
  const r=0.7+Math.random()*0.45;
  const c=new THREE.Mesh(new THREE.SphereGeometry(0.06+Math.random()*0.1,6,6),matNol);
  c.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi));
  nucG.add(c);
}
// 核孔
for(let i=0;i<12;i++){
  const phi=Math.random()*Math.PI,theta=Math.random()*Math.PI*2;
  const px=1.33*Math.sin(phi)*Math.cos(theta),py=1.33*Math.sin(phi)*Math.sin(theta),pz=1.33*Math.cos(phi);
  const pore=new THREE.Mesh(new THREE.TorusGeometry(0.1,0.05,8,10),matPore);
  pore.position.set(px,py,pz);pore.lookAt(new THREE.Vector3(px*3,py*3,pz*3));nucG.add(pore);
}
clk(nucG,{name:'nuc',title:'细胞核',desc:'遗传信息库，代谢和遗传的控制中心。双层核膜包裹，核膜上有核孔（mRNA等大分子通道）。核仁与核糖体的形成有关。',color:'#9b59b6'});

// ===== 线粒体（豆形 + 密集嵴） =====
function mkMito(x,y,z,ry,rz){
  const g=new THREE.Group();
  // 外膜 — 用缩放的球做豆形
  const outGeo=new THREE.SphereGeometry(0.65,24,16);
  const out=new THREE.Mesh(outGeo,matMito);out.scale.set(1,0.42,1.7);g.add(out);
  // 嵴 — 8-10片平行排列
  for(let i=0;i<10;i++){
    const t=(i-4.5)*0.14;
    const cGeo=new THREE.BoxGeometry(0.08,0.28,1.2);
    const c=new THREE.Mesh(cGeo,matCrista);
    c.position.z=t;c.rotation.y=(Math.random()-0.5)*0.1;
    g.add(c);
  }
  g.position.set(x,y,z);g.rotation.y=ry;g.rotation.z=rz;
  return g;
}
[[2.0,-0.6,1.2,0.4,0.1],[1.6,1.0,-2.0,1.6,-0.2],[-1.2,-1.6,-1.5,2.2,0.3],[-0.2,2.0,0.8,0.7,0.5],[2.4,0.3,-0.6,3.0,-0.1]].forEach(([x,y,z,ry,rz])=>{
  const m=mkMito(x,y,z,ry,rz);scene.add(m);
  clk(m,{name:'mit',title:'线粒体',desc:'有氧呼吸的主要场所——"动力车间"。双层膜结构，内膜向内折叠形成嵴（红色薄片），大大增加了反应面积。含自身DNA和核糖体。',color:'#e74c3c'});
});

// ===== 粗面内质网（网状管道） =====
const erG=new THREE.Group();erG.position.set(1.5,1.0,-1.5);scene.add(erG);
// 主网络 — 多条弯曲管道
function makeERTube(cps){
  const pts=cps.map(([px,py,pz])=>new THREE.Vector3(px,py,pz));
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),28,0.1,8,false),matER);
}
const erDefs=[
  [[0,0,0],[0.3,0.2,0.3],[0.6,0.4,0.1],[0.9,0.6,0.4],[1.2,0.9,0.2],[1.5,0.8,0]],
  [[0.15,0.1,0.2],[0.5,-0.2,0.4],[0.8,0,0.7],[1.1,0.3,0.6]],
  [[0.8,0.3,-0.3],[0.6,0.6,-0.2],[0.3,0.9,-0.4],[-0.1,1.1,-0.3]],
  [[0.5,0.5,0.5],[0.3,0.3,1.0],[0,0.5,1.3],[-0.3,0.7,1.0]],
];
erDefs.forEach(cps=>erG.add(makeERTube(cps)));
// 滑面内质网（少核糖体）
const serPts=[[0.7,0.5,-0.6],[1.0,0.7,-0.8],[1.3,0.5,-1.0],[1.6,0.3,-0.7]];
erG.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(serPts.map(([x,y,z])=>new THREE.Vector3(x,y,z))),20,0.08,8,false),new THREE.MeshStandardMaterial({color:0x85c1e9,roughness:0.35,metalness:0.04})));
// 核糖体
erDefs.forEach(cps=>{
  const curve=new THREE.CatmullRomCurve3(cps.map(([x,y,z])=>new THREE.Vector3(x,y,z)));
  for(let i=0;i<16;i++){
    const pt=curve.getPointAt(Math.random());
    const r=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),matRibo);
    r.position.copy(pt).add(new THREE.Vector3((Math.random()-0.5)*0.25,(Math.random()-0.5)*0.25,(Math.random()-0.5)*0.25));
    erG.add(r);
  }
});
clk(erG,{name:'er',title:'粗面内质网',desc:'由膜构成的管状、扁平囊状网络。表面附着大量核糖体（深蓝小点），是蛋白质合成、加工和运输的场所。与细胞核外膜相连。',color:'#5dade2'});

// ===== 高尔基体 =====
const golG=new THREE.Group();golG.position.set(-2.0,-0.4,1.8);scene.add(golG);
const golMat2=new THREE.MeshStandardMaterial({color:0xe67e22,roughness:0.3,metalness:0.06});
for(let i=0;i<6;i++){
  const r=0.5-i*0.05;const disc=new THREE.Mesh(new THREE.CylinderGeometry(r,r,0.06,24),i<3?matGolgi:golMat2);
  disc.position.y=i*0.16-0.4;disc.rotation.x=0.35;disc.rotation.z=-0.25;golG.add(disc);
}
// 囊泡
for(let i=0;i<10;i++){
  const v=new THREE.Mesh(new THREE.SphereGeometry(0.06+Math.random()*0.08,8,8),i%2?matGolgi:golMat2);
  v.position.set((Math.random()-0.5)*1.0,-0.5+Math.random()*0.15,(Math.random()-0.5)*0.8);golG.add(v);
}
clk(golG,{name:'gol',title:'高尔基体',desc:'由扁平膜囊堆叠而成——"加工厂"和"发送站"。对来自内质网的蛋白质进行修饰、分类、包装，形成囊泡运往目的地。凸面为形成面(cis)，凹面为成熟面(trans)。',color:'#f4d03f'});

// ===== 溶酶体 =====
[[2.2,1.5,0.6],[-1.8,-1.8,0.3],[0.5,-2.0,-0.5]].forEach(([x,y,z])=>{
  const lyso=new THREE.Mesh(new THREE.SphereGeometry(0.3,20,16),matLyso);
  lyso.position.set(x,y,z);scene.add(lyso);
  clk(lyso,{name:'lys',title:'溶酶体',desc:'单层膜包裹的囊状结构，内含60余种水解酶。是细胞内的"消化车间"，能分解蛋白质、核酸、多糖等，参与自噬、细胞凋亡和防御。',color:'#58d68d'});
});

// ===== 中心粒 =====
const cenG=new THREE.Group();cenG.position.set(0.5,-1.8,0.8);scene.add(cenG);
function mkCen(rx){
  const g=new THREE.Group();
  for(let i=0;i<9;i++){
    const a=i/9*Math.PI*2;
    const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.7,8),matCen);
    rod.position.set(Math.cos(a)*0.18,0,Math.sin(a)*0.18);g.add(rod);
  }
  g.rotation.x=rx;return g;
}
cenG.add(mkCen(0));cenG.add(mkCen(Math.PI/2));
// 星射线
const rayMat=new THREE.MeshBasicMaterial({color:0x1abc9c,transparent:true,opacity:0.3});
for(let i=0;i<12;i++){
  const a=Math.random()*Math.PI*2;const phi=Math.random()*Math.PI*0.5;
  const ray=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.8,4),rayMat);
  ray.position.set(Math.cos(a)*Math.cos(phi)*0.5,Math.sin(phi)*0.5,Math.sin(a)*Math.cos(phi)*0.5);
  ray.lookAt(new THREE.Vector3(Math.cos(a)*2,Math.sin(phi)*2,Math.sin(a)*2));
  cenG.add(ray);
}
clk(cenG,{name:'cen',title:'中心粒',desc:'由9组三联微管组成的圆筒状结构，两个中心粒互相垂直排列。参与纺锤体形成，与有丝分裂有关。动物细胞和低等植物特有。',color:'#1abc9c'});

// ===== 标注 =====
const cssL=[];
function adL(t,wp,c){
  const d=document.createElement('div');d.textContent=t;
  d.style.cssText=`position:fixed;z-index:55;pointer-events:none;font-size:11px;font-weight:600;color:${c};text-shadow:0 0 8px rgba(0,0,0,.9);letter-spacing:1px;white-space:nowrap;transition:opacity .35s`;
  document.body.appendChild(d);cssL.push({d,wp});
}
adL('细胞膜',new THREE.Vector3(3.2,2.8,-2.2),'#c8dae8');
adL('细胞核',new THREE.Vector3(-1.8,2.4,0.8),'#b07cd8');
adL('线粒体',new THREE.Vector3(2.5,-1.2,2.0),'#e74c3c');
adL('粗面内质网',new THREE.Vector3(2.5,1.8,-2.2),'#5dade2');
adL('高尔基体',new THREE.Vector3(-2.8,-0.8,2.5),'#f4d03f');
adL('溶酶体',new THREE.Vector3(2.8,2.0,1.2),'#58d68d');
adL('中心粒',new THREE.Vector3(1.0,-2.8,1.2),'#1abc9c');

let sL=true;
function uL(){cssL.forEach(({d,wp})=>{const v=wp.clone().project(camera);d.style.left=((v.x*0.5+0.5)*innerWidth)+'px';d.style.top=((-v.y*0.5+0.5)*innerHeight)+'px';d.style.transform='translate(-50%,-50%)';d.style.opacity=(sL&&v.z<1)?'1':'0';})}

// ===== 点击 =====
const rc=new THREE.Raycaster();
const pp=document.getElementById('popup'),pt=document.getElementById('popTitle'),pd=document.getElementById('popDesc');

document.getElementById('cv').addEventListener('click',ev=>{
  const m=new THREE.Vector2();m.x=(ev.clientX/innerWidth)*2-1;m.y=-(ev.clientY/innerHeight)*2+1;
  rc.setFromCamera(m,camera);
  const ms=[];clickTargets.forEach(g=>g.traverse(c=>{if(c.isMesh)ms.push({m:c,g});}));
  const hits=rc.intersectObjects(ms.map(a=>a.m),false);
  if(hits.length){const f=ms.find(a=>a.m===hits[0].object);if(f){sp(ev.clientX,ev.clientY,f.g.userData);return}}
  hp();
});
function sp(x,y,d){pt.textContent=d.title;pt.style.color=d.color;pd.textContent=d.desc;pp.style.left=x+'px';pp.style.top=y+'px';pp.classList.add('show')}
function hp(){pp.classList.remove('show')}

window.toggleAuto=()=>{ctrl.autoRotate=!ctrl.autoRotate;document.getElementById('btnAuto').classList.toggle('on',ctrl.autoRotate)}
window.toggleLabels=()=>{sL=!sL;document.getElementById('btnLabel').classList.toggle('on',sL);uL()}
window.resetView=()=>{const sT=ctrl.target.clone(),eT=new THREE.Vector3(0,0,0);const sC=camera.position.clone(),eC=new THREE.Vector3(4.5,2.5,10.5);const t0=performance.now();(function a(n){const t=Math.min((n-t0)/800,1);const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;ctrl.target.lerpVectors(sT,eT,e);camera.position.lerpVectors(sC,eC,e);ctrl.update();if(t<1)requestAnimationFrame(a)})();hp()}

function animate(){requestAnimationFrame(animate);ctrl.update();uL();renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
window.addEventListener('keydown',e=>{switch(e.key.toLowerCase()){case'r':resetView();break;case'a':toggleAuto();break;case'l':toggleLabels();break;case'escape':hp();break}});
animate();
</script>
