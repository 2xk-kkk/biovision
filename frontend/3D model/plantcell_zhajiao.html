<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物体细胞杂交 — 交互式实验平台</title>
<style>
  :root {
    --bg-primary: #0a0e17;
    --bg-secondary: #111827;
    --bg-card: #161e2b;
    --bg-card-hover: #1c2636;
    --border: #1e3048;
    --border-active: #2563eb;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.3);
    --accent-light: #60a5fa;
    --success: #10b981;
    --warning: #f59e0b;
    --gradient-1: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 50%, #6366f1 100%);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  .header {
    position: relative; z-index: 1;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    padding: 0 24px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .back-btn {
    display: flex; align-items: center; gap: 4px;
    height: 36px; padding: 0 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text-secondary); font-size: 14px;
    cursor: pointer; transition: all 0.2s; text-decoration: none;
    margin-right: 8px; flex-shrink: 0;
  }
  .back-btn:hover {
    background: var(--bg-card-hover); color: var(--accent-light);
    border-color: var(--border-active);
  }

  .header .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 600; letter-spacing: 0.02em;
  }
  .header .logo .dot {
    width: 9px; height: 9px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .header .meta {
    font-size: 12px; color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .app { position: relative; z-index: 1; display: flex; height: calc(100vh - 56px); }

  .sidebar {
    width: 280px; min-width: 280px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    padding: 20px 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px;
  }
  .sidebar .section-title {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted);
    margin: 12px 0 4px 12px;
  }
  .step-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--radius-sm);
    border: 1px solid transparent; background: transparent;
    color: var(--text-secondary); font-size: 13px;
    cursor: pointer; transition: all 0.2s;
    text-align: left; font-family: inherit; width: 100%;
  }
  .step-btn:hover {
    background: var(--bg-card); color: var(--text-primary);
    border-color: var(--border);
  }
  .step-btn.active {
    background: var(--bg-card); color: var(--accent-light);
    border-color: var(--border-active);
    box-shadow: 0 0 12px rgba(59,130,246,0.12);
  }
  .step-btn.done { color: var(--success); }
  .step-btn .step-index {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; font-family: var(--font-mono);
    background: var(--bg-card); border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .step-btn.active .step-index {
    background: var(--accent); border-color: var(--accent);
    color: #fff; box-shadow: 0 0 12px var(--accent-glow);
  }
  .step-btn.done .step-index {
    background: var(--success); border-color: var(--success); color: #fff;
  }
  .step-btn .step-label { line-height: 1.3; }
  .step-btn .step-label small {
    display: block; font-size: 11px; color: var(--text-muted); font-weight: 400;
  }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .main-header {
    padding: 16px 24px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,23,0.8); backdrop-filter: blur(8px);
  }
  .main-header h2 {
    font-size: 20px; font-weight: 600;
    background: var(--gradient-1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .main-header .subtitle {
    font-size: 12px; color: var(--text-muted); margin-top: 2px;
  }

  .canvas-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden;
  }
  svg.anim-svg { max-width: 100%; max-height: 100%; }

  .info-panel {
    width: 320px; min-width: 320px;
    background: var(--bg-secondary);
    border-left: 1px solid var(--border);
    padding: 20px 16px; overflow-y: auto;
  }
  .info-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px;
  }
  .info-card h4 {
    font-size: 13px; font-weight: 600;
    color: var(--accent-light); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .info-card h4 .indicator {
    width: 6px; height: 6px; background: var(--accent);
    border-radius: 50%; box-shadow: 0 0 8px var(--accent-glow);
  }
  .info-card p, .info-card li {
    font-size: 12.5px; line-height: 1.7; color: var(--text-secondary);
  }
  .info-card ul { padding-left: 16px; }
  .info-card li { margin-bottom: 4px; }
  .highlight { color: var(--accent-light); font-weight: 500; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 3px;
    font-size: 11px; font-weight: 500; font-family: var(--font-mono);
    background: rgba(59,130,246,0.12); color: var(--accent-light);
    border: 1px solid rgba(59,130,246,0.2); margin: 2px;
  }
  .tag.green {
    background: rgba(16,185,129,0.12); color: var(--success);
    border-color: rgba(16,185,129,0.2);
  }

  .controls {
    padding: 12px 24px; border-top: 1px solid var(--border);
    background: var(--bg-secondary);
    display: flex; align-items: center; gap: 10px;
  }
  .btn {
    padding: 8px 18px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text-primary); transition: all 0.2s;
    font-family: inherit; white-space: nowrap;
  }
  .btn:hover { background: var(--bg-card-hover); border-color: var(--border-active); }
  .btn:active { transform: scale(0.97); }
  .btn.primary {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600; letter-spacing: 0.03em;
  }
  .btn.primary:hover { background: #2563eb; box-shadow: 0 0 16px var(--accent-glow); }
  .btn.success { background: var(--success); border-color: var(--success); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  .progress-wrap {
    flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 8px;
  }
  .progress-bar {
    flex: 1; height: 4px; background: var(--border);
    border-radius: 2px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; background: var(--gradient-1);
    border-radius: 2px; transition: width 0.5s ease;
  }
  .progress-wrap .progress-text {
    font-size: 12px; color: var(--text-muted);
    font-family: var(--font-mono); white-space: nowrap;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.5; }
  }
  @keyframes dash { to { stroke-dashoffset: -40; } }
  @keyframes glowPulse {
    0%,100% { filter: drop-shadow(0 0 4px rgba(59,130,246,0.4)); }
    50% { filter: drop-shadow(0 0 14px rgba(59,130,246,0.8)); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim-pulse { animation: pulse 2s ease-in-out infinite; }
  .anim-dash { animation: dash 1.5s linear infinite; }
  .anim-glow { animation: glowPulse 2s ease-in-out infinite; }
  .anim-fade { animation: fadeInUp 0.5s ease forwards; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  .quiz-option {
    display: block; width: 100%; padding: 10px 14px; margin: 6px 0;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text-secondary);
    font-size: 13px; cursor: pointer; text-align: left;
    font-family: inherit; transition: all 0.2s;
  }
  .quiz-option:hover { border-color: var(--border-active); color: var(--text-primary); }
  .quiz-option.correct { border-color: var(--success); background: rgba(16,185,129,0.1); color: var(--success); }
  .quiz-option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); color: #ef4444; }

  @media (max-width: 1200px) {
    .info-panel { width: 260px; min-width: 260px; }
    .sidebar { width: 240px; min-width: 240px; }
  }
  @media (max-width: 900px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; min-width: 100%; flex-direction: row; flex-wrap: wrap; gap: 4px; padding: 10px; }
    .sidebar .section-title { display: none; }
    .step-btn { flex: 1; min-width: 120px; font-size: 11px; }
    .info-panel { width: 100%; min-width: 100%; }
    .canvas-area { padding: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <a href="main5.html" class="back-btn" title="返回">&larr; 返回</a>
  <div class="logo">
    <span class="dot"></span>
    植物体细胞杂交 · 交互实验
  </div>
  <div class="meta">选择性必修3 &nbsp;|&nbsp; 第2章 细胞工程 &nbsp;|&nbsp; 第1节</div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="section-title">实验流程</div>
    <button class="step-btn active" data-step="0" onclick="goToStep(0)">
      <span class="step-index">0</span>
      <span class="step-label">实验背景<small>生殖隔离与体细胞杂交概念</small></span>
    </button>
    <button class="step-btn" data-step="1" onclick="goToStep(1)">
      <span class="step-index">1</span>
      <span class="step-label">获取原生质体<small>纤维素酶 + 果胶酶处理</small></span>
    </button>
    <button class="step-btn" data-step="2" onclick="goToStep(2)">
      <span class="step-index">2</span>
      <span class="step-label">原生质体融合<small>PEG / 电融合诱导</small></span>
    </button>
    <button class="step-btn" data-step="3" onclick="goToStep(3)">
      <span class="step-index">3</span>
      <span class="step-label">杂种细胞形成<small>再生细胞壁与筛选</small></span>
    </button>
    <button class="step-btn" data-step="4" onclick="goToStep(4)">
      <span class="step-index">4</span>
      <span class="step-label">脱分化 · 愈伤组织<small>愈伤组织诱导与培养</small></span>
    </button>
    <button class="step-btn" data-step="5" onclick="goToStep(5)">
      <span class="step-index">5</span>
      <span class="step-label">再分化 · 杂种植株<small>生芽 / 生根 / 完整植株</small></span>
    </button>
    <button class="step-btn" data-step="6" onclick="goToStep(6)">
      <span class="step-index">6</span>
      <span class="step-label">总结与练习<small>知识梳理 + 概念检测</small></span>
    </button>
  </div>

  <div class="main">
    <div class="main-header">
      <h2 id="stageTitle">实验背景</h2>
      <div class="subtitle" id="stageSubtitle">为什么需要植物体细胞杂交技术？</div>
    </div>

    <div class="canvas-area" id="canvasArea"></div>

    <div class="controls">
      <button class="btn" id="btnPrev" onclick="prevStep()">上一步</button>
      <button class="btn primary" id="btnNext" onclick="nextStep()">下一步</button>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        <span class="progress-text" id="progressText">0 / 7</span>
      </div>
      <button class="btn" id="btnAuto" onclick="toggleAutoPlay()">自动演示</button>
      <button class="btn" id="btnReset" onclick="resetAll()">重置</button>
    </div>
  </div>

  <div class="info-panel" id="infoPanel"></div>
</div>

<script>
const svgNS = 'http://www.w3.org/2000/svg';

let currentStep = 0;
let autoPlayInterval = null;
let isAutoPlaying = false;

function goToStep(idx) {
  if (idx < 0 || idx >= 7) return;
  currentStep = idx;
  updateUI();
}
function nextStep() {
  if (currentStep < 6) { currentStep++; updateUI(); }
}
function prevStep() {
  if (currentStep > 0) { currentStep--; updateUI(); }
}

function updateUI() {
  const steps = [
    { title:'实验背景', sub:'生殖隔离与体细胞杂交的提出' },
    { title:'步骤一：获取原生质体', sub:'纤维素酶 + 果胶酶 去除细胞壁' },
    { title:'步骤二：原生质体融合', sub:'PEG融合法 / 电融合法 诱导融合' },
    { title:'步骤三：杂种细胞形成', sub:'融合后再生细胞壁，形成杂种细胞' },
    { title:'步骤四：脱分化 · 形成愈伤组织', sub:'杂种细胞脱分化 → 愈伤组织' },
    { title:'步骤五：再分化 · 形成杂种植株', sub:'愈伤组织 → 生芽 → 生根 → 完整植株' },
    { title:'总结与练习', sub:'知识梳理与概念检测' }
  ];
  document.getElementById('stageTitle').textContent = steps[currentStep].title;
  document.getElementById('stageSubtitle').textContent = steps[currentStep].sub;

  document.querySelectorAll('.step-btn').forEach((btn,i) => {
    btn.classList.remove('active','done');
    if(i===currentStep) btn.classList.add('active');
    else if(i<currentStep) btn.classList.add('done');
  });

  const pct = Math.round((currentStep/6)*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressText').textContent = currentStep+' / 6';
  document.getElementById('btnPrev').disabled = (currentStep===0);
  document.getElementById('btnNext').disabled = (currentStep===6);

  renderCanvas(currentStep);
  renderInfo(currentStep);
}

// ==================== SVG HELPERS ====================
function mkSVG(w,h){
  const s=document.createElementNS(svgNS,'svg');
  s.setAttribute('viewBox',`0 0 ${w} ${h}`);
  s.setAttribute('width','100%'); s.setAttribute('height','100%');
  s.setAttribute('class','anim-svg'); s.style.maxWidth='900px';
  return s;
}
function addT(svg,x,y,t,opts={}){
  const e=document.createElementNS(svgNS,'text');
  e.setAttribute('x',x); e.setAttribute('y',y);
  e.setAttribute('fill',opts.f||'#94a3b8');
  e.setAttribute('font-size',opts.s||12);
  e.setAttribute('font-weight',opts.w||400);
  e.setAttribute('text-anchor',opts.a||'middle');
  if(opts.fm) e.setAttribute('font-family',opts.fm);
  e.textContent=t; svg.appendChild(e); return e;
}
function addR(svg,x,y,w,h,opts={}){
  const r=document.createElementNS(svgNS,'rect');
  r.setAttribute('x',x); r.setAttribute('y',y);
  r.setAttribute('width',w); r.setAttribute('height',h);
  r.setAttribute('rx',opts.rx||4); r.setAttribute('fill',opts.f||'none');
  r.setAttribute('stroke',opts.st||'#1e3048'); r.setAttribute('stroke-width',opts.sw||1.5);
  if(opts.da) r.setAttribute('stroke-dasharray',opts.da);
  if(opts.op!=null) r.setAttribute('opacity',opts.op);
  if(opts.cl) r.classList.add(opts.cl);
  svg.appendChild(r); return r;
}
function addC(svg,cx,cy,r,opts={}){
  const c=document.createElementNS(svgNS,'circle');
  c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
  c.setAttribute('fill',opts.f||'none'); c.setAttribute('stroke',opts.st||'#1e3048');
  c.setAttribute('stroke-width',opts.sw||1.5);
  if(opts.da) c.setAttribute('stroke-dasharray',opts.da);
  if(opts.op!=null) c.setAttribute('opacity',opts.op);
  if(opts.cl) c.classList.add(opts.cl);
  svg.appendChild(c); return c;
}
function addL(svg,x1,y1,x2,y2,opts={}){
  const l=document.createElementNS(svgNS,'line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1);
  l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke',opts.st||'#475569'); l.setAttribute('stroke-width',opts.sw||1.5);
  if(opts.da) l.setAttribute('stroke-dasharray',opts.da);
  if(opts.mk) l.setAttribute('marker-end',`url(#${opts.mk})`);
  if(opts.cl) l.classList.add(opts.cl);
  svg.appendChild(l); return l;
}
function addDefs(svg){
  const d=document.createElementNS(svgNS,'defs');
  const mk=document.createElementNS(svgNS,'marker');
  mk.setAttribute('id','arrow'); mk.setAttribute('viewBox','0 0 10 10');
  mk.setAttribute('refX',9); mk.setAttribute('refY',5);
  mk.setAttribute('markerWidth',7); mk.setAttribute('markerHeight',7);
  mk.setAttribute('orient','auto');
  const ap=document.createElementNS(svgNS,'path');
  ap.setAttribute('d','M0,0 L10,5 L0,10 Z'); ap.setAttribute('fill','#475569');
  mk.appendChild(ap); d.appendChild(mk);

  ['A','B','H'].forEach((t,i)=>{
    const g=document.createElementNS(svgNS,'radialGradient');
    g.setAttribute('id','g'+t);
    const cols = i===0?['#3b82f6','#1d4ed8']:i===1?['#f59e0b','#b45309']:['#10b981','#047857'];
    [0,100].forEach((off,j)=>{
      const s=document.createElementNS(svgNS,'stop');
      s.setAttribute('offset',off+'%'); s.setAttribute('stop-color',cols[j]);
      s.setAttribute('stop-opacity',j===0?'0.22':'0.07'); g.appendChild(s);
    });
    d.appendChild(g);
  });
  svg.appendChild(d);
}

function drawCell(svg,cx,cy,r,type){
  const isProto=type.includes('proto'), isHybrid=type==='hybrid';
  let mc,wc,nc,gg;
  if(type==='A'||type==='protoA'){ mc='#3b82f6'; wc='#64748b'; nc='#60a5fa'; gg='url(#gA)'; }
  else if(type==='B'||type==='protoB'){ mc='#f59e0b'; wc='#64748b'; nc='#fbbf24'; gg='url(#gB)'; }
  else { mc='#10b981'; wc='#475569'; nc='#6ee7b7'; gg='url(#gH)'; }
  addC(svg,cx,cy,r,{f:gg,st:'none',sw:0});
  if(!isProto) addC(svg,cx,cy,r,{f:'none',st:wc,sw:3,da:isHybrid?'6,3':'none',cl:isHybrid?'anim-dash':''});
  const mr=isProto?r:r-4;
  addC(svg,cx,cy,mr,{f:'none',st:mc,sw:2,op:0.8});
  const nr=r*0.28;
  addC(svg,cx,cy,nr,{f:nc,st:'none',sw:0,op:0.5,cl:'anim-glow'});
  addC(svg,cx,cy,nr*0.6,{f:nc,st:'none',sw:0,op:0.7});
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2+0.3;
    addC(svg,cx+Math.cos(a)*r*0.55,cy+Math.sin(a)*r*0.55,2.5,{f:mc,st:'none',sw:0,op:0.35});
  }
}

function renderCanvas(idx){
  const ca=document.getElementById('canvasArea'); ca.innerHTML='';
  const svg=mkSVG(800,440); addDefs(svg);
  const cA='#3b82f6',cB='#f59e0b',cH='#10b981',cCa='#a78bfa',cSh='#22c55e';

  if(idx===0){ // Background
    addR(svg,60,20,680,40,{f:'rgba(59,130,246,0.06)',st:'rgba(59,130,246,0.15)',rx:8});
    addT(svg,400,46,'植物体细胞杂交技术 · 完整流程',{s:15,w:600,f:'#cbd5e1'});

    addR(svg,90,100,140,60,{f:'rgba(59,130,246,0.06)',st:'rgba(59,130,246,0.25)',rx:8});
    addT(svg,160,125,'甲植物细胞',{s:13,w:600,f:'#60a5fa'});
    addT(svg,160,145,'Plant A Cell',{s:10,f:'#64748b',fm:'monospace'});
    drawCell(svg,160,210,28,'A');

    addR(svg,570,100,140,60,{f:'rgba(245,158,11,0.06)',st:'rgba(245,158,11,0.25)',rx:8});

function toggleAutoPlay(){
  const btn=document.getElementById('btnAuto');
  if(isAutoPlaying){ stopAutoPlay(); btn.textContent='自动演示'; btn.classList.remove('success'); }
  else { startAutoPlay(); btn.textContent='停止演示'; btn.classList.add('success'); }
}
function startAutoPlay(){
  isAutoPlaying=true;
  autoPlayInterval=setInterval(()=>{
    if(currentStep<6){ currentStep++; updateUI(); }
    else { stopAutoPlay(); document.getElementById('btnAuto').textContent='自动演示'; document.getElementById('btnAuto').classList.remove('success'); }
  },3500);
}
function stopAutoPlay(){
  isAutoPlaying=false;
  if(autoPlayInterval){ clearInterval(autoPlayInterval); autoPlayInterval=null; }
}
function resetAll(){
  stopAutoPlay();
  document.getElementById('btnAuto').textContent='自动演示';
  document.getElementById('btnAuto').classList.remove('success');
  currentStep=0; updateUI();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); nextStep(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prevStep(); }
  else if(e.key==='r'||e.key==='R'){ e.preventDefault(); resetAll(); }
  else if(e.key==='a'||e.key==='A'){ e.preventDefault(); toggleAutoPlay(); }
});

updateUI();
</script>

</html>
