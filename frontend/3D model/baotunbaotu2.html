<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分泌蛋白的合成与运输 — 教学动画</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "黑体", sans-serif;
      background: #eef1f5
    }

    #cv {
      display: block;
      position: fixed;
      inset: 0
    }

    .controls {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .ctrl-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid #c0c8d0;
      background: rgba(255, 255, 255, 0.85);
      color: #555;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
      backdrop-filter: blur(6px)
    }

    .ctrl-btn:hover {
      background: #fff;
      border-color: #5b9bd5;
      color: #5b9bd5
    }

    .ctrl-btn.on {
      background: #5b9bd5;
      border-color: #5b9bd5;
      color: #fff
    }

    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      padding: 8px 18px;
      border-radius: 20px;
      border: 1.5px solid #c0c8d0;
      background: rgba(255, 255, 255, 0.85);
      color: #555;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
      backdrop-filter: blur(6px)
    }

    .back-btn:hover {
      background: #fff;
      border-color: #5b9bd5;
      color: #5b9bd5
    }

    .switch-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      padding: 8px 18px;
      border-radius: 20px;
      border: 1.5px solid #c0c8d0;
      background: rgba(255, 255, 255, 0.85);
      color: #555;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
      backdrop-filter: blur(6px)
    }

    .switch-btn:hover {
      background: #fff;
      border-color: #5b9bd5;
      color: #5b9bd5
    }

    .speed-label {
      color: #888;
      font-size: 12px;
      margin: 0 2px;
    }
  </style>
</head>

<body>
  <canvas id="cv"></canvas>
  <button class="back-btn" onclick="location.href='main.html'" title="返回主页面">← 返回</button>
  <button class="switch-btn" onclick="location.href='baotunbaotu.html'" title="切换到胞吞与胞吐">← 胞吞与胞吐</button>
  <div class="controls">
    <button class="ctrl-btn on" id="btnPlay" onclick="togglePlay()">⏯ 播放</button>
    <span class="speed-label">速度</span>
    <button class="ctrl-btn" data-speed="0.5" onclick="setSpeed(0.5, this)">0.5×</button>
    <button class="ctrl-btn on" data-speed="1" id="defaultSpeed" onclick="setSpeed(1, this)">1×</button>
    <button class="ctrl-btn" data-speed="0.75" onclick="setSpeed(0.75, this)">0.75×</button>
    <button class="ctrl-btn" data-speed="1.5" onclick="setSpeed(1.5, this)">1.5×</button>
    <button class="ctrl-btn" onclick="resetAnim()">↺ 重置</button>
  </div>

  <script>
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(devicePixelRatio, devicePixelRatio);
    }
    resize();
    window.addEventListener('resize', resize);

    // ===== 设计常量 =====
    const LOOP_DURATION = 12;

    const C = {
      bg: '#f5f6f8',
      cyto: '#e8ecf1',
      panelDiv: '#d5dbe3',
      membrane: '#4a8dc7',
      membraneL: '#7ab4de',
      nucleus: '#9aa8b8',
      nucleusFill: '#dce3ea',
      er: '#b088d0',
      erL: '#c8a8e0',
      golgi: '#f0a040',
      golgiL: '#f5c070',
      vesicle: '#f0a040',
      vesicleL: '#f5c070',
      ribosome: '#e0554a',
      ribosomeL: '#f08070',
      protein: '#e8b830',
      proteinL: '#f0d060',
      secretion: '#4caf84',
      secretionL: '#70c89a',
      text: '#3a3a3a',
      textLight: '#777',
      arrow: '#888',
      stageTag: '#5b9bd5',
      chartBg: '#f0f2f5',
      chartGrid: '#dde0e4',
    };

    const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function easeOut(t) { return 1 - (1 - t) * (1 - t); }

    let progress = 0;
    let playing = true;
    let speed = 1;
    let lastTs = 0;

    // ===== 绘图辅助 =====
    function drawDoubleLineMembrane(ctx, points, color1, color2, lw1, lw2) {
      if (points.length < 2) return;
      const n = points.length;
      const gap = 3.2;

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y - gap);
      for (let i = 1; i < n; i++) ctx.lineTo(points[i].x, points[i].y - gap);
      ctx.strokeStyle = color2; ctx.lineWidth = lw2 || 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y + gap);
      for (let i = 1; i < n; i++) ctx.lineTo(points[i].x, points[i].y + gap);
      ctx.strokeStyle = color1; ctx.lineWidth = lw1 || 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y - gap);
      for (let i = 1; i < n; i++) ctx.lineTo(points[i].x, points[i].y - gap);
      for (let i = n - 1; i >= 0; i--) ctx.lineTo(points[i].x, points[i].y + gap);
      ctx.closePath();
      ctx.fillStyle = 'rgba(74,141,199,0.08)';
      ctx.fill();
    }

    function drawCircle(ctx, x, y, r, fill, stroke, sw) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw || 1.5; ctx.stroke(); }
    }

    function drawArrow(ctx, x1, y1, x2, y2, color, width) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len < 2) return;
      const ux = dx / len, uy = dy / len;
      const headLen = Math.min(10, len * 0.35);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2 - ux * headLen, y2 - uy * headLen);
      ctx.strokeStyle = color; ctx.lineWidth = width || 1.8; ctx.lineCap = 'round'; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - ux * headLen - uy * headLen * 0.5, y2 - uy * headLen + ux * headLen * 0.5);
      ctx.lineTo(x2 - ux * headLen + uy * headLen * 0.5, y2 - uy * headLen - ux * headLen * 0.5);
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
    }

    function drawLabel(ctx, x, y, text, color, size, align) {
      ctx.font = `${size || 14}px "Microsoft YaHei","PingFang SC","黑体",sans-serif`;
      ctx.textAlign = align || 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color || C.text;
      ctx.fillText(text, x, y);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    // ===== 膜面积与膜含量变化曲线计算 =====
    // 膜面积: 物理表面积，出芽/融合时立即变化，恢复快（膜的流动性）
    function getMembraneAreas(p) {
      let er = 100;
      if (p > 0.28 && p < 0.42) {
        const t = (p - 0.28) / 0.14;
        if (t < 0.5) er -= easeInOut(t * 2) * 8;
        else er -= (1 - easeInOut((t - 0.5) * 2)) * 8;
      }
      let ga = 100;
      if (p > 0.45 && p < 0.58) {
        const t = (p - 0.45) / 0.13;
        if (t < 0.6) ga += easeInOut(t / 0.6) * 6;
        else ga += (1 - easeInOut((t - 0.6) / 0.4)) * 6;
      }
      if (p > 0.68 && p < 0.82) {
        const t = (p - 0.68) / 0.14;
        if (t < 0.5) ga -= easeInOut(t * 2) * 6;
        else ga -= (1 - easeInOut((t - 0.5) * 2)) * 6;
      }
      let cm = 100;
      if (p > 0.84 && p < 0.96) {
        const t = (p - 0.84) / 0.12;
        if (t < 0.5) cm += easeInOut(t * 2) * 5;
        else cm += (1 - easeInOut((t - 0.5) * 2)) * 5;
      }
      return [er, ga, cm];
    }

    // 膜含量: 膜物质总量（脂质+蛋白质），同向变化但恢复明显更慢（需合成补充）
    function getMembraneContent(p) {
      let er = 100;
      if (p > 0.28 && p < 0.48) {
        const t = (p - 0.28) / 0.20;
        if (t < 0.45) er -= easeInOut(t / 0.45) * 7;
        else er -= (1 - easeInOut(Math.min((t - 0.45) / 0.55, 1))) * 7;
      }
      let ga = 100;
      if (p > 0.45 && p < 0.62) {
        const t = (p - 0.45) / 0.17;
        if (t < 0.5) ga += easeInOut(t / 0.5) * 5;
        else ga += (1 - easeInOut((t - 0.5) / 0.5)) * 5;
      }
      if (p > 0.68 && p < 0.88) {
        const t = (p - 0.68) / 0.20;
        if (t < 0.45) ga -= easeInOut(t / 0.45) * 5;
        else ga -= (1 - easeInOut(Math.min((t - 0.45) / 0.55, 1))) * 5;
      }
      let cm = 100;
      if (p > 0.84) {
        const t = Math.min((p - 0.84) / 0.16, 1);
        if (t < 0.5) cm += easeInOut(t / 0.5) * 4;
        else cm += 4 * (1 - easeInOut(Math.min((t - 0.5) / 0.5, 1)));
      }
      return [er, ga, cm];
    }

    // 通用折线图面板绘制
    function drawChartPanel(ctx, p, x, y, w, h, title, dataFn) {
      const charts = [
        { label: '内质网膜', color: C.er },
        { label: '高尔基体膜', color: C.golgi },
        { label: '细胞膜', color: C.membrane },
      ];
      const count = charts.length;
      const gap = 10;
      const eachH = (h - gap * (count - 1)) / count;
      const yRange = 16;
      const samples = 80;

      // 面板背景
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); roundRect(ctx, x - 6, y - 6, w + 12, h + 12, 8);
      ctx.fill();
      ctx.strokeStyle = C.panelDiv;
      ctx.lineWidth = 1;
      ctx.stroke();

      // 标题
      drawLabel(ctx, x + w / 2, y - 18, title, C.textLight, 11, 'center');

      const curVals = dataFn(p);

      for (let ci = 0; ci < count; ci++) {
        const cy = y + ci * (eachH + gap);
        const c = charts[ci];
        const botY = cy + eachH - 4;
        const yPerUnit = (eachH - 8) / yRange;

        // 小图背景
        ctx.fillStyle = C.chartBg;
        ctx.beginPath(); roundRect(ctx, x, cy, w, eachH, 5);
        ctx.fill();

        // 基线 (100)
        const baseY = cy + eachH / 2;
        ctx.beginPath();
        ctx.setLineDash([3, 4]);
        ctx.moveTo(x + 4, baseY);
        ctx.lineTo(x + w - 4, baseY);
        ctx.strokeStyle = C.chartGrid;
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.setLineDash([]);

        // 曲线
        ctx.beginPath();
        let first = true;
        for (let i = 0; i <= samples; i++) {
          const sp = i / samples;
          const vals = dataFn(sp);
          const sx = x + 2 + (w - 4) * sp;
          const sy = botY - (vals[ci] - 92) * yPerUnit;
          if (first) { ctx.moveTo(sx, sy); first = false; }
          else ctx.lineTo(sx, sy);
        }
        ctx.strokeStyle = c.color;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();

        // 当前值点
        const curSX = x + 2 + (w - 4) * (p % 1);
        const curSY = botY - (curVals[ci] - 92) * yPerUnit;
        drawCircle(ctx, curSX, curSY, 3.5, '#fff', c.color, 1.8);

        // 竖线光标
        ctx.beginPath();
        ctx.moveTo(curSX, cy + 4);
        ctx.lineTo(curSX, cy + eachH - 4);
        ctx.strokeStyle = 'rgba(0,0,0,0.10)';
        ctx.lineWidth = 0.7;
        ctx.stroke();

        // 标签 (左侧)
        drawLabel(ctx, x + 4, cy + eachH / 2, c.label, c.color, 9.5, 'left');

        // 当前数值 (右侧)
        drawLabel(ctx, x + w - 4, cy + 4, curVals[ci].toFixed(1), c.color, 9, 'right');
      }
    }

    // ===== 细胞结构绘制 =====

    function getCellMembranePoints(cx, cy, rx, ry, sp) {
      const N = 120;
      const pts = [];
      const exoAngle = 0.15;
      let exoBulge = 0;
      if (sp >= 0.78) {
        const t = clamp((sp - 0.78) / 0.12, 0, 1);
        exoBulge = lerp(0, ry * 0.09, easeInOut(clamp(t, 0, 0.7)));
        if (t > 0.7) {
          const t2 = (t - 0.7) / 0.3;
          exoBulge = lerp(ry * 0.09, 0, easeOut(t2));
        }
      }
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const wobble = Math.sin(a * 6 + 0.7) * 3 + Math.cos(a * 4 + 1.2) * 2.5;
        let r = rx + wobble;
        const da = Math.atan2(Math.sin(a - exoAngle), Math.cos(a - exoAngle));
        if (Math.abs(da) < 0.5) {
          r += exoBulge * Math.exp(-da * da / (2 * 0.15 * 0.15));
        }
        pts.push({
          x: cx + r * Math.cos(a),
          y: cy + (ry + wobble * 0.6) * Math.sin(a) * (ry / rx)
        });
      }
      return pts;
    }

    function drawCellMembrane(ctx, cx, cy, rx, ry, sp) {
      const pts = getCellMembranePoints(cx, cy, rx, ry, sp);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.fillStyle = C.cyto;
      ctx.fill();
      drawDoubleLineMembrane(ctx, pts, C.membrane, C.membraneL, 2.8, 2.4);
    }

    function drawNucleus(ctx, nx, ny, nrx, nry) {
      const N = 60;
      const outer = [];
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const wobble = Math.sin(a * 5) * 2;
        outer.push({
          x: nx + (nrx + wobble) * Math.cos(a),
          y: ny + (nry + wobble * 0.7) * Math.sin(a)
        });
      }
      ctx.beginPath();
      ctx.moveTo(outer[0].x, outer[0].y);
      for (let i = 1; i < N; i++) ctx.lineTo(outer[i].x, outer[i].y);
      ctx.closePath();
      ctx.fillStyle = C.nucleusFill;
      ctx.fill();
      ctx.strokeStyle = C.nucleus;
      ctx.lineWidth = 2.2;
      ctx.stroke();

      ctx.beginPath();
      ctx.setLineDash([4, 3]);
      ctx.moveTo(outer[0].x - 1.8, outer[0].y - 1.8);
      for (let i = 1; i < N; i++) ctx.lineTo(outer[i].x - 1.8, outer[i].y - 1.8);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(154,168,184,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);

      drawCircle(ctx, nx + nrx * 0.2, ny - nry * 0.15, nry * 0.2, 'rgba(180,190,200,0.35)', C.nucleus, 1.2);

      const poreAngles = [-1.2, -0.5, 0.2, 0.9, 1.7, 2.3, -1.8];
      for (const pa of poreAngles) {
        const px = nx + nrx * Math.cos(pa);
        const py = ny + nry * Math.sin(pa);
        drawCircle(ctx, px, py, 5, '#e8ecf1', C.nucleus, 1.5);
        drawCircle(ctx, px, py, 2.2, C.membrane, null, 0);
      }
    }

    function getERCurvePoints(nx, ny, nrx, nry) {
      const pts = [];
      const erRx = nrx + 35;
      const erRy = nry + 28;
      const N = 90;
      for (let i = 0; i < N; i++) {
        const a = -Math.PI * 0.72 + (Math.PI * 1.28 / (N - 1)) * i;
        const wobble = Math.sin(a * 7 + 1.3) * 11 + Math.cos(a * 5.5 + 2.1) * 8 + Math.sin(a * 13) * 4;
        pts.push({
          x: nx + (erRx + wobble) * Math.cos(a),
          y: ny + (erRy + wobble * 0.65) * Math.sin(a)
        });
      }
      return pts;
    }

    function drawER(ctx, nx, ny, nrx, nry) {
      const erPts = getERCurvePoints(nx, ny, nrx, nry);

      // 主 ER 管网 — 单层膜结构，多层叠加模拟内质网扁平囊状管网
      for (let pass = 0; pass < 3; pass++) {
        ctx.beginPath();
        ctx.moveTo(erPts[0].x, erPts[0].y);
        for (let i = 1; i < erPts.length; i++) {
          const offsetY = pass === 0 ? -2.8 : pass === 2 ? 2.8 : 0;
          ctx.lineTo(erPts[i].x, erPts[i].y + offsetY);
        }
        const alpha = pass === 1 ? 1 : 0.3;
        ctx.strokeStyle = pass === 1 ? C.er : C.erL;
        ctx.lineWidth = pass === 1 ? 3.8 : 2.2;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.globalAlpha = alpha;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // ER 延伸分支（通向高尔基体）
      const erMid = erPts[Math.floor(erPts.length * 0.43)];
      const erMid2 = erPts[Math.floor(erPts.length * 0.57)];
      if (erMid && erMid2) {
        for (const branch of [
          { sx: erMid.x, sy: erMid.y, ex: erMid.x + 60, ey: erMid.y - 18 },
          { sx: erMid2.x, sy: erMid2.y, ex: erMid2.x + 55, ey: erMid2.y + 16 }
        ]) {
          ctx.beginPath();
          ctx.moveTo(branch.sx, branch.sy);
          ctx.bezierCurveTo(branch.sx + 20, branch.sy - 4, branch.ex - 15, branch.ey - 4, branch.ex, branch.ey);
          ctx.strokeStyle = C.erL;
          ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
          ctx.strokeStyle = C.er;
          ctx.lineWidth = 2.5; ctx.stroke();
        }
      }
    }

    function drawRibosomes(ctx, nx, ny, nrx, nry, highlightIdx) {
      const erPts = getERCurvePoints(nx, ny, nrx, nry);
      const step = 6;
      for (let i = 0; i < erPts.length; i += step) {
        const p = erPts[i];
        const next = erPts[Math.min(i + 2, erPts.length - 1)];
        const dx = -(next.y - p.y);
        const dy = (next.x - p.x);
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const offset = 12;
        const rx = p.x + (dx / dist) * offset;
        const ry = p.y + (dy / dist) * offset;
        const isHl = (Math.abs(i - highlightIdx) < step);
        drawCircle(ctx, rx, ry, isHl ? 4.5 : 2.5, isHl ? C.ribosome : C.ribosomeL, isHl ? '#fff' : null, isHl ? 1.5 : 0);
        if (isHl) drawCircle(ctx, rx, ry, 7, 'rgba(224,85,74,0.2)', null, 0);
      }
    }

    function drawGolgi(ctx, gcx, gcy) {
      const stacks = [
        { rx: 95, ry: 20, dy: -50 },
        { rx: 82, ry: 20, dy: -22 },
        { rx: 72, ry: 19, dy: 6 },
        { rx: 62, ry: 18, dy: 32 },
      ];
      for (const s of stacks) {
        const cx = gcx, cy = gcy + s.dy;
        ctx.beginPath(); ctx.ellipse(cx, cy, s.rx, s.ry, -0.06, Math.PI, 0);
        ctx.strokeStyle = C.golgiL; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(cx, cy, s.rx, s.ry, -0.06, 0, Math.PI);
        ctx.strokeStyle = C.golgi; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(cx, cy, s.rx, s.ry, -0.06, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(240,160,64,0.05)'; ctx.fill();
      }
      const budPos = [
        { x: gcx - 75, y: gcy - 48 },
        { x: gcx + 70, y: gcy + 30 },
        { x: gcx - 55, y: gcy + 28 },
      ];
      for (const b of budPos) {
        drawCircle(ctx, b.x + Math.sin(progress * 20 + b.x) * 2, b.y + Math.cos(progress * 20 + b.y) * 2,
          3.5, 'rgba(240,160,64,0.4)', null, 0);
      }
    }

    // ===== 主渲染 =====
    function render(p) {
      const W = innerWidth, H = innerHeight;

      // 细胞位置 — 左侧留出空间给图表
      const cellCX = W * 0.376;
      const cellCY = H * 0.50;
      const cellRX = W * 0.332;
      const cellRY = H * 0.40;

      // 图表面板位置 — 右侧，上下两个面板
      const chartW = Math.min(168, W * 0.16);
      const chartX = W - chartW - 14;
      const chartY1 = H * 0.13;
      const chartGap = 20;
      const eachPanelH = (H * 0.68 - chartGap) / 2;
      const chartY2 = chartY1 + eachPanelH + chartGap;

      // 细胞核
      const nucCX = cellCX - cellRX * 0.28;
      const nucCY = cellCY;
      const nucRX = cellRX * 0.28;
      const nucRY = cellRY * 0.62;

      // 高尔基体
      const golgiCX = cellCX + cellRX * 0.28;
      const golgiCY = cellCY + cellRY * 0.02;

      // 分泌位点
      const exoAngle = 0.15;
      const exoX = cellCX + cellRX * Math.cos(exoAngle);
      const exoY = cellCY + cellRY * Math.sin(exoAngle);

      // ER 曲线点
      const erPts = getERCurvePoints(nucCX, nucCY, nucRX, nucRY);
      const erEntryIdx = Math.floor(erPts.length * 0.4);
      const erExitIdx = Math.floor(erPts.length * 0.55);
      const erEntry = erPts[erEntryIdx];
      const erExit = erPts[erExitIdx];

      const golgiEntryX = golgiCX - 30;
      const golgiEntryY = golgiCY - 48;
      const golgiExitX = golgiCX + 20;
      const golgiExitY = golgiCY + 40;

      // === 清屏 ===
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);

      // === 绘制细胞 ===
      drawCellMembrane(ctx, cellCX, cellCY, cellRX, cellRY, p);

      // 细胞质微粒
      for (let i = 0; i < 50; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * (cellRX - 25);
        const sx = cellCX + r * Math.cos(a);
        const sy = cellCY + r * Math.sin(a) * (cellRY / cellRX);
        const ndx = (sx - nucCX) / nucRX;
        const ndy = (sy - nucCY) / nucRY;
        if (ndx * ndx + ndy * ndy < 1.2) continue;
        ctx.fillStyle = 'rgba(160,180,200,0.1)';
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      drawNucleus(ctx, nucCX, nucCY, nucRX, nucRY);
      drawER(ctx, nucCX, nucCY, nucRX, nucRY);

      let highlightRibo = -1;
      if (p < 0.15) highlightRibo = Math.floor(erPts.length * 0.36);
      drawRibosomes(ctx, nucCX, nucCY, nucRX, nucRY, highlightRibo);
      drawGolgi(ctx, golgiCX, golgiCY);

      // === 蛋白质与囊泡动画 ===
      let proteinX, proteinY, proteinVisible = false;
      let vesicleData = null;
      let vesicleProtein = false;
      let exoStage = 0;
      let inGolgi = false;

      if (p < 0.15) {
        const t = p / 0.15;
        if (t < 0.35) {
          const ri = erPts[Math.floor(erPts.length * 0.36)];
          proteinX = ri.x + 14;
          proteinY = ri.y - 2;
          proteinVisible = true;
        } else {
          const t2 = (t - 0.35) / 0.65;
          const ri = erPts[Math.floor(erPts.length * 0.36)];
          proteinX = lerp(ri.x + 14, erEntry.x, easeInOut(t2));
          proteinY = lerp(ri.y - 2, erEntry.y - 6, easeInOut(t2));
          proteinVisible = true;
        }
      } else if (p < 0.30) {
        const t = (p - 0.15) / 0.15;
        proteinX = lerp(erEntry.x, erExit.x, easeInOut(t));
        proteinY = lerp(erEntry.y - 6, erExit.y - 8, easeInOut(t));
        proteinVisible = true;
      } else if (p < 0.40) {
        const t = (p - 0.30) / 0.10;
        const vr = lerp(4, 11, easeOut(t));
        const vx = lerp(erExit.x, erExit.x + (golgiEntryX - erExit.x) * 0.35, easeOut(t));
        const vy = lerp(erExit.y - 8, erExit.y + (golgiEntryY - erExit.y) * 0.35 - 8, easeOut(t));
        vesicleData = { x: vx, y: vy, r: vr, alpha: 1 };
        vesicleProtein = true;
      } else if (p < 0.55) {
        const t = (p - 0.40) / 0.15;
        const ease = easeInOut(t);
        const vx = lerp(erExit.x + (golgiEntryX - erExit.x) * 0.35, golgiEntryX, ease);
        const vy = lerp(erExit.y + (golgiEntryY - erExit.y) * 0.35 - 8, golgiEntryY, ease);
        const vr = lerp(11, 8, t > 0.7 ? (t - 0.7) / 0.3 : 0);
        vesicleData = { x: vx, y: vy, r: Math.max(vr, 3), alpha: t > 0.85 ? lerp(1, 0.3, (t - 0.85) / 0.15) : 1 };
        vesicleProtein = true;
      } else if (p < 0.70) {
        const t = (p - 0.55) / 0.15;
        inGolgi = true;
        const stackIdx = Math.floor(t * 4);
        const s = [
          { x: golgiCX, y: golgiCY - 50 },
          { x: golgiCX + 8, y: golgiCY - 22 },
          { x: golgiCX + 4, y: golgiCY + 6 },
          { x: golgiCX - 4, y: golgiCY + 32 },
        ][Math.min(stackIdx, 3)];
        proteinX = s.x + Math.sin(t * Math.PI * 2) * 12;
        proteinY = s.y;
        proteinVisible = true;
      } else if (p < 0.80) {
        const t = (p - 0.70) / 0.10;
        const vr = lerp(4, 10, easeOut(t));
        const vx = lerp(golgiExitX, golgiExitX + (exoX - golgiExitX) * 0.3, easeOut(t));
        const vy = lerp(golgiExitY, golgiExitY + (exoY - golgiExitY) * 0.3, easeOut(t));
        vesicleData = { x: vx, y: vy, r: vr, alpha: 1 };
        vesicleProtein = true;
      } else {
        const t = (p - 0.80) / 0.20;
        if (t < 0.45) {
          const ease = easeInOut(t / 0.45);
          const vx = lerp(golgiExitX + (exoX - golgiExitX) * 0.3, exoX, ease);
          const vy = lerp(golgiExitY + (exoY - golgiExitY) * 0.3, exoY, ease);
          vesicleData = { x: vx, y: vy, r: 10, alpha: 1 };
          vesicleProtein = true;
        } else if (t < 0.70) {
          const t2 = (t - 0.45) / 0.25;
          vesicleData = { x: exoX, y: exoY, r: lerp(10, 3, easeOut(t2)), alpha: lerp(1, 0.4, t2) };
          vesicleProtein = true;
          exoStage = 1;
        } else {
          exoStage = 2;
          const t2 = (t - 0.70) / 0.30;
          proteinX = exoX;
          proteinY = exoY - 8 - t2 * (cellRY * 0.4);
          proteinVisible = true;
        }
      }

      // === 绘制蛋白质 ===
      if (proteinVisible) {
        const pr = 6;
        const grad = ctx.createRadialGradient(proteinX, proteinY, 0, proteinX, proteinY, pr * 2.5);
        grad.addColorStop(0, 'rgba(232,184,48,0.8)');
        grad.addColorStop(0.5, 'rgba(232,184,48,0.3)');
        grad.addColorStop(1, 'rgba(232,184,48,0)');
        ctx.beginPath(); ctx.arc(proteinX, proteinY, pr * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = grad; ctx.fill();
        drawCircle(ctx, proteinX, proteinY, pr, C.protein, C.proteinL, 1.2);
        drawCircle(ctx, proteinX - pr * 0.3, proteinY - pr * 0.3, pr * 0.32, 'rgba(255,255,255,0.65)', null, 0);
      }

      // === 绘制囊泡 ===
      if (vesicleData && vesicleData.r > 2) {
        drawCircle(ctx, vesicleData.x, vesicleData.y, vesicleData.r, 'rgba(240,160,64,0.12)', C.vesicle, 2);
        drawCircle(ctx, vesicleData.x - vesicleData.r * 0.25, vesicleData.y - vesicleData.r * 0.25,
          vesicleData.r * 0.3, 'rgba(255,255,255,0.25)', null, 0);
        if (vesicleProtein) drawCircle(ctx, vesicleData.x, vesicleData.y, 4, C.protein, C.proteinL, 1);
      }

      // === 胞吐位点 ===
      if (exoStage >= 1) {
        ctx.beginPath(); ctx.arc(exoX, exoY, 6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
        ctx.strokeStyle = C.secretion; ctx.lineWidth = 1.5; ctx.stroke();
      }
      if (exoStage >= 2) {
        const releaseT = clamp((p - 0.89) / 0.11, 0, 1);
        const dots = [
          { ox: exoX - 8, oy: exoY - 5 },
          { ox: exoX + 6, oy: exoY - 12 },
          { ox: exoX - 3, oy: exoY - 16 },
          { ox: exoX + 10, oy: exoY - 3 },
        ];
        for (const d of dots) {
          const dy = -releaseT * cellRY * 0.35;
          const alpha = clamp(releaseT * 2.5, 0, 1) * clamp((1 - releaseT) * 3, 0, 1);
          if (alpha > 0.02) {
            ctx.globalAlpha = alpha;
            drawCircle(ctx, d.ox, d.oy + dy, 3.5, C.secretion, C.secretionL, 1);
            ctx.globalAlpha = 1;
          }
        }
        if (proteinVisible && exoStage === 2) {
          const t2 = clamp((p - 0.89) / 0.11, 0, 1);
          drawCircle(ctx, exoX, exoY - 15 - t2 * cellRY * 0.3, 6, C.protein, C.proteinL, 1.2);
        }
      }

      if (inGolgi && proteinVisible) {
        drawCircle(ctx, proteinX, proteinY, 5.5, C.protein, C.proteinL, 1.2);
        drawCircle(ctx, proteinX - 2, proteinY - 2, 1.8, 'rgba(255,255,255,0.6)', null, 0);
      }

      // === 箭头 ===
      if (p >= 0.25 && p < 0.55) {
        const midX = (erExit.x + golgiEntryX) / 2;
        const midY = (erExit.y + golgiEntryY) / 2 - 15;
        drawArrow(ctx, midX - 18, midY, midX + 18, midY, C.arrow, 1.6);
      }
      if (p >= 0.72 && p < 0.88) {
        const midX2 = (golgiExitX + exoX) / 2 + 5;
        const midY2 = (golgiExitY + exoY) / 2 + 5;
        drawArrow(ctx, midX2 - 15, midY2, midX2 + 15, midY2, C.arrow, 1.6);
      }
      if (exoStage >= 2) {
        drawArrow(ctx, exoX - 15, exoY - 25, exoX - 15, exoY - 55, C.arrow, 1.6);
      }

      // === 标注 ===
      // 辅助：标签 + 同色指示短线
      function drawLabelLine(lx, ly, tx, ty, text, color, size, align, lineLen) {
        drawLabel(ctx, lx, ly, text, color, size, align);
        const dx = tx - lx, dy = ty - ly;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const len = lineLen || Math.min(28, dist * 0.4);
        const sx = lx + (dx / dist) * 4;
        const sy = ly + (dy / dist) * 4;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + (dx / dist) * len, sy + (dy / dist) * len);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // 细胞核 — 紧贴核上方，短线向下指向核
      drawLabelLine(nucCX, nucCY - nucRY - 10, nucCX, nucCY - nucRY + 5, '细胞核', C.nucleus, 13, 'center');
      // 粗面内质网 — 左上区域
      const erLabelP = erPts[Math.floor(erPts.length * 0.22)];
      if (erLabelP) drawLabelLine(erLabelP.x + 55, erLabelP.y - 22, erLabelP.x, erLabelP.y, '粗面内质网', C.er, 12, 'left');
      // 核糖体 — 顶部偏左
      const riboP = erPts[Math.floor(erPts.length * 0.16)];
      if (riboP) drawLabelLine(riboP.x + 50, riboP.y - 36, riboP.x + 12, riboP.y - 14, '核糖体', C.ribosome, 11, 'left');
      // 高尔基体
      drawLabelLine(golgiCX, golgiCY - 72, golgiCX, golgiCY - 52, '高尔基体', C.golgi, 13, 'center');
      // 细胞膜 — 与"膜含量变化"标题平行，无线条
      drawLabel(ctx, cellCX + cellRX - 8, chartY2 - 18, '细胞膜', C.membrane, 12, 'right');
      // 细胞外
      drawLabel(ctx, cellCX + cellRX + 40, cellCY - cellRY + 20, '细胞外', C.textLight, 12, 'left');
      // 囊泡（动态）
      if (vesicleData && vesicleData.r > 5 && !inGolgi) {
        drawLabelLine(vesicleData.x + vesicleData.r + 14, vesicleData.y, vesicleData.x, vesicleData.y, '囊泡', C.vesicle, 11, 'left');
      }
      // 分泌蛋白（动态）
      if (proteinVisible && exoStage === 0 && !inGolgi && !vesicleProtein) {
        drawLabelLine(proteinX + 14, proteinY - 4, proteinX, proteinY, '分泌蛋白', C.protein, 11, 'left');
      }
      // 分泌物
      if (exoStage >= 2) {
        drawLabelLine(exoX + 18, exoY - 35, exoX, exoY - 20, '分泌物', C.secretion, 12, 'left');
      }

      // === 顶部标题与阶段 ===
      drawLabel(ctx, W * 0.38, 28, '分泌蛋白的合成与运输', C.text, 22, 'center');
      const stageNames = [
        '① 核糖体合成肽链，肽链进入内质网腔',
        '② 内质网折叠加工，出芽形成囊泡',
        '③ 囊泡与高尔基体融合，蛋白质修饰包装',
        '④ 分泌囊泡与细胞膜融合，胞吐释放'
      ];
      const stageIdx = clamp(Math.floor(p * 4), 0, 3);
      drawLabel(ctx, W * 0.38, 52, stageNames[stageIdx], C.stageTag, 13, 'center');
      const timeLabels = ['⏱ 0–3 min', '', '⏱ 3–17 min', '⏱ 117 min'];
      const tl = timeLabels[stageIdx];
      if (tl) drawLabel(ctx, W * 0.38, 72, tl, C.textLight, 11, 'center');

      // === 底部图例 ===
      const legendY = H - 55;
      const legends = [
        { color: C.ribosome, label: '核糖体' },
        { color: C.er, label: '内质网' },
        { color: C.golgi, label: '高尔基体' },
        { color: C.vesicle, label: '囊泡' },
        { color: C.membrane, label: '细胞膜' },
        { color: C.protein, label: '分泌蛋白' },
      ];
      const totalLegendW = legends.length * 88;
      let lx = W * 0.38 - totalLegendW / 2;
      for (const lg of legends) {
        drawCircle(ctx, lx, legendY, 5, lg.color, null, 0);
        drawLabel(ctx, lx + 12, legendY, lg.label, C.textLight, 11, 'left');
        lx += 88;
      }

      // === 底部总结栏 ===
      const botY = H - 24;
      ctx.fillStyle = 'rgba(91,155,213,0.08)';
      ctx.beginPath(); roundRect(ctx, W * 0.12, botY - 14, W * 0.55, 28, 8); ctx.fill();
      drawLabel(ctx, W * 0.38, botY, '核糖体 → 粗面内质网 → 囊泡 → 高尔基体 → 分泌囊泡 → 细胞膜 → 胞吐排出',
        C.stageTag, 13, 'center');

      // === 右侧折线图：膜面积（上） + 膜含量（下） ===
      drawChartPanel(ctx, p, chartX, chartY1, chartW, eachPanelH, '膜面积变化', getMembraneAreas);
      drawChartPanel(ctx, p, chartX, chartY2, chartW, eachPanelH, '膜含量变化', getMembraneContent);

      // 图表下方注释
      const chartNoteY = chartY2 + eachPanelH + 14;
      drawLabel(ctx, chartX + chartW / 2, chartNoteY, '膜含量恢复是因为有新生成的', C.textLight, 9.5, 'center');
      drawLabel(ctx, chartX + chartW / 2, chartNoteY + 14, '脂质和蛋白质在补充', C.textLight, 9.5, 'center');
    }

    // ===== 循环 =====
    function tick(ts) {
      requestAnimationFrame(tick);
      if (lastTs === 0) { lastTs = ts; render(0); return; }
      const delta = Math.min((ts - lastTs) / 1000, 0.06);
      lastTs = ts;
      if (playing) {
        progress = (progress + delta / LOOP_DURATION * speed) % 1;
      }
      render(progress);
    }

    // ===== 按钮 =====
    window.togglePlay = () => { playing = !playing; document.getElementById('btnPlay').classList.toggle('on', playing); };
    window.setSpeed = (s, btn) => {
      speed = s;
      document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('on'));
      if (btn) btn.classList.add('on');
    };
    window.resetAnim = () => { progress = 0; };

    window.addEventListener('keydown', e => {
      if (e.key === ' ') { e.preventDefault(); togglePlay(); }
      if (e.key === 'r' || e.key === 'R') resetAnim();
      if (e.key === 'ArrowRight') progress = clamp(progress + 0.02, 0, 0.999);
      if (e.key === 'ArrowLeft') progress = clamp(progress - 0.02, 0, 0.999);
      if (e.key === '1') setSpeed(0.5, document.querySelector('[data-speed="0.5"]'));
      if (e.key === '2') setSpeed(0.75, document.querySelector('[data-speed="0.75"]'));
      if (e.key === '3') setSpeed(1, document.querySelector('[data-speed="1"]'));
      if (e.key === '4') setSpeed(1.5, document.querySelector('[data-speed="1.5"]'));
    });

    canvas.addEventListener('pointerdown', e => { progress = clamp(e.clientX / innerWidth, 0, 0.999); });
    canvas.addEventListener('pointermove', e => { if (e.buttons) progress = clamp(e.clientX / innerWidth, 0, 0.999); });

    requestAnimationFrame(tick);
  </script>
</body>

</html>
