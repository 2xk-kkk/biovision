<script>
// ═══════════════════ Canvas ═══════════════════
const DPR=Math.min(devicePixelRatio||1,2);
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W,H;
function rs(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(1,0,0,1,0,0)}
rs();addEventListener('resize',rs);

// ═══════════════════ State ═══════════════════
let t=0,spd=0.055,playing=true,lbl=1,spdMul=1;
const C={
  r:'#ef4444',rD:'#7f1d1d',rL:'#fca5a5',
  m:'#f59e0b',mD:'#78350f',mL:'#fde68a',
  th:'#10b981',thD:'#064e3b',thL:'#6ee7b7',
  b:'#3b82f6',bD:'#1e3a5f',bL:'#93c5fd',
  p:'#f8fafc',pD:'#64748b',pL:'#ffffff',
  mb:'#a855f7',mbD:'#3b0764',mbL:'#c4b5fd',
  ab:'#fbbf24',
  cy:'#facc15',
  arr:'#334155',dim:'#1e293b',mut:'#64748b',
  zone1:'rgba(239,68,68,0.025)',zone2:'rgba(59,130,246,0.025)',zone3:'rgba(168,85,247,0.025)',
};

// ═══════════════════ Coordinate system (ref 1350×820) ═══════════════════
const RX=1350,RY=820;
function S(){return Math.min(W/RX,H/RY)}
function X(v){return W/2+(v-675)*S()}
function Y(v){return v*S()+Math.max(0,(H-RY*S())/2)}

// ═══════════════════ Node positions ═══════════════════
// Following user's framework: left→right timeline, top→bottom hierarchy
const ND={
  // 【感应阶段】x: 100~380
  pathogen:   {x:160,y:100, r:26, type:'pathogen'},
  macro1:     {x:290,y:100, r:40, type:'macro'},
  thCell:     {x:450,y:100, r:32, type:'th'},        // hub between 感应→反应

  // 【反应阶段】x: 380~850
  bCell:      {x:640,y:100, r:34, type:'bcell'},
  bProlif:    {x:640,y:250, r:30, type:'bcell'},
  plasma1:    {x:810,y:200, r:24, type:'plasma'},
  plasma2:    {x:850,y:240, r:21, type:'plasma'},
  memoryB1:   {x:810,y:320, r:18, type:'memory'},
  memoryB2:   {x:850,y:340, r:16, type:'memory'},

  // 【效应阶段】x: 850~1300
  plasma3:    {x:810,y:480, r:26, type:'plasma'},
  abIcon:     {x:980,y:440, r:10, type:'ab'},
  abMany:     {x:1040,y:380, r:15, type:'ab'},
  antigen:    {x:1120,y:300, r:24, type:'pathogen'},
  precip:     {x:1120,y:430, r:18, type:null},
  macro2:     {x:1120,y:560, r:42, type:'macro'},
  memoryB3:   {x:1040,y:560, r:18, type:'memory'},
};

// ═══════════════════ Timeline ═══════════════════
const STEPS=[
  {t:0.00,id:'pathogen',  note:'① 病原体（携带抗原）入侵机体组织'},
  {t:0.07,id:'macro1',    note:'② 巨噬细胞伸出伪足，吞噬并处理病原体'},
  {t:0.14,id:'thCell',    note:'③ 巨噬细胞呈递抗原 → Th细胞识别并活化（感应阶段完成）'},
  {t:0.23,id:'bCell',     note:'④ B细胞接受双信号：第一信号（抗原直接刺激BCR）+ 第二信号（活化的Th细胞提供）'},
  {t:0.33,id:'bProlif',   note:'⑤ 双信号满足 → B细胞增殖分化'},
  {t:0.42,id:'plasma1',   note:'⑥ 分化产生浆细胞（效应B细胞）—— 抗体工厂'},
  {t:0.50,id:'memoryB1',  note:'⑦ 同时分化产生记忆B细胞 —— 长期潜伏，准备二次应答'},
  {t:0.58,id:'plasma3',   note:'⑧ 浆细胞大量合成并分泌特异性抗体（免疫球蛋白）'},
  {t:0.66,id:'abIcon',    note:'⑨ 抗体通过体液运输到达感染部位'},
  {t:0.74,id:'antigen',   note:'⑩ 抗体与抗原特异性结合（Fab区识别抗原决定簇）'},
  {t:0.83,id:'precip',    note:'⑪ 抗原-抗体复合物聚集 → 形成沉淀/细胞集团'},
  {t:0.91,id:'macro2',    note:'⑫ 吞噬细胞吞噬清除复合物 → 免疫完成 ✓'},
];

const act=new Set();
function curStep(){for(let i=STEPS.length-1;i>=0;i--)if(t>=STEPS[i].t)return i;return -1}
function updAct(){act.clear();const s=curStep();for(let i=0;i<=s;i++)act.add(STEPS[i].id)}
function isOn(id){return act.has(id)}
function alpha(id){if(!isOn(id))return 0.2;const si=STEPS.findIndex(s=>s.id===id);if(si<0)return 1;return 0.2+0.8*Math.min(1,(t-STEPS[si].t)/0.08)}

// ═══════════════════ Flow paths ═══════════════════
const FLOWS=[
  {from:'pathogen',to:'macro1',color:C.rL,count:8, type:'invasion'},
  {from:'macro1',to:'thCell',color:C.cy,count:16, type:'present'},
  {from:'thCell',to:'bCell',color:C.cy,count:20, type:'signal2'},
  {from:'bCell',to:'bProlif',color:C.bL,count:14, type:'prolif'},
  {from:'bProlif',to:'plasma1',color:C.pL,count:10, type:'diff'},
  {from:'bProlif',to:'plasma2',color:C.pL,count:8, type:'diff'},
  {from:'bProlif',to:'memoryB1',color:C.mbL,count:8, type:'diff'},
  {from:'bProlif',to:'memoryB2',color:C.mbL,count:6, type:'diff'},
  {from:'plasma1',to:'plasma3',color:C.pL,count:10, type:'secret'},
  {from:'plasma3',to:'abIcon',color:C.ab,count:18, type:'abflow'},
  {from:'abIcon',to:'abMany',color:C.ab,count:14, type:'abflow'},
  {from:'abMany',to:'antigen',color:C.ab,count:18, type:'bind'},
  {from:'antigen',to:'precip',color:'#ff8844',count:10, type:'precip'},
  {from:'precip',to:'macro2',color:C.mL,count:12, type:'cleanup'},
];

// ═══════════════════ Particles ═══════════════════
let ps=[];
function spawnP(f){
  const a=ND[f.from],b=ND[f.to];if(!a||!b)return;
  if(!isOn(f.from))return;
  const inten=isOn(f.to)?1:0.3;
  const n=Math.floor(f.count*inten);
  const sx=X(a.x),sy=Y(a.y),ex=X(b.x),ey=Y(b.y);
  const dx=ex-sx,dy=ey-sy,d=Math.sqrt(dx*dx+dy*dy);
  const ux=dx/d,uy=dy/d;
  for(let i=0;i<n;i++)ps.push({x:sx+ux*8,y:sy+uy*8,ex,ey,ux,uy,d,t:Math.random()*0.5*d,maxT:d,r:1+Math.random()*1.8,c:f.color});
}
function updP(dt){
  for(let i=ps.length-1;i>=0;i--){
    const p=ps[i];p.t+=p.maxT*0.65*dt;
    if(p.t>=p.maxT){ps.splice(i,1);continue}
    const f=p.t/p.maxT;p.x=p.ex-(1-f)*p.maxT*p.ux;p.y=p.ey-(1-f)*p.maxT*p.uy;
  }
}
function drawP(){
  for(const p of ps){
    const a=0.45+0.45*Math.sin(p.t*0.06);
    ctx.shadowColor=p.c;ctx.shadowBlur=3;
    const h=p.c;const r=parseInt(h[1]+h[2],16),g=parseInt(h[3]+h[4],16),b=parseInt(h[5]+h[6],16);
    ctx.fillStyle=`rgba(${r},${g},${b},${a})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
}

// ═══════════════════ Ripples ═══════════════════
let rips=[];
function spawnR(x,y,c){rips.push({x,y,r:3,mr:38+Math.random()*16,c,life:1,sp:55+Math.random()*35})}
function updR(dt){for(let i=rips.length-1;i>=0;i--){const r=rips[i];r.r+=r.sp*dt;r.life=1-r.r/r.mr;if(r.life<=0)rips.splice(i,1)}}
function drawR(){for(const r of rips){ctx.strokeStyle=r.c;ctx.globalAlpha=r.life*.45;ctx.lineWidth=1.3*(1-r.life);ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}}

// ═══════════════════ Drawing primitives ═══════════════════
function sphere(x,y,r,base,light,dark){
  const g=ctx.createRadialGradient(x-r*.22,y-r*.28,r*.03,x,y,r);
  g.addColorStop(0,light);g.addColorStop(0.4,base);g.addColorStop(1,dark);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function arrow(x1,y1,x2,y2,col,wd,on){
  col=col||C.arr;wd=wd||1.6;
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);if(len<2)return;
  const ux=dx/len,uy=dy/len,mx=x2-ux*8,my=y2-uy*8;
  ctx.globalAlpha=on?.9:.18;ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(mx,my);ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(mx-uy*3.5,my+ux*3.5);ctx.lineTo(mx+uy*3.5,my-ux*3.5);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
}
function dashedArr(x1,y1,x2,y2,col,wd,on){
  col=col||C.arr;wd=wd||1.2;
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);if(len<2)return;
  const ux=dx/len,uy=dy/len;
  ctx.globalAlpha=on?.82:.16;ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.setLineDash([3.5,2.5]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-ux*5,y2-uy*5);ctx.stroke();ctx.setLineDash([]);
  const mx=x2-ux*5,my=y2-uy*5;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(mx-uy*3,my+ux*3);ctx.lineTo(mx+uy*3,my-ux*3);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
}

// Text with background chip
function chip(x,y,text,col,sz){
  sz=sz||12;ctx.font=`bold ${sz}px "Microsoft YaHei","PingFang SC",sans-serif`;
  const m=ctx.measureText(text),pw=m.width+8,ph=sz+5;
  ctx.fillStyle='rgba(6,9,24,0.82)';const r=4;
  ctx.beginPath();ctx.roundRect(x-pw/2,y-ph/2,pw,ph,r);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=.8;ctx.beginPath();ctx.roundRect(x-pw/2,y-ph/2,pw,ph,r);ctx.stroke();
  ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,y);ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function plainText(x,y,text,col,sz,align){
  sz=sz||11;ctx.font=`${sz}px "Microsoft YaHei","PingFang SC",sans-serif`;
  ctx.fillStyle=col;ctx.textAlign=align||'center';ctx.fillText(text,x,y);ctx.textAlign='start';
}

// ═══════════════════ Cell renderers ═══════════════════
function drawPathogen(x,y,r,on,al){
  ctx.globalAlpha=al;const p=on?1+.05*Math.sin(t*13):1,pr=r*p;
  if(on){ctx.shadowColor=C.r;ctx.shadowBlur=9+3*Math.sin(t*9)}
  sphere(x,y,pr,on?C.r:'#3a1010',on?C.rL:'#552222',on?C.rD:'#1a0505');ctx.shadowBlur=0;
  for(let i=0;i<16;i++){const a=(i/16)*Math.PI*2;ctx.strokeStyle=on?C.rD:'#2a1010';ctx.lineWidth=1.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+Math.cos(a)*(pr+1.5),y+Math.sin(a)*(pr+1.5));ctx.lineTo(x+Math.cos(a)*(pr+pr*.26),y+Math.sin(a)*(pr+pr*.26));ctx.stroke();ctx.fillStyle=on?C.r:'#4a1111';ctx.beginPath();ctx.arc(x+Math.cos(a)*(pr+pr*.26),y+Math.sin(a)*(pr+pr*.26),1.6,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
}
function drawMacro(x,y,r,on,al){
  ctx.globalAlpha=al;const p=on?1+.035*Math.sin(t*11):1,pr=r*p;
  if(on){ctx.shadowColor=C.m;ctx.shadowBlur=7+2.5*Math.sin(t*8)}
  const pts=38;ctx.beginPath();
  for(let i=0;i<pts;i++){const a=(i/pts)*Math.PI*2;const w=1+.11*Math.sin(a*5+1.4+t*2.2)*Math.cos(a*3+.6);const px=x+Math.cos(a)*pr*w,py=y+Math.sin(a)*pr*w;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();
  const g=ctx.createRadialGradient(x-pr*.18,y-pr*.28,pr*.03,x,y,pr);
  g.addColorStop(0,on?C.mL:'#4a3a1a');g.addColorStop(.45,on?C.m:'#3a2a10');g.addColorStop(1,on?C.mD:'#1a0a00');ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;
  for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2+.3+t*.5;ctx.fillStyle=on?C.mD:'#2a1a08';ctx.beginPath();ctx.arc(x+Math.cos(a)*pr*1.04,y+Math.sin(a)*pr*1.04,pr*.15,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
}
function drawTh(x,y,r,on,al){
  ctx.globalAlpha=al;const p=on?1+.045*Math.sin(t*12):1,pr=r*p;
  if(on){ctx.shadowColor=C.th;ctx.shadowBlur=6+2.5*Math.sin(t*10)}
  sphere(x,y,pr,on?C.th:'#1a2a1a',on?C.thL:'#2a4422',on?C.thD:'#0a1a0a');ctx.shadowBlur=0;

const hits=[];
function bldH(){hits.length=0;const sc=S();for(const[n,d]of Object.entries(ND)){if(!d.type)continue;hits.push({x:X(d.x),y:Y(d.y),r:(d.r+10)*sc,type:d.type})}}

cv.addEventListener('mousemove',e=>{bldH();const mx=e.clientX,my=e.clientY;let f=null;for(const h of hits){if((mx-h.x)**2+(my-h.y)**2<h.r**2){f=h;break}}const pp=document.getElementById('popup');if(f){cv.style.cursor='pointer';pp.classList.add('show');pp.style.left=(mx+12)+'px';pp.style.top=(my-12)+'px';const k=K[f.type];if(k){document.getElementById('popTitle').textContent=k.t;document.getElementById('popDesc').textContent=k.s}}else{cv.style.cursor='default';pp.classList.remove('show')}});

cv.addEventListener('click',e=>{bldH();const mx=e.clientX,my=e.clientY;for(const h of hits){if((mx-h.x)**2+(my-h.y)**2<h.r**2){const k=K[h.type];if(k)openK(h.type,k);return}}});

// ═══════════════════ Knowledge ═══════════════════
const K={
  pathogen:{c:'#ef4444',t:'病原体（抗原）',s:'侵入机体的病毒、细菌等异物，表面携带抗原决定簇，能引发特异性免疫应答。',d:'抗原是指能引起机体产生特异性免疫应答的物质，多为蛋白质。病原体表面的抗原决定簇可被免疫细胞受体特异性识别。一种抗原通常含有多个不同的抗原决定簇。',tip:'抗原≠病原体。疫苗中的灭活病毒、类毒素也属于抗原。抗原具有大分子性、异物性和特异性三大特征。'},
  macro:{c:'#f59e0b',t:'巨噬细胞（APC）',s:'吞噬并处理病原体，暴露抗原决定簇，将抗原肽-MHC-II复合物呈递给Th细胞，同时分泌细胞因子。',d:'巨噬细胞是重要的抗原呈递细胞(APC)。吞噬后在溶酶体中降解病原体为抗原肽，与MHC-II类分子结合后呈递至细胞表面供Th细胞的TCR识别。同时分泌IL-1等细胞因子辅助Th活化。',tip:'巨噬细胞既能参与非特异性免疫（直接吞噬），又能在特异性免疫中呈递抗原。吞噬处理的目的不是消灭，而是暴露并呈递抗原决定簇。'},
  th:{c:'#10b981',t:'辅助性T细胞（Th）',s:'识别巨噬细胞呈递的抗原肽-MHC-II复合物后活化、增殖、分化。为B细胞提供不可或缺的第二信号（表面分子CD40L + 细胞因子）。',d:'Th表面TCR特异性识别APC的抗原肽-MHC-II复合物而活化。活化后Th表达CD40L（与B细胞的CD40结合），并分泌IL-2、IL-4等细胞因子。这两个共同构成B细胞活化的"第二信号"。Th是连接非特异免疫与特异免疫、细胞免疫与体液免疫的关键枢纽。',tip:'Th在体液免疫和细胞免疫中都不可或缺。HIV攻击Th导致免疫缺陷。"B细胞活化的第二信号来源"是高考高频考点。'},
  bcell:{c:'#3b82f6',t:'B细胞',s:'需双信号才能活化——第一信号：抗原与BCR结合；第二信号：活化的Th提供CD40L + 细胞因子。双信号满足后增殖分化为浆细胞和记忆B细胞。',d:'BCR即B细胞表面的膜抗体(IgM/IgD)，可直接识别游离抗原而无需MHC呈递，这构成第一信号。Th提供的CD40L-CD40结合+细胞因子构成第二信号。若只有第一信号而无第二信号，B细胞将进入无能(anergy)或凋亡。',tip:'双信号模型是体液免疫的核心机制——第一信号保证免疫特异性，第二信号提供安全验证，防止自身免疫。记忆B细胞再次遇抗原时可不依赖Th直接活化。'},
  plasma:{c:'#f8fafc',t:'浆细胞（效应B细胞）',s:'由B细胞分化而来的终末分化细胞，富含粗面内质网，是"抗体工厂"。每个浆细胞每秒可分泌约2000个抗体分子。',d:'浆细胞是B细胞分化后的效应形式，不再表达BCR，寿命较短（数天至数周）。细胞质中充满粗面内质网和高尔基体以适应大规模抗体合成与分泌。',tip:'浆细胞≠记忆细胞。抗体由浆细胞（而非B细胞）产生和分泌。效应阶段的执行者是浆细胞。'},
  memory:{c:'#a855f7',t:'记忆B细胞',s:'长期存活（数年至终身），表达高亲和力BCR。再次遇同种抗原时无需Th辅助即可迅速增殖分化为浆细胞，产生更快更强的二次免疫应答。',d:'记忆B细胞是B细胞分化后的长寿命形式。其BCR经过亲和力成熟，对同种抗原有极高亲和力。二次感染时可在1-2天内产生大量高亲和力IgG类抗体，而初次应答通常需要5-7天。这是疫苗接种保护效应的细胞学基础。',tip:'二次免疫特点：①潜伏期更短 ②抗体浓度更高 ③抗体亲和力更强 ④持续时间更长。疫苗利用的正是免疫记忆特性。'},
  ab:{c:'#fbbf24',t:'抗体（免疫球蛋白，Ig）',s:'浆细胞分泌的Y形蛋白质。Fab区特异性识别抗原决定簇，Fc区介导效应功能。通过凝集、沉淀、中和等方式标记抗原。',d:'基本结构：两条重链(H) + 两条轻链(L) 通过二硫键连接成Y形。Fab区（可变区）负责抗原识别，Fc区（恒定区）介导与吞噬细胞Fc受体的结合。抗体本身不能直接"杀死"病原体，作用是标记和凝集抗原，便于吞噬细胞清除。',tip:'抗体本身不直接消灭病原体，而是起"标记"作用。一种抗体一般只特异性结合一种抗原决定簇。抗原-抗体结合具有高度特异性（锁-钥模型）。'},
};
function openK(type,k){k=k||K[type];if(!k)return;document.getElementById('kpDot').style.background=k.c;document.getElementById('kpDot').style.boxShadow=`0 0 7px ${k.c}`;document.getElementById('kpTitle').textContent=k.t;document.getElementById('kpShort').textContent=k.s;document.getElementById('kpDetail').textContent=k.d;document.getElementById('kpTip').textContent=k.tip;document.getElementById('kp').classList.add('open');document.getElementById('kpOverlay').classList.add('on')}
function closeKnowledge(){document.getElementById('kp').classList.remove('open');document.getElementById('kpOverlay').classList.remove('on')}
function toggleLabels(){lbl=!lbl;document.getElementById('btnLabels').classList.toggle('on',lbl)}
function resetAnim(){t=0;playing=true;ps=[];rips=[];pv=''}
function toggleSpeed(){spdMul=spdMul===1?2:spdMul===2?0.5:1;document.getElementById('btnSpeed').textContent=spdMul+'×'}

addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();playing=!playing}
  if(e.key==='r'||e.key==='R')resetAnim()
  if(e.key==='ArrowRight'){t=Math.min(1,t+.025);ps=[];rips=[]}
  if(e.key==='ArrowLeft'){t=Math.max(0,t-.025);ps=[];rips=[]}
  if(e.key==='Escape')closeKnowledge()
});

// ═══════════════════ Loop ═══════════════════
let last=performance.now();
function loop(ts){const dt=Math.min((ts-last)/1000,.1);last=ts;if(playing){t+=dt*spd*spdMul;if(t>=1)t=0}draw(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
