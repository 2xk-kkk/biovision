<!DOCTYPE html>
<html lang="zh-CN">

<style>
  :root {
    --bg: #0d1117;
    --panel: rgba(13,17,23,0.9);
    --text: #e6edf3;
    --muted: #8b949e;
    --cyan: #79c0ff;
    --orange: #f0a040;
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: "Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  #three-canvas { position: fixed; inset: 0; display: block; }

  /* 顶部栏 */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 48px; display: flex; align-items: center; gap: 14px;
    padding: 0 18px;
    background: rgba(13,17,23,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .back-btn {
    width: 32px; height: 32px; border-radius: 50%;

    color: #c9d1d9; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;

  }
  .topbar-actions { margin-left: auto; display: flex; gap: 6px; }
  .tb-btn {
    padding: 5px 13px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);

    color: #b0b8c0; font-size: 12px; font-family: inherit;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.1); color: #e6edf3; }
  .tb-btn.on {
    background: rgba(121,192,255,0.15); border-color: rgba(121,192,255,0.4); color: var(--cyan);
  }

  /* 图例 */
  .legend {
    position: fixed; right: 14px; top: 50%; transform: translateY(-50%);
    z-index: 50; background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    padding: 14px 16px; min-width: 175px;
    backdrop-filter: blur(10px); box-shadow: var(--shadow);
  }
  .legend h3 { font-size: 11px; color: var(--muted); margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .lg-item {
    display: flex; align-items: center; gap: 9px;
    padding: 5px 6px; margin: 1px -6px; border-radius: 5px;
    font-size: 11px; color: #b0b8c0; cursor: pointer; transition: background 0.15s;
  }
  .lg-item:hover { background: rgba(255,255,255,0.04); }
  .lg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .lg-dot.head { background: #f0a040; }
  .lg-dot.tail { background: #6b8db5; }
  .lg-dot.chol { background: #f5c842; border-radius: 3px; }
  .lg-dot.carrier { background: #b07cd8; }
  .lg-dot.channel { background: #58b9e8; }
  .lg-dot.glyco { background: #e0556a; }
  .lg-dot.peripheral { background: #5cc98b; }
  .lg-dot.water { background: #5fa8e0; opacity: 0.7; }
  .lg-dot.ion { background: radial-gradient(circle at 35% 35%, #ffd24a, #b388ff); }
  .lg-dot.atp { background: #ff4d6d; box-shadow: 0 0 6px #ff4d6d; }

  /* 弹窗 */
  .info-popup {
    position: fixed; z-index: 200; pointer-events: none;
    opacity: 0; transform: translate(-50%,-115%);
    transition: opacity 0.25s, transform 0.25s;
    background: var(--panel); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; padding: 13px 16px;
    box-shadow: var(--shadow); max-width: 250px;
    backdrop-filter: blur(12px);
  }
  .info-popup.show { opacity: 1; transform: translate(-50%,-130%); }
  .info-popup h4 { font-size: 13px; margin-bottom: 5px; }
  .info-popup p { font-size: 11px; color: var(--muted); line-height: 1.55; }
  .info-popup::after {
    content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-top: 7px solid rgba(13,17,23,0.95);
  }

  /* 底部提示 */
  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 50; padding: 7px 18px; border-radius: 999px;
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.06);
    font-size: 11px; color: var(--muted); letter-spacing: 0.5px;
    backdrop-filter: blur(8px); pointer-events: none;
  }
  .hint em { color: var(--cyan); font-style: normal; }

  @media (max-width: 768px) {
    .legend { right: 2px; padding: 10px 12px; min-width: 145px; }
    .legend h3 { font-size: 10px; }
    .lg-item { font-size: 10px; }
    .topbar h1 { font-size: 13px; }
  }
</style>
<script>
/* 全站统一：同一个网页只要没关，点两次就复用上次的标签，不新开 */
(function () {
  function tabName(url) {
    try {
      var u = new URL(url, location.href);
      return '__biotab__' + u.pathname + u.search;
    } catch (e) {
      return '__biotab__' + String(url);
    }
  }
  /* 拦截所有 target="_blank" 的链接点击 */
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('a[target="_blank"]') : null;
    if (!el) return;
    if (el.hasAttribute && el.hasAttribute('download')) return; /* 下载链接保持默认 */
    var href = el.href;
    if (!href || href.slice(0, 11).toLowerCase() === 'javascript:') return;
    e.preventDefault();
    window.open(href, tabName(href));
  });
  /* 覆写 window.open：把 _blank / 空名 改成按网址复用 */
  var nativeOpen = window.open;
  window.open = function (url, name, features) {
    if (name === '_blank' || name === undefined || name === null || name === '') {
      name = tabName(url);
    }
    return nativeOpen.call(window, url, name, features);
  };
})();
</script>

<div class="topbar">
  <a href="main.html" class="back-btn" title="返回">←</a>
  <h1>磷脂双分子层 · 流动镶嵌模型</h1>
  <div class="topbar-actions">
    <button class="tb-btn on" id="btnAuto" onclick="toggleAuto()">⟳ 自动旋转</button>

</div>

<canvas id="three-canvas"></canvas>

<div class="legend">
  <h3>图例</h3>
  <div class="lg-item"><div class="lg-dot head"></div> 亲水头部（磷酸）</div>
  <div class="lg-item"><div class="lg-dot tail"></div> 疏水尾部（脂肪酸）</div>
  <div class="lg-item"><div class="lg-dot chol"></div> 胆固醇</div>
  <div class="lg-item" data-p="carrier"><div class="lg-dot carrier"></div> 载体蛋白</div>

  <div class="lg-item" data-p="peripheral"><div class="lg-dot peripheral"></div> 外周蛋白</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.addEventListener('error', function(e) {
  document.body.innerHTML += '<div style="position:fixed;top:60px;left:20px;z-index:9999;color:red;background:#111;padding:12px;font-size:12px;max-width:90%;">ERROR: ' + e.message + '</div>';
});

try {

// ===================== 场景 =====================
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 15, 40);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.5, 60);
camera.position.set(0.4, 0.2, 12.5);
camera.lookAt(0, 0, 0);

// ===================== 光照 =====================
scene.add(new THREE.AmbientLight(0x3a4e6b, 2.2));

const sun = new THREE.DirectionalLight(0xfff5e8, 4.2);
sun.position.set(8, 5, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 50;
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.00015;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8899cc, 1.8);
fill.position.set(-4, 0, -3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xb0c8ff, 2.0);
rim.position.set(0, -1.5, 5);
scene.add(rim);

// 环境贴图：让表面有微妙的反射，提升质感
try {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const roomEnv = new RoomEnvironment();
  scene.environment = pmrem.fromScene(roomEnv).texture;
  pmrem.dispose();
} catch (e) {
  console.warn('环境贴图加载失败，使用默认光照:', e.message);
}

// ===================== OrbitControls =====================
const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.target.set(0, 0, 0);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.08;
ctrl.minDistance = 3.5;
ctrl.maxDistance = 22;
ctrl.maxPolarAngle = Math.PI * 0.72;
ctrl.minPolarAngle = 0.18;
ctrl.autoRotate = true;
ctrl.autoRotateSpeed = 0.4;
ctrl.update();

// ===================== 材质 =====================
const matHead = new THREE.MeshStandardMaterial({ color: 0xf0a040, roughness: 0.32, metalness: 0.05 });
const matPhosphate = new THREE.MeshStandardMaterial({ color: 0xffd27a, roughness: 0.28, metalness: 0.08 });
const matGlycerol = new THREE.MeshStandardMaterial({ color: 0xe8c080, roughness: 0.4, metalness: 0.03 });
const matTail = new THREE.MeshStandardMaterial({ color: 0x6b8db5, roughness: 0.5, metalness: 0.02, transparent: true, opacity: 0.82 });
const matTailUnsat = new THREE.MeshStandardMaterial({ color: 0x7ea3c9, roughness: 0.5, metalness: 0.02, transparent: true, opacity: 0.82 });
const matWater = new THREE.MeshStandardMaterial({ color: 0x5fa8e0, roughness: 0.2, metalness: 0.0, transparent: true, opacity: 0.55 });
const matIonNa = new THREE.MeshStandardMaterial({ color: 0xffd24a, roughness: 0.25, metalness: 0.15, emissive: 0x665500, emissiveIntensity: 0.25 });
const matIonK = new THREE.MeshStandardMaterial({ color: 0xb388ff, roughness: 0.25, metalness: 0.15, emissive: 0x4422aa, emissiveIntensity: 0.25 });
const matIonCl = new THREE.MeshStandardMaterial({ color: 0x66e0a0, roughness: 0.25, metalness: 0.15, emissive: 0x116633, emissiveIntensity: 0.25 });

// ===================== 脂肪酸尾巴（平滑波形，区分饱和/不饱和） =====================
function createTailGeometry(startY, endY, unsat) {
  const pts = [];
  const len = endY - startY;
  const n = 16;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const y = startY + len * t;
    // 轻微的天然波动
    let wx = Math.sin(t * Math.PI * 3.2) * 0.06 + Math.cos(t * Math.PI * 1.8) * 0.03;
    let wz = Math.cos(t * Math.PI * 2.6) * 0.035;
    // 不饱和脂肪酸的顺式双键弯折
    if (unsat) {
      const kc = 0.42, kw = 0.14;
      const dist = Math.abs(t - kc) / kw;
      if (dist < 1) {
        const bump = (1 - dist) * (1 - dist);
        wx += bump * 0.22;
        wz += bump * 0.08;
      }
    }
    pts.push(new THREE.Vector3(wx, y, wz));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  return new THREE.TubeGeometry(curve, 22, 0.046, 7, false);
}

// ===================== 单个磷脂分子（精细化） =====================
function createPhospholipid(headY, tailDir) {
  const g = new THREE.Group();

  // —— 磷酸头部 ——
  // 主头部（球形，略带扁）
  const headGeo = new THREE.SphereGeometry(0.24, 20, 14);
  const head = new THREE.Mesh(headGeo, matHead);
  head.scale.set(1, 0.62, 1);
  head.position.y = headY;
  head.castShadow = true; head.receiveShadow = true;
  g.add(head);

  // 磷酸基团小球（突出于头部顶端，增加细节）
  const phosGeo = new THREE.SphereGeometry(0.09, 12, 10);
  const phos = new THREE.Mesh(phosGeo, matPhosphate);
  phos.position.set(0, headY + tailDir * 0.16, 0);
  phos.castShadow = true;
  g.add(phos);

  // —— 甘油骨架（连接头部与两条尾巴的小杆） ——
  const glyGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.14, 8);
  const gly = new THREE.Mesh(glyGeo, matGlycerol);
  gly.position.y = headY + tailDir * 0.12;
  gly.castShadow = true;
  g.add(gly);

  // —— 两条脂肪酸尾巴 ——
  const tailStart = headY + tailDir * 0.2;
  const tailEnd = headY + tailDir * 1.4;
  // 尾巴1：饱和脂肪酸（较直）
  const tail1 = new THREE.Mesh(createTailGeometry(tailStart, tailEnd, false), matTail);
  tail1.position.x = -0.06;
  tail1.castShadow = true;
  g.add(tail1);
  // 尾巴2：不饱和脂肪酸（带顺式双键弯折）
  const tail2 = new THREE.Mesh(createTailGeometry(tailStart, tailEnd, true), matTailUnsat);
  tail2.position.x = 0.06;
  tail2.castShadow = true;
  g.add(tail2);

  return g;
}

// ===================== 更紧密的网格 =====================
const COLS = 10, ROWS = 6, SP = 0.7;
const ox = -(COLS-1)*SP/2;
const oz = -(ROWS-1)*SP/2;

const pZones = {
  carrier:    { cx:[2,3], rx:[1,2] },
  channel:    { cx:[6,7], rx:[1,2] },
  glyco:      { cx:[7,8], rx:[3,4] },
  peripheral: { cx:[1],   rx:[3,4] },
};
function inZone(c,r,ly) {
  for (const [k,z] of Object.entries(pZones)) {
    if (k==='peripheral' && ly==='upper') continue;
    if (z.cx.includes(c) && z.rx.includes(r)) return k;
  }
  return null;
}

// ===================== 构建双层 =====================
const membrane = new THREE.Group();
scene.add(membrane);

// 存储所有磷脂分子的基准位置，用于流动镶嵌动画（侧向移动+轻微摆动）
const lipidMols = [];

for (let c=0; c<COLS; c++) {
  for (let r=0; r<ROWS; r++) {
    if (!inZone(c,r,'upper')) {
      const mol = createPhospholipid(0.72, -1);
      const bx = ox + c*SP + (Math.random()-0.5)*0.08;
      const bz = oz + r*SP + (Math.random()-0.5)*0.08;
      mol.position.set(bx, 0, bz);
      mol.rotation.y = (Math.random()-0.5) * 0.15; // 初始轻微错落角度
      membrane.add(mol);
      lipidMols.push({ mesh: mol, baseX: bx, baseZ: bz, phase: Math.random()*Math.PI*2, sway: 0.02 + Math.random()*0.03 });
    }
    if (!inZone(c,r,'lower')) {
      const mol = createPhospholipid(-0.72, 1);
      const bx = ox + c*SP + (Math.random()-0.5)*0.08;
      const bz = oz + r*SP + (Math.random()-0.5)*0.08;
      mol.position.set(bx, 0, bz);
      mol.rotation.y = (Math.random()-0.5) * 0.15;
      membrane.add(mol);
      lipidMols.push({ mesh: mol, baseX: bx, baseZ: bz, phase: Math.random()*Math.PI*2, sway: 0.02 + Math.random()*0.03 });
    }
  }
}

// ===================== 膜内外背景色差（强化边界） =====================
// 细胞外（上侧）：淡蓝色调；细胞内（下侧）：淡绿色调
const bgExtracellular = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 16),
  new THREE.MeshBasicMaterial({ color: 0x2a4a6a, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false })
);
bgExtracellular.rotation.x = Math.PI / 2;
bgExtracellular.position.y = 2.0;
bgExtracellular.renderOrder = -10;
scene.add(bgExtracellular);

const bgIntracellular = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 16),
  new THREE.MeshBasicMaterial({ color: 0x2a5a3a, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false })
);
bgIntracellular.rotation.x = Math.PI / 2;
bgIntracellular.position.y = -2.0;
bgIntracellular.renderOrder = -10;
scene.add(bgIntracellular);

// ===================== 胆固醇（4环甾核结构） =====================
const matChol = new THREE.MeshStandardMaterial({ color: 0xf5c842, roughness: 0.3, metalness: 0.05 });
const matCholOH = new THREE.MeshStandardMaterial({ color: 0xff5555, roughness: 0.25, metalness: 0.1 });
const cholGroup = new THREE.Group();
membrane.add(cholGroup);

function addCholesterol(x, z, flip) {
  const g = new THREE.Group();
  // 甾核由4个稠合环组成：3个六元环(A,B,C) + 1个五元环(D)
  // 用扁球体近似每个环，沿纵轴堆叠并稍微错开，形成稠合环的轮廓
  const ringDefs = [
    { y: 0.28, r: 0.13 },   // A环（最上，连OH）
    { y: 0.10, r: 0.13 },   // B环
    { y: -0.08, r: 0.13 },  // C环
    { y: -0.26, r: 0.10 },  // D环（五元环，略小）
  ];
  ringDefs.forEach((rd, i) => {
    const rGeo = new THREE.SphereGeometry(rd.r, 12, 9);
    const r = new THREE.Mesh(rGeo, matChol);
    r.scale.set(1.15, 0.7, 0.9);
    r.position.set(0, rd.y, 0);
    r.castShadow = true; r.receiveShadow = true;
    g.add(r);
    // 环间连接的小"键"
    if (i < ringDefs.length - 1) {
      const bondGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.1, 6);
      const bond = new THREE.Mesh(bondGeo, matChol);
      bond.position.y = (rd.y + ringDefs[i+1].y) / 2;
      g.add(bond);
    }
  });
  // C3位的羟基（-OH），在A环一侧
  const ohGeo = new THREE.SphereGeometry(0.07, 10, 8);
  const oh = new THREE.Mesh(ohGeo, matCholOH);
  oh.position.set(0.14, 0.32, 0.08);
  oh.castShadow = true;
  g.add(oh);
  const ohBond = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.1, 6), matChol);
  ohBond.position.set(0.07, 0.3, 0.04);
  ohBond.rotation.z = -Math.PI / 4;
  g.add(ohBond);

  // C17位的烃链（异辛基侧链），从D环向下伸出
  const tailCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -0.36, 0),
    new THREE.Vector3(0.04, -0.48, 0),
    new THREE.Vector3(0.1, -0.6, 0.03),
    new THREE.Vector3(0.06, -0.72, 0.02),
    new THREE.Vector3(0.12, -0.82, -0.01),
  ]);
  const tailGeo = new THREE.TubeGeometry(tailCurve, 10, 0.035, 6, false);
  const tail = new THREE.Mesh(tailGeo, matChol);
  tail.castShadow = true;
  g.add(tail);

  // 朝向（上层胆固醇OH朝外，下层朝内）
  if (flip) g.scale.y = -1;
  g.position.set(x, 0, z);
  cholGroup.add(g);
}

function zonePos(k) {
  const z = pZones[k];
  return {
    x: ox + ((z.cx[0]+z.cx[z.cx.length-1])/2)*SP,
    z: oz + ((z.rx[0]+z.rx[z.rx.length-1])/2)*SP
  };
}

function blobGroup(defs, material) {
  const g = new THREE.Group();
  defs.forEach(d => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(d.r, 18, 14), material);
    m.position.set(d.x, d.y, d.z);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
  });
  return g;
}

// 创建α螺旋（螺旋管），用于跨膜蛋白的螺旋结构
function createAlphaHelix(yStart, yEnd, radius, turns, x0, z0, material) {
  const pts = [];
  const n = 30;
  const len = yEnd - yStart;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const y = yStart + len * t;
    const angle = t * Math.PI * 2 * turns;
    pts.push(new THREE.Vector3(x0 + Math.cos(angle) * radius, y, z0 + Math.sin(angle) * radius));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, 28, 0.035, 6, false), material);
}

// 创建糖环（六元环，用六边形棱柱表示）
function createSugarRing(radius, material) {
  const shape = new THREE.Shape();
  const sides = 6;
  for (let i = 0; i <= sides; i++) {
    const a = (i / sides) * Math.PI * 2;
    const x = Math.cos(a) * radius;
    const y = Math.sin(a) * radius;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: radius * 0.5, bevelEnabled: true, bevelThickness: radius * 0.1, bevelSize: radius * 0.08, bevelSegments: 2 });
  geo.center();
  return new THREE.Mesh(geo, material);
}

    if (Math.hypot(x - zx, z - zz) < 0.8) return true;
  }

}

  const d = document.createElement('div');
  d.textContent = text;
  d.style.cssText = `position:fixed;z-index:55;pointer-events:none;font-size:12px;font-weight:600;color:${color};text-shadow:0 0 8px rgba(0,0,0,0.9);letter-spacing:1px;white-space:nowrap;transition:opacity 0.35s;`;
  document.body.appendChild(d);
  cssLabels.push({ d, worldPos });
}
addCSSLabel('细胞外', new THREE.Vector3(5.2, 1.8, 0), '#79c0ff');
addCSSLabel('细胞内', new THREE.Vector3(5.2, -1.8, 0), '#79c0ff');

let showLabels = true;
function updateCSSLabels() {
  cssLabels.forEach(function(item) {
    const v = item.worldPos.clone().project(camera);
    item.d.style.left = ((v.x*0.5+0.5)*innerWidth)+'px';
    item.d.style.top = ((-v.y*0.5+0.5)*innerHeight)+'px';
    item.d.style.transform = 'translate(-50%,-50%)';
    item.d.style.opacity = (showLabels && v.z<1) ? '1' : '0';
  });
}

const layerDivs = [];
function addLayerLabel(text, topPct, color) {
  const d = document.createElement('div');
  d.textContent = text;
  d.style.cssText = `position:fixed;left:18px;top:${topPct}%;z-index:55;pointer-events:none;font-size:11px;color:${color};border-left:2px solid ${color};padding-left:7px;opacity:0.55;letter-spacing:2px;font-weight:600;transition:opacity 0.35s;`;
  document.body.appendChild(d);
  layerDivs.push(d);
}
addLayerLabel('细胞外液', '29%', '#79c0ff');
addLayerLabel('磷脂双分子层', '47%', '#f0a040');
addLayerLabel('细胞质', '63%', '#79c0ff');

function updateLayerDivs() {
  layerDivs.forEach(d => d.style.opacity = showLabels ? '0.55' : '0');
}

// ===================== 点击检测 =====================
const raycaster = new THREE.Raycaster();
const popup = document.getElementById('popup');
const popTitle = document.getElementById('popTitle');
const popDesc = document.getElementById('popDesc');
let highlighted = null, popTimer = null;

canvas.addEventListener('click', ev => {
  const m = new THREE.Vector2();
  m.x = (ev.clientX/innerWidth)*2 - 1;
  m.y = -(ev.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(m, camera);
  const meshes = [];
  clickTargets.forEach(g => g.traverse(c => { if(c.isMesh) meshes.push({m:c, g}); }));
  const hits = raycaster.intersectObjects(meshes.map(a=>a.m), false);
  if (hits.length) {
    const found = meshes.find(a=>a.m===hits[0].object);
    if (found) { showPopup(ev.clientX, ev.clientY, found.g.userData); highlight(found.g); return; }
  }
  hidePopup(); unhighlight();
});

function showPopup(x,y,d) {
  clearTimeout(popTimer);
  popTitle.textContent = d.title; popTitle.style.color = d.color;
  popDesc.textContent = d.desc;
  popup.style.left = x+'px'; popup.style.top = y+'px';
  popup.classList.add('show');
}
function hidePopup() {
  popup.classList.remove('show');
  popTimer = setTimeout(() => { popTitle.textContent=''; popDesc.textContent=''; }, 250);
}
function highlight(g) {
  unhighlight(); highlighted = g;
  g.traverse(c => {
    if (c.isMesh && c.material.emissive) {
      c.userData._e = c.material.emissive.getHex();
      c.userData._ei = c.material.emissiveIntensity || 0;
      c.material.emissive = new THREE.Color(c.material.color).multiplyScalar(0.45);
      c.material.emissiveIntensity = 0.55;
    }
  });
}
function unhighlight() {
  if (!highlighted) return;
  highlighted.traverse(c => {
    if (c.isMesh && c.userData._e !== undefined) {
      c.material.emissive.setHex(c.userData._e);
      c.material.emissiveIntensity = c.userData._ei;
    }
  });
  highlighted = null;
}

// ===================== 按钮 =====================
window.toggleAuto = () => {
  ctrl.autoRotate = !ctrl.autoRotate;
  document.getElementById('btnAuto').classList.toggle('on', ctrl.autoRotate);
};
window.toggleLabels = () => {
  showLabels = !showLabels;
  document.getElementById('btnLabel').classList.toggle('on', showLabels);
  updateCSSLabels(); updateLayerDivs();
};
let showProts = true;
window.toggleProteins = () => {
  showProts = !showProts;
  document.getElementById('btnProt').classList.toggle('on', showProts);
  protGroup.visible = showProts;
  cholGroup.visible = showProts;
};
window.resetView = () => {
  const sT = ctrl.target.clone(), eT = new THREE.Vector3(0,0,0);
  const sC = camera.position.clone(), eC = new THREE.Vector3(0.4,0.2,12.5);
  const t0 = performance.now();
  function anim(now) {
    const t = Math.min((now-t0)/800, 1);
    const e = t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    ctrl.target.lerpVectors(sT, eT, e);
    camera.position.lerpVectors(sC, eC, e);
    ctrl.update();
    if (t<1) requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
  hidePopup(); unhighlight();
};

// ===================== 动画循环 =====================
function animate() {
  requestAnimationFrame(animate);
  ctrl.update();
  updateCSSLabels(); updateLayerDivs();

  const t = performance.now() * 0.001;

  // 磷脂分子流动镶嵌动画：侧向微移 + 轻微摆动
  lipidMols.forEach(function(lip) {
    lip.mesh.position.x = lip.baseX + Math.sin(t * 0.6 + lip.phase) * 0.03;
    lip.mesh.position.z = lip.baseZ + Math.cos(t * 0.5 + lip.phase * 1.3) * 0.03;
    lip.mesh.rotation.z = Math.sin(t * 0.8 + lip.phase) * lip.sway;
    lip.mesh.rotation.x = Math.cos(t * 0.7 + lip.phase * 1.7) * lip.sway * 0.5;
  });

  // 通道蛋白：离子沿通道从细胞外（上）穿越到细胞内（下），通道蛋白自身不变形
  if (channelIonAnim) {
    const cyc = ((t * 0.35) % 1); // 0→1 周期
    const eased = cyc < 0.08 ? cyc / 0.08 : 1; // 进入通道后快速穿行
    channelIonAnim.ion.position.y = channelIonAnim.topY - (channelIonAnim.topY - channelIonAnim.bottomY) * eased;
    channelIonAnim.ion.material.opacity = cyc < 0.9 ? 1 : 1 - (cyc - 0.9) / 0.1;
    channelIonAnim.ion.material.transparent = true;
    channelIonAnim.ion.visible = cyc < 0.95;
  }

  // 载体蛋白：结合 → 构象改变 → 底物跨膜 → 释放（诱导契合）
  if (carrierAnim) {
    const cyc = (t * 0.25) % 1;
    // 四个阶段：0-0.25 底物靠近并结合, 0.25-0.5 构象改变(左叶右移,右叶左移), 0.5-0.75 底物从另一侧释放, 0.75-1 复位
    let subY, subZ, lobeShift;
    if (cyc < 0.2) {
      // 底物从细胞外靠近结合位点
      const p = cyc / 0.2;
      subY = 0.8 + (0.3 - 0.8) * p;
      subZ = 0.1;
      lobeShift = 0;
    } else if (cyc < 0.4) {
      // 构象改变：左右叶向中间靠拢、旋转
      const p = (cyc - 0.2) / 0.2;
      subY = 0.3 + (-0.3 - 0.3) * p;
      subZ = 0.1 - 0.2 * p;
      lobeShift = 0.08 * Math.sin(p * Math.PI);
    } else if (cyc < 0.6) {
      // 底物从细胞内侧释放
      const p = (cyc - 0.4) / 0.2;
      subY = -0.3 + (-0.85 + 0.3) * p;
      subZ = -0.1;
      lobeShift = 0.08 * Math.sin((1 - p) * Math.PI);
    } else {
      // 蛋白复位，下一个底物准备
      const p = (cyc - 0.6) / 0.4;
      subY = -0.85 + (0.8 + 0.85) * p;
      subZ = -0.1 + 0.2 * p;
      lobeShift = 0;
    }
    carrierAnim.substrate.position.y = subY;
    carrierAnim.substrate.position.z = subZ;
    carrierAnim.substrate.visible = cyc < 0.65;
    carrierAnim.leftLobe.position.x = lobeShift;
    carrierAnim.rightLobe.position.x = -lobeShift;
    carrierAnim.leftLobe.rotation.z = lobeShift * 0.5;
    carrierAnim.rightLobe.rotation.z = -lobeShift * 0.5;
    // ATP 脉冲发光（供能）
    const pulse = 0.5 + Math.sin(t * 4) * 0.25;
    carrierAnim.atp.material.emissiveIntensity = pulse;
    carrierAnim.atp.position.y = 0.4 + Math.sin(t * 1.5) * 0.08;
  }

  // 水分子轻微上下浮动 + 缓慢自转（模拟布朗运动）
  waterSpheres.forEach(function(w) {
    w.mesh.position.y = w.baseY + Math.sin(t * 1.2 + w.phase) * 0.06;
    w.mesh.rotation.y += 0.003;
  });

  // 离子浮动（限制在各自区域，不穿越磷脂尾部）
  ionMeshes.forEach(function(io) {
    io.mesh.position.y = io.baseY + Math.sin(t * 1.0 + io.phase) * 0.12;
  });

  renderer.render(scene, camera);
}

// ===================== 事件 =====================
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
window.addEventListener('keydown', e => {
  switch(e.key.toLowerCase()) {
    case 'r': resetView(); break;
    case 'a': toggleAuto(); break;
    case 'l': toggleLabels(); break;
    case 'p': toggleProteins(); break;
    case 'escape': hidePopup(); unhighlight(); break;
  }
});

animate();
console.log('🧬 磷脂双分子层 · 流动镶嵌模型 已就绪');

} catch(e) {
  console.error('初始化失败:', e);
  document.body.innerHTML += '<div style="position:fixed;top:80px;left:20px;z-index:9999;color:#ff4444;background:#0a0a0a;padding:16px;font-size:13px;border:1px solid red;border-radius:8px;max-width:90%;"><b>初始化错误:</b> ' + e.message + '<br><small>' + e.stack + '</small></div>';
}
</script>
</body>
