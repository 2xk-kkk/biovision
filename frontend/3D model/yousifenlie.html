<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有丝分裂 — 染色体行为 3D 演示</title>
<style>
  :root {
    --bg: #0d1117; --panel: rgba(13,17,23,0.9); --text: #e6edf3; --muted: #8b949e;
    --cyan: #79c0ff; --violet: #b39bff; --yellow: #ffd166; --shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Microsoft YaHei","PingFang SC",sans-serif; color: var(--text); background: var(--bg); }
  #cv { position: fixed; inset: 0; display: block; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 18px;
    background: rgba(13,17,23,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .back-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.05); color: #c9d1d9; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.25s; flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,0.12); border-color: #fff; box-shadow: 0 0 14px rgba(121,192,255,0.2); }
  .topbar h1 {
    font-size: 15px; font-weight: 600; letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--cyan), #f0a040);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .topbar-actions { margin-left: auto; display: flex; gap: 6px; }
  .tb-btn {
    padding: 5px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); color: #b0b8c0; font-size: 12px; font-family: inherit;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.1); color: #e6edf3; }
  .tb-btn.on { background: rgba(121,192,255,0.15); border-color: rgba(121,192,255,0.4); color: var(--cyan); }

  .legend {
    position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 50;
    background: var(--panel); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    padding: 14px 16px; min-width: 160px; backdrop-filter: blur(10px); box-shadow: var(--shadow);
  }
  .legend h3 { font-size: 11px; color: var(--muted); margin-bottom: 10px; letter-spacing: 1px; }
  .lg-item { display: flex; align-items: center; gap: 9px; padding: 5px 6px; margin: 1px -6px; border-radius: 5px; font-size: 11px; color: #b0b8c0; cursor: pointer; transition: background 0.15s; }
  .lg-item:hover { background: rgba(255,255,255,0.04); }
  .lg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .lg-dot.chromatin { background: #b0a0d0; }
  .lg-dot.dup-chrom { background: #8d77ff; }
  .lg-dot.single-chrom { background: #60d8ff; }
  .lg-dot.spindle { background: #79c0ff; }
  .lg-dot.centrosome { background: #f0a040; }
  .lg-dot.equator { background: rgba(121,192,255,0.6); border: 1px dashed rgba(121,192,255,0.8); border-radius: 2px; }

  .controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
    display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 999px;
    background: var(--panel); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); box-shadow: var(--shadow);
  }
  .ctrl-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: #c9d1d9; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .ctrl-btn.play-btn { width: 44px; height: 44px; font-size: 20px; background: rgba(121,192,255,0.2); border-color: rgba(121,192,255,0.4); }
  .scrub { width: 260px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); cursor: pointer; position: relative; overflow: visible; }
  .scrub-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, rgba(121,192,255,0.8), rgba(179,155,255,0.8)); }
  .scrub-thumb { position: absolute; top: 50%; transform: translate(-50%,-50%); width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--cyan); box-shadow: 0 0 10px rgba(121,192,255,0.5); pointer-events: none; }

  .phase-indicator {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 90;
    padding: 8px 18px; border-radius: 999px; background: rgba(13,17,23,0.85);
    border: 1px solid rgba(121,192,255,0.2); backdrop-filter: blur(8px);
    font-size: 14px; font-weight: 600; letter-spacing: 1px; color: var(--cyan); transition: all 0.3s;
  }
  .phase-desc { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; letter-spacing: 0; max-width: 500px; }

  .data-panel {
    position: fixed; left: 18px; top: 50%; transform: translateY(-50%); z-index: 50;
    display: flex; flex-direction: column; gap: 10px;
  }
  .data-card {
    padding: 14px 16px; border-radius: 12px; background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(8px);
    min-width: 130px; text-align: center;
  }
  .data-card .label { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; display: block; }
  .data-card .value { font-size: 26px; font-weight: 800; margin-top: 4px; display: block; }
  .data-card .value.dna { color: #6ee7ff; }
  .data-card .value.chr { color: #c29cff; }
  .data-card .value.sis { color: #ffd166; }
  .data-card .change { font-size: 11px; margin-top: 3px; display: block; }
  .data-card .change.up { color: #63f3b4; }
  .data-card .change.down { color: #ff7aa2; }
  .data-card .change.flat { color: var(--muted); }

  .info-popup {
    position: fixed; z-index: 200; pointer-events: none; opacity: 0;
    transform: translate(-50%,-115%); transition: opacity 0.25s, transform 0.25s;
    background: var(--panel); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
    padding: 13px 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); max-width: 260px; backdrop-filter: blur(12px);
  }
  .info-popup.show { opacity: 1; transform: translate(-50%,-130%); }
  .info-popup h4 { font-size: 13px; margin-bottom: 5px; }
  .info-popup p { font-size: 11px; color: var(--muted); line-height: 1.55; }
  .info-popup::after { content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 7px solid rgba(13,17,23,0.95); }

  .hint { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 50; padding: 6px 16px; border-radius: 999px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); font-size: 11px; color: var(--muted); letter-spacing: 0.5px; backdrop-filter: blur(8px); pointer-events: none; }
  .hint em { color: var(--cyan); font-style: normal; }

  .speed-badge { position: fixed; bottom: 28px; right: 24px; z-index: 100; font-size: 10px; color: var(--muted); display: flex; gap: 4px; }
  .speed-badge span { padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: all 0.2s; }
  .speed-badge span:hover, .speed-badge span.on { background: rgba(121,192,255,0.15); border-color: rgba(121,192,255,0.3); color: var(--cyan); }

  @media (max-width: 768px) {
    .legend { display: none; }
    .data-panel { left: 4px; gap: 6px; }
    .data-card { padding: 8px 10px; min-width: 90px; }
    .data-card .value { font-size: 20px; }
    .scrub { width: 120px; }
    .phase-indicator { top: 56px; font-size: 12px; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="topbar">
  <a href="main.html" class="back-btn">←</a>
  <h1>有丝分裂 · 染色体行为 3D 演示</h1>
  <div class="topbar-actions">
    <button class="tb-btn on" id="btnAuto" onclick="toggleAuto()">⟳ 自动旋转</button>
    <button class="tb-btn on" id="btnLabel" onclick="toggleLabels()">🏷 标注</button>
    <button class="tb-btn" onclick="resetView()">↺ 重置</button>
  </div>
</div>

<div class="legend">
  <h3>图例</h3>
  <div class="lg-item" data-p="chromatin"><div class="lg-dot chromatin"></div> 染色质（间期）</div>
  <div class="lg-item" data-p="dup-chrom"><div class="lg-dot dup-chrom"></div> 复制后染色体</div>
  <div class="lg-item" data-p="single-chrom"><div class="lg-dot single-chrom"></div> 子染色体</div>
  <div class="lg-item" data-p="spindle"><div class="lg-dot spindle"></div> 纺锤丝</div>
  <div class="lg-item" data-p="centrosome"><div class="lg-dot centrosome"></div> 中心体</div>
  <div class="lg-item" data-p="equator"><div class="lg-dot equator"></div> 赤道板</div>
</div>

<div class="phase-indicator" id="phaseIndicator">
  间期
  <span class="phase-desc" id="phaseDesc"></span>
</div>

<div class="data-panel">
  <div class="data-card">
    <span class="label">DNA 含量</span>
    <span class="value dna" id="dnaValue">1n</span>
    <span class="change flat" id="dnaChange">→ 2n</span>
  </div>
  <div class="data-card">
    <span class="label">染色体数</span>
    <span class="value chr" id="chrValue">1n</span>
    <span class="change flat" id="chrChange">→ 2n</span>
  </div>
  <div class="data-card">
    <span class="label">姐妹染色单体</span>
    <span class="value sis" id="sisValue">0</span>
    <span class="change flat" id="sisChange">→ 2n</span>
  </div>
</div>

<div class="info-popup" id="popup"><h4 id="popTitle"></h4><p id="popDesc"></p></div>

<div class="controls">
  <button class="ctrl-btn" onclick="stepBack()" title="后退">⏮</button>
  <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">▶</button>
  <button class="ctrl-btn" onclick="stepForward()" title="前进">⏭</button>
  <div class="scrub" id="scrubBar">
    <div class="scrub-fill" id="scrubFill"></div>
    <div class="scrub-thumb" id="scrubThumb"></div>
  </div>
  <button class="ctrl-btn" onclick="resetAnim()" title="重置">↺</button>
</div>

<div class="speed-badge">
  速度
  <span onclick="setSpeed(0.5)">0.5×</span>
  <span class="on" onclick="setSpeed(1)">1×</span>
  <span onclick="setSpeed(2)">2×</span>
</div>

<div class="hint">🖱 <em>拖拽</em>旋转 | 🔍 <em>滚轮</em>缩放 | <em>空格</em>播放</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ========== STATE ==========
const state = {
  progress: 0, playing: false, speed: 1, lastTs: 0, showLabels: true
};

// ========== SCENE ==========
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('cv'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 14, 45);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 60);
camera.position.set(0, 0.5, 9);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x556677, 3.5));
const key = new THREE.DirectionalLight(0xfff8ee, 6);
key.position.set(6, 5, 6);
scene.add(key);
scene.add(new THREE.DirectionalLight(0x8899cc, 2).position.set(-4, 0, -3));
scene.add(new THREE.DirectionalLight(0xb0c8ff, 2.5).position.set(0, -2, 5));

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.target.set(0, 0, 0);
ctrl.enableDamping = true; ctrl.dampingFactor = 0.08;
ctrl.minDistance = 3; ctrl.maxDistance = 18;
ctrl.autoRotate = true; ctrl.autoRotateSpeed = 0.5;
ctrl.update();

// ========== HELPERS ==========
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const lerp = (a, b, t) => a + (b - a) * t;

const clickTargets = [];
function clk(g, d) { g.userData = d; clickTargets.push(g); }

// ========== MATERIALS ==========
const matChromosome = new THREE.MeshStandardMaterial({
  color: 0x8d77ff, roughness: 0.22, metalness: 0.08,
  emissive: 0x2a1a5e, emissiveIntensity: 0.35,
});
const matSingleChrom = new THREE.MeshStandardMaterial({
  color: 0x60d8ff, roughness: 0.22, metalness: 0.08,
  emissive: 0x1a3a5e, emissiveIntensity: 0.35,
});
const matCentromere = new THREE.MeshStandardMaterial({
  color: 0xffd166, roughness: 0.12, metalness: 0.15,
  emissive: 0x402000, emissiveIntensity: 0.5,
});
const matKinetochore = new THREE.MeshStandardMaterial({
  color: 0xff7aa2, roughness: 0.15, metalness: 0.1,
  emissive: 0x400010, emissiveIntensity: 0.3,
});
const matChromatin = new THREE.MeshBasicMaterial({
  color: 0xb0a0d0, transparent: true, opacity: 0.45, depthWrite: false,
});
const matSpindle = new THREE.MeshBasicMaterial({
  color: 0x79c0ff, transparent: true, opacity: 0.28, depthWrite: false,
});
const matCentrosomeOuter = new THREE.MeshStandardMaterial({
  color: 0xf0a040, roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.5,
});
const matCentrosomeInner = new THREE.MeshStandardMaterial({
  color: 0xffc060, roughness: 0.15, metalness: 0.05, emissive: 0x402000, emissiveIntensity: 0.5,
});
const matAstral = new THREE.MeshBasicMaterial({
  color: 0xf0a040, transparent: true, opacity: 0.18, depthWrite: false,
});

// ========== GRID FLOOR (orientation reference) ==========
const gridHelper = new THREE.PolarGridHelper(4.5, 32, 24, 64, 0x222233, 0x1a1a2e);
scene.add(gridHelper);

// ========== EQUATOR REFERENCE LINE ==========
const equatorGroup = new THREE.Group();
scene.add(equatorGroup);
// Vertical dashed-line ring at equator
const equatorRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.6, 0.04, 16, 100),
  new THREE.MeshBasicMaterial({ color: 0x79c0ff, transparent: true, opacity: 0.3, depthWrite: false })
);
equatorRing.rotation.y = Math.PI / 2;
equatorGroup.add(equatorRing);
// A faint ring in the XZ plane
const equatorDisc = new THREE.Mesh(
  new THREE.RingGeometry(0.15, 2.55, 80),
  new THREE.MeshBasicMaterial({ color: 0x79c0ff, transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false })
);
equatorDisc.rotation.x = -Math.PI / 2;
equatorGroup.add(equatorDisc);

// ========== BUILD CHROMOSOME GEOMETRIES ==========
// X-shaped duplicated chromosome: 4 Bezier arms + glowing centromere
function buildDupChromosome(armLen, thickness) {
  const g = new THREE.Group();
  const L = armLen || 1.3;
  const T = thickness || 0.07;

  function makeArm(cx, cy, cx1, cy1, cx2, cy2, endX, endY) {
    const curve = new THREE.CubicBezierCurve3(
      new THREE.Vector3(cx, cy, 0),
      new THREE.Vector3(cx1, cy1, 0),
      new THREE.Vector3(cx2, cy2, 0),
      new THREE.Vector3(endX, endY, 0)
    );
    const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, T, 10, false), matChromosome);
    mesh.castShadow = true;
    return mesh;
  }

  const hT = T * 2.5;
  // Left chromatid
  g.add(makeArm(-hT, 0, -hT - 0.45, -L * 0.4,  -hT - 0.5, -L * 0.75, -0.12, -L));
  g.add(makeArm(-hT, 0, -hT - 0.45,  L * 0.4,  -hT - 0.5,  L * 0.75, -0.12,  L));
  // Right chromatid
  g.add(makeArm( hT, 0,  hT + 0.45, -L * 0.4,   hT + 0.5, -L * 0.75,  0.12, -L));
  g.add(makeArm( hT, 0,  hT + 0.45,  L * 0.4,   hT + 0.5,  L * 0.75,  0.12,  L));

  // Centromere (glowing sphere)
  const centro = new THREE.Mesh(new THREE.SphereGeometry(T * 4.5, 16, 10), matCentromere);
  centro.scale.set(1, 0.65, 1);
  g.add(centro);

  return g;
}

// Single chromatid (post-separation): rod shape
function buildSingleChromatid(armLen, thickness) {
  const g = new THREE.Group();
  const L = armLen || 1.3;
  const T = thickness || 0.06;

  const upperCurve = new THREE.CubicBezierCurve3(
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(-0.12, -L * 0.25, 0),
    new THREE.Vector3(-0.06, -L * 0.7, 0),
    new THREE.Vector3(0, -L, 0)
  );
  g.add(new THREE.Mesh(new THREE.TubeGeometry(upperCurve, 18, T, 10, false), matSingleChrom));

  const lowerCurve = new THREE.CubicBezierCurve3(
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(-0.12, L * 0.25, 0),
    new THREE.Vector3(-0.06, L * 0.7, 0),
    new THREE.Vector3(0, L, 0)
  );
  g.add(new THREE.Mesh(new THREE.TubeGeometry(lowerCurve, 18, T, 10, false), matSingleChrom));

  // Kinetochore dot
  const kc = new THREE.Mesh(new THREE.SphereGeometry(T * 3, 8, 6), matKinetochore);
  g.add(kc);

  return g;
}

// ========== CHROMOSOME GROUPS ==========
const CHROM_COUNT = 4; // 4 pairs = 8 chromatids total
const dupChromGroup = new THREE.Group();
const singleChromGroup = new THREE.Group();
scene.add(dupChromGroup);
scene.add(singleChromGroup);

const dupChroms = [];
const singleChroms = [];
for (let i = 0; i < CHROM_COUNT; i++) {
  const dc = buildDupChromosome(1.2, 0.065);
  dc.visible = false;
  dupChromGroup.add(dc);
  dupChroms.push(dc);

  for (let j = 0; j < 2; j++) {
    const sc = buildSingleChromatid(1.15, 0.055);
    sc.visible = false;
    singleChromGroup.add(sc);
    singleChroms.push(sc);
  }
}
clk(dupChromGroup, { name: 'dup-chrom', title: '复制后染色体（含2条染色单体）', desc: '每条染色体由着丝粒连接两条姐妹染色单体。DNA已完成复制，含量为2n。染色体数仍为n（按着丝粒计数）。', color: '#8d77ff' });
clk(singleChromGroup, { name: 'single-chrom', title: '子染色体（染色单体分开后）', desc: '后期着丝粒分裂，每条姐妹染色单体成为独立子染色体。此时染色体数暂时加倍为2n，DNA含量仍为2n。', color: '#60d8ff' });

// ========== CHROMATIN THREADS (interphase) ==========
const chromatinGroup = new THREE.Group();
scene.add(chromatinGroup);
const chromatinThreads = [];
const chromatinBase = [];
const THREAD_COUNT = 8;
for (let i = 0; i < THREAD_COUNT; i++) {
  const r = 0.08 + Math.random() * 0.1;
  // Torus as irregular chromatin blob
  const geo = new THREE.TorusGeometry(r, r * 0.25, 8, 8);
  const t = new THREE.Mesh(geo, matChromatin);
  t.visible = false;
  chromatinGroup.add(t);
  chromatinThreads.push(t);

  const phi = Math.acos(2 * Math.random() - 1);
  const theta = Math.random() * Math.PI * 2;
  chromatinBase.push({
    phi, theta,
    dist: 0.25 + Math.random() * 0.9,
    speed: 0.5 + Math.random() * 1.0,
    seed: Math.random() * 100,
  });
}
clk(chromatinGroup, { name: 'chromatin', title: '染色质（间期）', desc: '间期染色质呈细丝状松散分布于细胞核区域。S期DNA复制后，每条染色质含两份DNA拷贝（但尚未浓缩成可见染色体）。', color: '#b0a0d0' });

// ========== SPINDLE APPARATUS ==========
const spindleGroup = new THREE.Group();
spindleGroup.visible = false;
scene.add(spindleGroup);

// Centrosomes
const centrosomeL = new THREE.Group();
const centrosomeR = new THREE.Group();
spindleGroup.add(centrosomeL); spindleGroup.add(centrosomeR);

function makeCentrosome() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), matCentrosomeOuter));
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), matCentrosomeInner));
  for (let i = 0; i < 10; i++) {
    const phi = Math.random() * Math.PI * 0.55;
    const theta = Math.random() * Math.PI * 2;
    const len = 0.3 + Math.random() * 0.5;
    const ray = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, len, 5), matAstral);
    ray.position.set(
      Math.sin(phi) * Math.cos(theta) * len * 0.5,
      Math.sin(phi) * Math.sin(theta) * len * 0.5,
      Math.cos(phi) * len * 0.5
    );
    ray.lookAt(new THREE.Vector3(Math.sin(phi)*Math.cos(theta)*5, Math.sin(phi)*Math.sin(theta)*5, Math.cos(phi)*5));
    g.add(ray);
  }
  return g;
}
centrosomeL.add(makeCentrosome());
centrosomeR.add(makeCentrosome());
clk(centrosomeL, { name: 'centrosome', title: '中心体（细胞两极）', desc: '微管组织中心，发出星射线并组装纺锤体。前期移向细胞两极，为染色体分离做准备。', color: '#f0a040' });

// Spindle fibers
const spindleFibersGroup = new THREE.Group();
spindleGroup.add(spindleFibersGroup);
const kinetochoreFibers = [];
const polarFibers = [];
for (let i = 0; i < CHROM_COUNT * 2; i++) {
  const fiber = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1, 6), matSpindle);
  fiber.visible = false;
  spindleFibersGroup.add(fiber);
  kinetochoreFibers.push(fiber);
}
for (let i = 0; i < 5; i++) {
  const fiber = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1, 6), matSpindle.clone());
  fiber.material.opacity = 0.1;
  fiber.visible = false;
  spindleFibersGroup.add(fiber);
  polarFibers.push(fiber);
}
clk(spindleGroup, { name: 'spindle', title: '纺锤体', desc: '由中心体和纺锤丝组成。着丝粒微管连接染色体着丝粒与中心体，牵引染色体运动。后期牵引子染色体移向两极。', color: '#79c0ff' });

// ========== LABELS ==========
const labelDefs = [
  { text: '染色体', pos: new THREE.Vector3(0, -0.8, 2.0), color: '#8d77ff' },
  { text: '着丝粒', pos: new THREE.Vector3(1.2, 0, 2.0), color: '#ffd166' },
  { text: '中心体', pos: new THREE.Vector3(-3.0, 0, 0.6), color: '#f0a040' },
  { text: '纺锤丝', pos: new THREE.Vector3(1.8, 0.8, 1.5), color: '#79c0ff' },
  { text: '赤道板', pos: new THREE.Vector3(2.0, 1.6, 0.5), color: '#79c0ff' },
];
const labelEls = [];
labelDefs.forEach(d => {
  const el = document.createElement('div');
  el.textContent = d.text;
  el.style.cssText = `position:fixed;z-index:55;pointer-events:none;font-size:11px;font-weight:600;color:${d.color};text-shadow:0 0 8px rgba(0,0,0,0.9);letter-spacing:1px;white-space:nowrap;transition:opacity 0.35s;`;
  document.body.appendChild(el);
  labelEls.push({ el, pos: d.pos });
});

function updateLabels() {
  labelEls.forEach(({ el, pos }) => {
    const v = pos.clone().project(camera);
    el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
    el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
    el.style.transform = 'translate(-50%,-50%)';
    el.style.opacity = (state.showLabels && v.z < 1) ? '1' : '0';
  });
}

// ========== DATA CURVES ==========
const dnaPoints   = [[0,1],[0.1,1],[0.16,2],[0.82,2],[0.82,1],[1,1]];
const chrPoints   = [[0,1],[0.36,1],[0.58,1],[0.58,2],[0.82,2],[0.82,1],[1,1]];
const sisPoints   = [[0,0],[0.1,0],[0.16,2],[0.58,2],[0.58,0],[1,0]];

function sampleCurve(pts, p) {
  if (p <= pts[0][0]) return pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    if (p <= pts[i + 1][0]) {
      const span = pts[i + 1][0] - pts[i][0] || 1;
      return lerp(pts[i][1], pts[i + 1][1], clamp((p - pts[i][0]) / span, 0, 1));
    }
  }
  return pts[pts.length - 1][1];
}

// Track previous values for change indicators
let prevDna = 1, prevChr = 1, prevSis = 0;

function getChangeTag(cur, prev) {
  if (cur > prev + 0.05) return 'up';
  if (cur < prev - 0.05) return 'down';
  return 'flat';
}

function getPhaseInfo(p) {
  if (p < 0.2) return ['间期', '染色质细丝状散布，S期DNA复制→每条染色质含两份DNA拷贝'];
  if (p < 0.36) return ['前期', '染色质螺旋化→浓缩为X形染色体（着丝粒+两条姐妹染色单体），纺锤体形成'];
  if (p < 0.58) return ['中期', '染色体着丝粒整齐排列在赤道板上，纺锤丝连接着丝粒，形态数目最清晰'];
  if (p < 0.82) return ['后期', '着丝粒分裂！姐妹染色单体分开→子染色体，纺锤丝牵引移向两极'];
  return ['末期', '子染色体解螺旋→染色质，纺锤体消失，胞质分裂→两个子细胞'];
}

// Initial scatter positions for chromosomes (random within ~nucleus area, radius ~1.0)
const initPositions = [
  { x: -0.5, y: 0.3,  z: 0.15 },
  { x: 0.55, y: -0.25, z: -0.1 },
  { x: -0.35, y: -0.5, z: 0.35 },
  { x: 0.45, y: 0.45,  z: -0.25 },
];
// Where each chromosome ends up on the equator line
const equatorPositions = [0.65, 0.2, -0.25, -0.65];

// ========== ORIENT FIBER HELPER ==========
function orientFiber(mesh, x1, y1, z1, x2, y2, z2) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, mz = (z1 + z2) / 2;
  const dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz) || 0.001;
  mesh.position.set(mx, my, mz);
  mesh.scale.y = len;
  mesh.setRotationFromQuaternion(
    new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(dx/len, dy/len, dz/len))
  );
}

// ========== RENDER ==========
function render(ts) {
  const p = clamp(state.progress, 0, 1);

  const proPh   = clamp((p - 0.2) / 0.16, 0, 1);
  const metaPh  = clamp((p - 0.36) / 0.22, 0, 1);
  const anaPh   = clamp((p - 0.58) / 0.24, 0, 1);
  const teloPh  = clamp((p - 0.82) / 0.18, 0, 1);
  const sPhaseP = clamp((p - 0.06) / 0.12, 0, 1);

  const chromatinVis = clamp(1 - proPh * 3, 0, 1);
  const spindleVis   = clamp((p - 0.24) / 0.12, 0, 1) * clamp(1 - (p - 0.78) / 0.06, 0, 1);
  const equatorVis   = clamp((p - 0.30) / 0.06, 0, 1) * clamp(1 - (p - 0.60) / 0.04, 0, 1);

  // ===== CHROMATIN (interphase) =====
  const liveThreads = 4 + Math.floor(sPhaseP * 4);
  for (let i = 0; i < THREAD_COUNT; i++) {
    const t = chromatinThreads[i];
    if (i < liveThreads && chromatinVis > 0.02) {
      t.visible = true;
      const b = chromatinBase[i];
      const phi = b.phi + ts * 0.0006 * b.speed;
      const theta = b.theta + ts * 0.0008 * b.speed;
      const r = b.dist * (1 - proPh * 0.7);
      t.position.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.sin(phi) * Math.sin(theta),
        r * Math.cos(phi)
      );
      t.material.opacity = chromatinVis * 0.4;
      const scl = 1 - proPh * 0.6;
      t.scale.setScalar(scl);
      t.rotation.set(ts * 0.0005 + b.seed, ts * 0.0007 + b.seed, ts * 0.0003 + b.seed);
    } else {
      t.visible = false;
    }
  }

  // ===== EQUATOR =====
  equatorGroup.visible = equatorVis > 0.03;
  if (equatorGroup.visible) {
    equatorRing.material.opacity = equatorVis * 0.3;
    equatorDisc.material.opacity = equatorVis * 0.06;
  }

  // ===== CHROMOSOMES =====
  const condense = clamp(proPh * 1.05, 0, 1);

  if (p < 0.58) {
    // --- Duplicated chromosomes (prophase + metaphase) ---
    dupChromGroup.visible = true;
    singleChromGroup.visible = false;

    for (let i = 0; i < CHROM_COUNT; i++) {
      const dc = dupChroms[i];
      if (condense < 0.03) { dc.visible = false; continue; }
      dc.visible = true;

      const init = initPositions[i];
      const eqY = equatorPositions[i];

      // Interpolate from scattered → equator
      const tx = lerp(init.x * (1 - condense), 0, metaPh);
      const ty = lerp(init.y * (1 - condense), eqY, metaPh);
      const tz = lerp(init.z * (1 - condense), 0, metaPh);

      dc.position.set(tx, ty, tz);
      // Orient towards equator plane during metaphase
      dc.rotation.set(metaPh * 0.3, metaPh * Math.PI * 0.5, metaPh * 0.3 + i * 0.7);
      dc.scale.setScalar(0.06 + condense * 0.94);

      dc.children.forEach(c => {
        if (c.material && c.material.opacity !== undefined) {
          c.material.opacity = condense;
        }
      });
    }
  } else {
    // --- Single chromatids (anaphase + telophase) ---
    dupChromGroup.visible = false;
    singleChromGroup.visible = true;

    const drift = clamp(teloPh * 1.2, 0, 1);
    const finalSep = 1.8 + drift * 0.7;
    const decond = clamp((teloPh - 0.25) / 0.75, 0, 1);

    for (let i = 0; i < CHROM_COUNT; i++) {
      const eqY = equatorPositions[i];
      const sepDist = anaPh * 3.0;

      for (let j = 0; j < 2; j++) {
        const sc = singleChroms[i * 2 + j];
        const side = j === 0 ? -1 : 1;

        sc.visible = decond < 0.95;
        if (!sc.visible) continue;

        const x = lerp(side * sepDist, side * finalSep, drift);
        sc.position.set(x, eqY * (1 - decond * 0.5), decond * (j === 0 ? -0.15 : 0.15));
        sc.scale.setScalar(0.82 - decond * 0.55);
        sc.rotation.set(decond * 0.8, j * Math.PI, decond * 1.0);

        sc.children.forEach(c => {
          if (c.material && c.material.opacity !== undefined) {
            c.material.opacity = (1 - decond) * 0.85;
          }
        });
      }
    }
  }

  // ===== SPINDLE =====
  if (spindleVis > 0.02) {
    spindleGroup.visible = true;
    const poleDist = anaPh * 0.25;
    const lx = -3.0 - poleDist, rx = 3.0 + poleDist;

    centrosomeL.position.set(lx, 0, 0);
    centrosomeR.position.set(rx, 0, 0);
    const csScl = 0.7 + spindleVis * 0.3;
    centrosomeL.scale.setScalar(csScl);
    centrosomeR.scale.setScalar(csScl);

    // Kinetochore fibers: connect centrosome to chromosome centromere
    for (let i = 0; i < CHROM_COUNT; i++) {
      const eqY = equatorPositions[i];
      let cx1, cy1, cx2, cy2;

      if (p < 0.58) {
        const init = initPositions[i];
        const tx = lerp(init.x * (1 - condense), 0, metaPh);
        const ty = lerp(init.y * (1 - condense), eqY, metaPh);
        cx1 = cx2 = tx; cy1 = cy2 = ty;
      } else {
        const sepDist = anaPh * 3.0;
        const drift = clamp(teloPh * 1.2, 0, 1);
        const fs = 1.8 + drift * 0.7;
        cx1 = -sepDist; cy1 = eqY;
        cx2 = sepDist;  cy2 = eqY;
      }

      const f1 = kinetochoreFibers[i * 2];
      const f2 = kinetochoreFibers[i * 2 + 1];
      f1.visible = spindleVis > 0.04;
      f2.visible = spindleVis > 0.04;
      if (f1.visible) { orientFiber(f1, cx1, cy1, 0, lx, 0, 0); f1.material.opacity = 0.22 * spindleVis; }
      if (f2.visible) { orientFiber(f2, cx2, cy2, 0, rx, 0, 0); f2.material.opacity = 0.22 * spindleVis; }
    }

    // Polar fibers
    for (let i = 0; i < 5; i++) {
      const pf = polarFibers[i];
      pf.visible = spindleVis > 0.04;
      if (pf.visible) {
        orientFiber(pf, lx, (i - 2) * 0.4, 0, rx, (i - 2) * 0.4, 0);
        pf.material.opacity = 0.06 * spindleVis;
      }
    }
  } else {
    spindleGroup.visible = false;
    kinetochoreFibers.forEach(f => f.visible = false);
    polarFibers.forEach(f => f.visible = false);
  }

  // ===== UPDATE UI =====
  const [phaseName, phaseDesc] = getPhaseInfo(p);
  document.getElementById('phaseIndicator').childNodes[0].textContent = phaseName;
  document.getElementById('phaseDesc').textContent = phaseDesc;

  const dnaVal = sampleCurve(dnaPoints, p);
  const chrVal = sampleCurve(chrPoints, p);
  const sisVal = sampleCurve(sisPoints, p);

  document.getElementById('dnaValue').textContent = dnaVal.toFixed(1) + 'n';
  document.getElementById('chrValue').textContent = chrVal.toFixed(1) + 'n';
  document.getElementById('sisValue').textContent = sisVal.toFixed(1) + 'n';

  // Change indicators
  document.getElementById('dnaChange').textContent = '→ ' + sampleCurve(dnaPoints, Math.min(1, p + 0.1)).toFixed(1) + 'n';
  document.getElementById('chrChange').textContent = '→ ' + sampleCurve(chrPoints, Math.min(1, p + 0.1)).toFixed(1) + 'n';
  document.getElementById('sisChange').textContent = '→ ' + sampleCurve(sisPoints, Math.min(1, p + 0.1)).toFixed(1) + 'n';

  document.getElementById('dnaChange').className = 'change ' + getChangeTag(dnaVal, prevDna);
  document.getElementById('chrChange').className = 'change ' + getChangeTag(chrVal, prevChr);
  document.getElementById('sisChange').className = 'change ' + getChangeTag(sisVal, prevSis);
  prevDna = dnaVal; prevChr = chrVal; prevSis = sisVal;

  const pct = Math.round(p * 100);
  document.getElementById('scrubFill').style.width = pct + '%';
  document.getElementById('scrubThumb').style.left = pct + '%';

  updateLabels();
}

// ========== ANIMATION LOOP ==========
function animate(ts) {
  requestAnimationFrame(animate);
  if (state.playing) {
    const delta = Math.min(0.05, (ts - state.lastTs) / 1000);
    state.lastTs = ts;
    const np = state.progress + delta * 0.12 * state.speed;
    if (np >= 1) { state.progress = 1; state.playing = false; document.getElementById('playBtn').textContent = '▶'; }
    else state.progress = np;
  }
  render(ts);
  ctrl.update();
  renderer.render(scene, camera);
}

// ========== EVENT HANDLERS ==========
window.togglePlay = () => {
  state.playing = !state.playing;
  document.getElementById('playBtn').textContent = state.playing ? '⏸' : '▶';
  if (state.playing) state.lastTs = performance.now();
};
window.resetAnim = () => {
  state.playing = false;
  document.getElementById('playBtn').textContent = '▶';
  state.progress = 0;
  prevDna = 1; prevChr = 1; prevSis = 0;
};
window.stepForward = () => {
  state.playing = false;
  document.getElementById('playBtn').textContent = '▶';
  state.progress = clamp(state.progress + 0.02, 0, 1);
};
window.stepBack = () => {
  state.playing = false;
  document.getElementById('playBtn').textContent = '▶';
  state.progress = clamp(state.progress - 0.02, 0, 1);
};
window.setSpeed = (s) => {
  state.speed = s;
  document.querySelectorAll('.speed-badge span').forEach(el => {
    el.classList.toggle('on', parseFloat(el.textContent) === s);
  });
};
window.toggleAuto = () => {
  ctrl.autoRotate = !ctrl.autoRotate;
  document.getElementById('btnAuto').classList.toggle('on', ctrl.autoRotate);
};
window.toggleLabels = () => {
  state.showLabels = !state.showLabels;
  document.getElementById('btnLabel').classList.toggle('on', state.showLabels);
};
window.resetView = () => {
  const st = ctrl.target.clone(), et = new THREE.Vector3(0, 0, 0);
  const sc = camera.position.clone(), ec = new THREE.Vector3(0, 0.5, 9);
  const t0 = performance.now();
  (function anim(n) {
    const t = Math.min((n - t0) / 700, 1);
    const e = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    ctrl.target.lerpVectors(st, et, e);
    camera.position.lerpVectors(sc, ec, e);
    ctrl.update();
    if (t < 1) requestAnimationFrame(anim);
  })();
  hidePopup();
};

// Scrub bar
const scrubBar = document.getElementById('scrubBar');
let scrubbing = false;
scrubBar.addEventListener('pointerdown', (e) => {
  scrubbing = true; state.playing = false;
  document.getElementById('playBtn').textContent = '▶';
  scrubBar.setPointerCapture(e.pointerId);
  updateScrub(e.clientX);
});
scrubBar.addEventListener('pointermove', (e) => { if (scrubbing) updateScrub(e.clientX); });
window.addEventListener('pointerup', () => { scrubbing = false; });
function updateScrub(cx) {
  state.progress = clamp((cx - scrubBar.getBoundingClientRect().left) / scrubBar.getBoundingClientRect().width, 0, 1);
}

// Click to identify
const raycaster = new THREE.Raycaster();
const popup = document.getElementById('popup'), popTitle = document.getElementById('popTitle'), popDesc = document.getElementById('popDesc');
document.getElementById('cv').addEventListener('click', (ev) => {
  const m = new THREE.Vector2((ev.clientX/innerWidth)*2-1, -(ev.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(m, camera);
  const meshes = [];
  clickTargets.forEach(g => g.traverse(c => { if (c.isMesh && c.visible) meshes.push({ mesh: c, group: g }); }));
  const hits = raycaster.intersectObjects(meshes.map(o => o.mesh), false);
  if (hits.length) {
    const found = meshes.find(o => o.mesh === hits[0].object);
    if (found) { showPopup(ev.clientX, ev.clientY, found.group.userData); return; }
  }
  hidePopup();
});
function showPopup(x, y, d) {
  popTitle.textContent = d.title; popTitle.style.color = d.color;
  popDesc.textContent = d.desc;
  popup.style.left = x+'px'; popup.style.top = y+'px';
  popup.classList.add('show');
}
function hidePopup() { popup.classList.remove('show'); }

// Keyboard
window.addEventListener('keydown', (e) => {
  switch (e.key.toLowerCase()) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'r': resetView(); break;
    case 'a': toggleAuto(); break;
    case 'l': toggleLabels(); break;
    case 'arrowright': stepForward(); break;
    case 'arrowleft': stepBack(); break;
    case 'escape': hidePopup(); break;
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Init
state.lastTs = performance.now();
render(state.lastTs);
animate(state.lastTs);
</script>
