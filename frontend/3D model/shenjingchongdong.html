<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神经冲动传导演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "黑体", sans-serif;
      background: #eef1f5;
    }

    #cv {
      display: block;
      position: fixed;
      inset: 0;
    }

    .controls {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .ctrl-btn {
      padding: 7px 18px;
      border-radius: 20px;
      border: 1.5px solid #c0c8d0;
      background: rgba(255, 255, 255, 0.85);
      color: #555;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
      backdrop-filter: blur(6px);
    }

    .ctrl-btn:hover {
      background: #fff;
      border-color: #5b9bd5;
      color: #5b9bd5;
    }

    .ctrl-btn.on {
      background: #5b9bd5;
      border-color: #5b9bd5;
      color: #fff;
    }

    .ctrl-btn.stim {
      background: #e0554a;
      border-color: #e0554a;
      color: #fff;
    }

    .ctrl-btn.stim:hover {
      background: #f06050;
      border-color: #f06050;
      color: #fff;
    }

    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 30;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid #c0c8d0;
      background: rgba(255, 255, 255, 0.85);
      color: #555;
      font-size: 20px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: all .2s;
    }

    .back-btn:hover {
      background: #fff;
      border-color: #5b9bd5;
      color: #5b9bd5;
    }

    .info-panel {
      position: fixed;
      top: 16px;
      left: 64px;
      z-index: 20;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1.5px solid #c0c8d0;
      background: rgba(255, 255, 255, 0.88);
      color: #555;
      font-size: 12px;
      font-family: inherit;
      backdrop-filter: blur(6px);
      line-height: 1.8;
      min-width: 155px;
    }

    .info-panel b {
      color: #3a3a3a;
    }

    .hint-text {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid #c0c8d0;
      background: rgba(255, 255, 255, 0.8);
      color: #888;
      font-size: 11px;
      font-family: inherit;
      backdrop-filter: blur(6px);
    }
  </style>
</head>

<body>
  <canvas id="cv"></canvas>

  <a href="main3.html" class="back-btn" title="返回">←</a>

  <div class="info-panel" id="infoPanel">
    <b>⚡ 膜电位：</b><span id="mvLabel" style="color:#4a8dc7;font-weight:bold;font-size:15px;">-70.0 mV</span><br>
    <b>📌 阶段：</b><span id="stageLabel" style="color:#3a3a3a;">静息电位</span>
  </div>

  <div class="hint-text">
    点击轴突 或 按 <b>S</b> 键刺激 &nbsp;|&nbsp; 空格键 播放/暂停
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnPlay" onclick="togglePlay()">▶ 自动演示</button>
    <button class="ctrl-btn stim" id="btnStim" onclick="doStimulate()" style="font-size:15px;padding:9px 28px;font-weight:bold;">⚡ 刺激</button>
    <button class="ctrl-btn" id="btnSpeed" onclick="toggleSpeed()">1×</button>
    <button class="ctrl-btn" onclick="resetAnim()">↺ 重置</button>
  </div>

  <script>
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(devicePixelRatio, devicePixelRatio);
      W = innerWidth;
      H = innerHeight;
    }
    resize();
    window.addEventListener('resize', () => { resize(); updateLayout(); });

    // ===== 常量 =====
    const RESTING = -70;
    const THRESHOLD = -55;
    const PEAK = 35;
    const HYPERPOL = -82;

    const C = {
      bg: '#f5f6f8',
      extracellular: '#e3ecf5',
      cytoplasmic: '#f0f2f5',
      membrane: '#4a8dc7',
      membraneL: '#7ab4de',
      naColor: '#4b8def',
      naColorLight: '#8ab8ff',
      kColor: '#e8a040',
      kColorLight: '#f0c870',
      text: '#3a3a3a',
      textLight: '#777',
      depolarized: '#e0554a',
      electrode: '#666',
      wire: '#888',
      gaugeBg: '#fafbfc',
      gaugeRing: '#c8cdd5',
      waveResting: '#6db3d8',
      waveActive: '#e0554a',
      waveRecover: '#e8a040',
    };

    // ===== 状态 =====
    let playing = false;
    let speed = 1;
    let simTime = 0;
    let lastTs = 0;
    let stimTimes = [];
    let potentialHistory = [];
    const HISTORY_MAX = 800;

    // 布局参数
    let axonX0, axonX1, axonY, memTopY, memBotY;

    function updateLayout() {
      axonX0 = W * 0.05;
      axonX1 = W * 0.78;
      axonY = H * 0.26;
      memTopY = axonY - 9;
      memBotY = axonY + 9;
    }
    updateLayout();

    // ===== 数学工具 =====
    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function easeOut(t) { return 1 - (1 - t) * (1 - t); }
    function easeIn(t) { return t * t; }

    // ===== 动作电位波形 =====
    function potentialAtDistance(d, ww) {
      const n = d / ww;
      if (n < -2.5) return RESTING;
      if (n < -0.8) { const t = (n + 2.5) / 1.7; return RESTING + (THRESHOLD - RESTING) * easeInOut(t); }
      if (n < 0.0) { const t = (n + 0.8) / 0.8; return THRESHOLD + (PEAK - THRESHOLD) * easeOut(t); }
      if (n < 1.0) { const t = n / 1.0; return PEAK + (HYPERPOL - PEAK) * easeInOut(t); }
      if (n < 2.8) { const t = (n - 1.0) / 1.8; return HYPERPOL + (RESTING - HYPERPOL) * easeInOut(t); }
      return RESTING;
    }

    function getPotentialAt(axX) {
      const waveWidth = W * 0.055;
      let result = RESTING;
      for (const st of stimTimes) {
        const age = simTime - st;
        if (age < 0 || age > 7) continue;
        const waveCenter = axonX0 + age * W * 0.13;
        // 波已跑出轴突范围则跳过
        if (waveCenter > axonX1 + waveWidth * 3) continue;
        const d = axX - waveCenter;
        const v = potentialAtDistance(d, waveWidth);
        if (v > result) result = v;
      }
      return result;
    }

    function getRecPotential() {
      return getPotentialAt(axonX0 + (axonX1 - axonX0) * 0.5);
    }

    function lerpColor(c1, c2, t) {
      const r1 = parseInt(c1.slice(1, 3), 16), g1 = parseInt(c1.slice(3, 5), 16), b1 = parseInt(c1.slice(5, 7), 16);
      const r2 = parseInt(c2.slice(1, 3), 16), g2 = parseInt(c2.slice(3, 5), 16), b2 = parseInt(c2.slice(5, 7), 16);
      const r = Math.round(lerp(r1, r2, clamp(t, 0, 1)));
      const g = Math.round(lerp(g1, g2, clamp(t, 0, 1)));
      const b = Math.round(lerp(b1, b2, clamp(t, 0, 1)));
      return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    // ===== 绘图工具 =====
    function circle(x, y, r, fill, stroke, sw) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw || 1.5; ctx.stroke(); }
    }

    function label(x, y, text, color, size, align) {
      ctx.font = `${size || 14}px "Microsoft YaHei","PingFang SC","黑体",sans-serif`;
      ctx.textAlign = align || 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color || C.text;
      ctx.fillText(text, x, y);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    function drawArrow(x1, y1, x2, y2, color, w) {
      const dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy);
      if (len < 2) return;
      const ux = dx / len, uy = dy / len, hl = Math.min(12, len * 0.35);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hl, y2 - uy * hl);
      ctx.strokeStyle = color; ctx.lineWidth = w || 2; ctx.lineCap = 'round'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - ux * hl - uy * hl * 0.45, y2 - uy * hl + ux * hl * 0.45);
      ctx.lineTo(x2 - ux * hl + uy * hl * 0.45, y2 - uy * hl - ux * hl * 0.45);
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }

    // ===== 离子系统 =====
    let ions = [];

    function initIons() {
      updateLayout();
      ions = [];
      // Na+ 细胞外
      for (let i = 0; i < 55; i++) {
        const x = axonX0 + Math.random() * (axonX1 - axonX0);
        const y = memTopY - 6 - Math.random() * H * 0.13;
        ions.push({ type: 'na', x, y, bx: x, by: y, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3 });
      }
      // K+ 细胞内
      for (let i = 0; i < 45; i++) {
        const x = axonX0 + Math.random() * (axonX1 - axonX0);
        const y = memBotY + 6 + Math.random() * H * 0.15;
        ions.push({ type: 'k', x, y, bx: x, by: y, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3 });
      }
    }
    initIons();

    function updateAndDrawIons() {
      for (const p of ions) {
        p.x += p.vx + (Math.random() - 0.5) * 0.35;
        p.y += p.vy + (Math.random() - 0.5) * 0.35;
        p.vx *= 0.97;
        p.vy *= 0.97;

        // 边界
        if (p.type === 'na') p.y = clamp(p.y, memTopY - H * 0.15, memTopY - 2);
        else p.y = clamp(p.y, memBotY + 2, memBotY + H * 0.17);
        p.x = clamp(p.x, axonX0, axonX1);

        // 回归力
        p.x += (p.bx - p.x) * 0.0015;
        p.y += (p.by - p.y) * 0.0015;
      }

      // 绘制离子
      for (const p of ions) {
        const r = p.type === 'na' ? 2.5 : 3;
        const fill = p.type === 'na' ? C.naColor : C.kColor;
        const stroke = p.type === 'na' ? C.naColorLight : C.kColorLight;
        circle(p.x, p.y, r, fill, stroke, 0.7);
      }

      // 跨膜运动离子（通过开放通道）
      const recX = axonX0 + (axonX1 - axonX0) * 0.5;
      const spacing = W * 0.048;
      for (let i = -3; i <= 3; i++) {
        const cx = recX + i * spacing;
        const isNaCh = i % 2 === 0;
        const locV = getPotentialAt(cx);

        let open = false;
        if (isNaCh) open = locV > THRESHOLD && locV < PEAK + 5;
        else open = locV > -25;

        if (open) {
          for (let j = 0; j < 3; j++) {
            const ph = (simTime * 3.5 + j * 0.7) % 1;
            const sy = isNaCh ? memTopY - 14 : memBotY + 14;
            const dy = isNaCh ? memBotY + 10 : memTopY - 10;
            const iy = lerp(sy, dy, easeInOut(ph));
            const ix = cx + Math.sin(ph * Math.PI * 2) * 2.5;
            const alpha = ph < 0.08 || ph > 0.92 ? 0.2 : 0.85;
            ctx.globalAlpha = alpha;
            circle(ix, iy, isNaCh ? 2.2 : 2.5, isNaCh ? C.naColor : C.kColor, null, 0);
            ctx.globalAlpha = 1;
          }
          // 流动方向小箭头
          if (isNaCh) drawArrow(cx + 8, memTopY - 8, cx + 8, memBotY + 2, C.naColor, 1.2);
          else drawArrow(cx - 8, memBotY + 8, cx - 8, memTopY - 2, C.kColor, 1.2);
        }
      }

      // 散落标签
      for (let i = 0; i < ions.length; i++) {
        if (Math.random() < 0.008) {
          const p = ions[i];
          label(p.x + 6, p.y, p.type === 'na' ? 'Na⁺' : 'K⁺',
            p.type === 'na' ? C.naColor : C.kColor, 8, 'left');
        }
      }
    }

    // ===== 轴突膜 =====
    function drawAxonMembrane() {
      // 细胞外液背景
      ctx.fillStyle = C.extracellular;
      ctx.fillRect(axonX0, memTopY - H * 0.15, axonX1 - axonX0, H * 0.15);

      // 细胞质背景
      ctx.fillStyle = C.cytoplasmic;
      ctx.fillRect(axonX0, memBotY, axonX1 - axonX0, H * 0.17);

      // 膜电位热力图（沿膜的颜色变化）
      const N = 300;
      const segW = (axonX1 - axonX0) / N;
      for (let i = 0; i < N; i++) {
        const x = axonX0 + segW * i;
        const v = getPotentialAt(x);
        let col;
        const dev = v - RESTING;
        if (dev < 3) col = C.waveResting;
        else if (v < THRESHOLD) col = lerpColor(C.waveResting, C.waveActive, dev / (THRESHOLD - RESTING));
        else col = C.waveActive;
        const alpha = 0.18 + 0.6 * clamp(Math.abs(dev) / 80, 0, 1);

        ctx.globalAlpha = alpha;
        ctx.fillStyle = col;
        ctx.fillRect(x, memTopY - 3, segW + 1, 26);
        ctx.globalAlpha = 1;
      }

      // 磷脂双分子层
      ctx.beginPath(); ctx.moveTo(axonX0, memTopY); ctx.lineTo(axonX1, memTopY);
      ctx.strokeStyle = C.membrane; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.stroke();

      ctx.beginPath(); ctx.moveTo(axonX0, memBotY); ctx.lineTo(axonX1, memBotY);
      ctx.strokeStyle = C.membraneL; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();

      ctx.fillStyle = 'rgba(74,141,199,0.05)';
      ctx.fillRect(axonX0, memTopY, axonX1 - axonX0, 18);

      // 磷脂头（小圆）
      for (let x = axonX0 + 8; x < axonX1 - 8; x += 11) {
        circle(x, memTopY + 3, 2, 'rgba(74,141,199,0.35)', null, 0);
        circle(x + 5.5, memBotY - 3, 2, 'rgba(122,180,222,0.35)', null, 0);
      }

      // 标注
      label(axonX0 + 12, memTopY - H * 0.06, '细胞外液（Na⁺ 浓度高）', C.textLight, 11, 'left');
      label(axonX0 + 12, memBotY + H * 0.06, '细胞质（K⁺ 浓度高）', C.textLight, 11, 'left');
    }

    // ===== 离子通道 =====
    function drawIonChannels() {
      const recX = axonX0 + (axonX1 - axonX0) * 0.5;
      const spacing = W * 0.048;
      const chW = 16;

      for (let i = -3; i <= 3; i++) {
        const cx = recX + i * spacing;
        const isNa = i % 2 === 0;
        const locV = getPotentialAt(cx);

        let open = false;
        if (isNa) open = locV > THRESHOLD && locV < PEAK + 5;
        else open = locV > -25;

        // 通道蛋白
        const col = isNa ? C.naColor : C.kColor;
        ctx.fillStyle = open
          ? (isNa ? 'rgba(75,141,239,0.3)' : 'rgba(232,160,64,0.3)')
          : (isNa ? 'rgba(75,141,239,0.1)' : 'rgba(232,160,64,0.1)');
        roundRect(cx - chW / 2, memTopY - 6, chW, 30, 5);
        ctx.fill();
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.3;
        roundRect(cx - chW / 2, memTopY - 6, chW, 30, 5);
        ctx.stroke();

        // 通道孔
        ctx.beginPath(); ctx.moveTo(cx, memTopY - 3); ctx.lineTo(cx, memBotY + 3);
        ctx.strokeStyle = open ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)';
        ctx.lineWidth = open ? 4 : 2; ctx.lineCap = 'round'; ctx.stroke();
        ctx.strokeStyle = col;
        ctx.lineWidth = 0.6; ctx.stroke();

        // 门控指示球
        const gateX = cx + (isNa ? (open ? -5 : 4) : (open ? 5 : -4));
        const gateY = isNa ? memTopY + 1 : memBotY - 1;
        circle(gateX, gateY, 3, open ? '#4caf84' : '#e0554a', open ? '#388e5c' : '#c03030', 1);

        // 通道标签（仅中间几个）
        if (Math.abs(i) <= 1) {
          label(cx, memTopY - 14, isNa ? 'Na⁺' : 'K⁺', col, 9, 'center');
          label(cx, memBotY + 10, '通道', C.textLight, 8, 'center');
        }
      }
    }

    // ===== Na+/K+ 泵 =====
    function drawNaKPump() {
      const px = axonX0 + (axonX1 - axonX0) * 0.10;
      ctx.fillStyle = 'rgba(130,130,210,0.12)';
      roundRect(px - 20, memTopY - 6, 40, 30, 7);
      ctx.fill();
      ctx.strokeStyle = 'rgba(130,130,210,0.45)';
      ctx.lineWidth = 1.3;
      roundRect(px - 20, memTopY - 6, 40, 30, 7);
      ctx.stroke();

      label(px, memTopY - 12, 'Na⁺/K⁺', '#8888cc', 8, 'center');
      label(px, memBotY + 12, 'ATP泵', '#8888cc', 8, 'center');

      // Na+ 出
      drawArrow(px - 7, memBotY + 6, px - 7, memTopY - 10, C.naColor, 1.2);
      label(px - 7, memTopY - 16, '3Na⁺', C.naColor, 7, 'center');
      // K+ 进
      drawArrow(px + 7, memTopY - 10, px + 7, memBotY + 6, C.kColor, 1.2);
      label(px + 7, memBotY + 18, '2K⁺', C.kColor, 7, 'center');
    }

    // ===== 电极与电压表 =====
    function drawElectrodeAndMeter() {
      const recX = axonX0 + (axonX1 - axonX0) * 0.5;
      const vRec = getRecPotential();
      const gaugeCX = axonX1 + W * 0.10;
      const gaugeCY = axonY - H * 0.02;

      // === 记录电极（微电极，刺入膜内）===
      const tipX = recX;
      const tipY = memBotY + 3;

      // 微电极管
      ctx.beginPath();
      ctx.moveTo(tipX - 2, tipY);
      ctx.lineTo(tipX - 1.5, tipY + 30);
      ctx.lineTo(tipX - 5, tipY + 38);
      ctx.lineTo(tipX + 3, tipY + 38);
      ctx.lineTo(tipX + 3.5, tipY + 30);
      ctx.lineTo(tipX + 2, tipY);
      ctx.closePath();
      ctx.fillStyle = 'rgba(220,225,230,0.85)';
      ctx.fill();
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 电极尖端（刺入膜）
      ctx.beginPath();
      ctx.moveTo(tipX - 1.2, tipY);
      ctx.lineTo(tipX - 2, tipY + 10);
      ctx.lineTo(tipX + 2, tipY + 10);
      ctx.lineTo(tipX + 1.2, tipY);
      ctx.closePath();
      ctx.fillStyle = '#bbb';
      ctx.fill();

      label(tipX - 14, tipY + 34, '记录电极\n（膜内侧）', C.textLight, 8, 'right');

      // === 参考电极（膜外）===
      const refX = recX + 40;
      const refY = memTopY - 3;
      ctx.beginPath();
      ctx.moveTo(refX, refY);
      ctx.lineTo(refX, refY - 25);
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.stroke();
      circle(refX, refY, 3.5, '#e8e8e8', '#aaa', 1.2);
      label(refX + 14, refY - 16, '参考电极\n（膜外侧）', C.textLight, 8, 'left');

      // === 导线连向电压表 ===
      // 记录电极导线
      ctx.beginPath(); ctx.setLineDash([3, 4]);
      ctx.moveTo(tipX, tipY + 38);
      ctx.lineTo(tipX, H * 0.53);
      ctx.lineTo(gaugeCX - 48, H * 0.53);
      ctx.lineTo(gaugeCX - 48, gaugeCY - 8);
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);

      // 参考电极导线
      ctx.beginPath(); ctx.setLineDash([3, 4]);
      ctx.moveTo(refX, refY - 25);
      ctx.lineTo(refX, H * 0.14);
      ctx.lineTo(gaugeCX + 48, H * 0.14);
      ctx.lineTo(gaugeCX + 48, gaugeCY - 8);
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);

      // 导线标注
      label(tipX, H * 0.53 + 10, '— 接电压表负端', C.textLight, 8, 'center');
      label(refX, H * 0.14 - 8, '+ 接电压表正端', C.textLight, 8, 'center');

      // === 电压表 ===
      drawVoltmeterGauge(gaugeCX, gaugeCY, vRec);
    }

    function drawVoltmeterGauge(cx, cy, mV) {
      const R = 58;

      // 外圈
      circle(cx, cy, R + 9, null, C.gaugeRing, 2.5);
      circle(cx, cy, R + 7, C.gaugeBg, null, 0);

      // 刻度弧
      const minAngle = Math.PI * 0.78;
      const maxAngle = -Math.PI * 0.12;

      // 彩色区域
      // 蓝区：-100 ~ -60 (静息/超极化)
      ctx.beginPath();
      ctx.arc(cx, cy, R - 7, mapMV(-85), mapMV(-60));
      ctx.strokeStyle = 'rgba(74,141,199,0.25)'; ctx.lineWidth = 7; ctx.stroke();
      // 红区：-10 ~ +40 (去极化)
      ctx.beginPath();
      ctx.arc(cx, cy, R - 7, mapMV(-10), mapMV(40));
      ctx.strokeStyle = 'rgba(224,85,74,0.22)'; ctx.lineWidth = 7; ctx.stroke();

      // 刻度线
      for (let v = -100; v <= 50; v += 10) {
        const a = mapMV(v);
        const maj = v % 20 === 0;
        const ir = R - (maj ? 17 : 11), or2 = R - 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * ir, cy + Math.sin(a) * ir);
        ctx.lineTo(cx + Math.cos(a) * or2, cy + Math.sin(a) * or2);
        ctx.strokeStyle = C.text; ctx.lineWidth = maj ? 1.8 : 0.7; ctx.stroke();
        if (maj) label(cx + Math.cos(a) * (R - 24), cy + Math.sin(a) * (R - 24), v + '', C.text, 9, 'center');
      }

      // 标注
      label(cx + Math.cos(mapMV(-70)) * (R - 28), cy + Math.sin(mapMV(-70)) * (R - 28) - 8, '静息', '#4a8dc7', 8, 'center');
      label(cx + Math.cos(mapMV(35)) * (R - 28), cy + Math.sin(mapMV(35)) * (R - 28) - 8, '锋电位', '#e0554a', 8, 'center');

      // 单位
      label(cx, cy - R - 16, '膜电位计 (mV)', C.text, 13, 'center');

      // 指针
      const nA = mapMV(mV);
      const nL = R - 15;
      const nx = cx + Math.cos(nA) * nL;
      const ny = cy + Math.sin(nA) * nL;

      ctx.beginPath(); ctx.moveTo(cx + 1, cy + 1); ctx.lineTo(nx + 1, ny + 1);
      ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.stroke();

      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(nx, ny);
      ctx.strokeStyle = mV > -20 ? '#e0554a' : '#333'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke();

      circle(nx, ny, 3, mV > -20 ? '#e0554a' : '#333', null, 0);
      circle(cx, cy, 5.5, '#fff', '#777', 1.5);
      circle(cx, cy, 2.5, '#555', null, 0);

      // 数字读数窗
      const dy = cy + R + 18;
      roundRect(cx - 34, dy - 12, 68, 28, 8);
      ctx.fillStyle = '#fdfdfd'; ctx.fill();
      ctx.strokeStyle = C.gaugeRing; ctx.lineWidth = 1.2; roundRect(cx - 34, dy - 12, 68, 28, 8); ctx.stroke();
      const clr = mV > -20 ? C.depolarized : (mV < -65 ? '#4a8dc7' : C.text);
      label(cx, dy + 2, mV.toFixed(1) + ' mV', clr, 15, 'center');
    }

    function mapMV(mV) {
      const minA = Math.PI * 0.78, maxA = -Math.PI * 0.12;
      const t = (mV - (-100)) / (50 - (-100));
      return minA + (maxA - minA) * clamp(t, 0, 1);
    }

    // ===== 动作电位曲线图 =====
    function drawActionPotentialGraph() {
      const gx = axonX0;
      const gw = axonX1 - axonX0;
      const gy = H * 0.62;
      const gh = H * 0.28;

      // 背景面板
      roundRect(gx - 12, gy - 12, gw + 24, gh + 28, 10);
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
      ctx.strokeStyle = C.gaugeRing; ctx.lineWidth = 1.2;
      roundRect(gx - 12, gy - 12, gw + 24, gh + 28, 10); ctx.stroke();

      // 标题
      label(gx + gw / 2, gy - 4, '膜电位变化曲线（记录电极处）', C.text, 12, 'center');

      // 网格
      const mVGrid = [-80, -70, -55, -40, -10, 0, 20, 35, 50];
      for (const mv of mVGrid) {
        const y = gy + ((50 - mv) / 150) * gh;
        if (y < gy || y > gy + gh) continue;
        ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw, y);
        const isKey = (mv === 0 || mv === RESTING || mv === THRESHOLD);
        ctx.strokeStyle = isKey ? 'rgba(0,0,0,0.13)' : 'rgba(0,0,0,0.05)';
        ctx.lineWidth = isKey ? 1 : 0.5;
        if (isKey) ctx.setLineDash([5, 7]); else ctx.setLineDash([2, 8]);
        ctx.stroke(); ctx.setLineDash([]);
      }

      // 外框
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.strokeRect(gx, gy, gw, gh);

      // Y轴标签
      for (const mv of [RESTING, 0, THRESHOLD, PEAK]) {
        const y = gy + ((50 - mv) / 150) * gh;
        const lx = gx - 18;
        const clr = mv === RESTING ? '#4a8dc7' : (mv === THRESHOLD ? '#e8a040' : (mv === PEAK ? '#e0554a' : '#888'));
        label(lx, y, mv + 'mV', clr, 9, 'right');
        // 小虚线标记
        ctx.beginPath(); ctx.setLineDash([2, 3]);
        ctx.moveTo(gx - 3, y); ctx.lineTo(gx, y);
        ctx.strokeStyle = clr; ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
      }

      // X轴
      ctx.save();
      ctx.translate(gx - 30, gy + gh / 2);
      ctx.rotate(-Math.PI / 2);
      label(0, 0, '膜电位 (mV)', C.text, 11, 'center');
      ctx.restore();
      label(gx + gw / 2, gy + gh + 14, '时间 →', C.text, 11, 'center');

      // 更新历史
      const vRec = getRecPotential();
      potentialHistory.push({ t: simTime, mv: vRec });
      if (potentialHistory.length > HISTORY_MAX) potentialHistory.shift();

      // 绘制曲线
      if (potentialHistory.length > 1) {
        const tMax = potentialHistory[potentialHistory.length - 1].t;
        const tMin = tMax - 4.5;

        // 填充
        ctx.beginPath();
        let first = true;
        for (const pt of potentialHistory) {
          if (pt.t < tMin && potentialHistory.length > 20) continue;
          const px = gx + ((pt.t - tMin) / (tMax - tMin)) * gw;
          const py = gy + ((50 - pt.mv) / 150) * gh;
          if (first) { ctx.moveTo(px, py); first = false; }
          else ctx.lineTo(px, py);
        }
        const lp = potentialHistory[potentialHistory.length - 1];
        const fp = potentialHistory[0];
        const lpx = gx + ((lp.t - tMin) / (tMax - tMin)) * gw;
        const fpx = gx + ((fp.t - tMin) / (tMax - tMin)) * gw;
        const baseY = gy + ((50 - RESTING) / 150) * gh;
        ctx.lineTo(lpx, baseY); ctx.lineTo(fpx, baseY); ctx.closePath();
        const grad = ctx.createLinearGradient(0, gy, 0, gy + gh);
        grad.addColorStop(0, 'rgba(224,85,74,0.25)');
        grad.addColorStop(0.5, 'rgba(224,85,74,0.08)');
        grad.addColorStop(1, 'rgba(74,141,199,0.04)');
        ctx.fillStyle = grad; ctx.fill();

        // 曲线
        ctx.beginPath();
        first = true;
        for (const pt of potentialHistory) {
          if (pt.t < tMin && potentialHistory.length > 20) continue;
          const px = gx + ((pt.t - tMin) / (tMax - tMin)) * gw;
          const py = gy + ((50 - pt.mv) / 150) * gh;
          if (first) { ctx.moveTo(px, py); first = false; }
          else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = '#e0554a'; ctx.lineWidth = 2.3; ctx.lineJoin = 'round'; ctx.stroke();
      }

      // 阶段标注
      const lblX = gx + 14;
      const rY = gy + ((50 - RESTING) / 150) * gh;
      const tY = gy + ((50 - THRESHOLD) / 150) * gh;
      const pY = gy + ((50 - PEAK) / 150) * gh;
      const hY = gy + ((50 - HYPERPOL) / 150) * gh;

      label(lblX, rY - 8, '① 静息电位', '#4a8dc7', 9.5, 'left');
      label(lblX + gw * 0.38, tY - 8, '② 阈电位', '#e8a040', 9.5, 'left');
      label(lblX + gw * 0.2, pY - 8, '③ 去极化 Na⁺内流', '#e0554a', 9.5, 'left');
      label(lblX + gw * 0.5, rY + 8, '④ 复极化 K⁺外流', '#e8a040', 9.5, 'left');
      label(lblX + gw * 0.65, hY - 4, '⑤ 超极化', '#b878d8', 9.5, 'left');

      // 当前值点
      const cpx = gx + gw - 4;
      const cpy = gy + ((50 - vRec) / 150) * gh;
      circle(cpx, cpy, 4.5, '#e0554a', '#fff', 1.8);

      // 静息电位虚线延伸
      ctx.beginPath(); ctx.setLineDash([3, 5]);
      ctx.moveTo(gx, rY); ctx.lineTo(gx + gw, rY);
      ctx.strokeStyle = 'rgba(74,141,199,0.3)'; ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
    }

    // ===== 传播方向箭头 =====
    function drawPropagationArrow() {
      // 找出最活跃的波的位置
      let bestSt = null, bestV = -999;
      for (const st of stimTimes) {
        const age = simTime - st;
        if (age < 0 || age > 7) continue;
        const wc = axonX0 + age * W * 0.13;
        if (wc > axonX0 + W * 0.05 && wc < axonX1) {
          const v = getPotentialAt(wc);
          if (v > bestV) { bestV = v; bestSt = st; }
        }
      }

      if (bestSt !== null) {
        const age = simTime - bestSt;
        const wc = axonX0 + age * W * 0.13;
        if (wc > axonX0 + W * 0.06 && wc < axonX1 - W * 0.04) {
          // 在波上方画传播箭头
          const ay = memTopY - H * 0.04;
          drawArrow(wc - 35, ay, wc + 35, ay, C.depolarized, 2.2);
          label(wc, ay - 12, '冲动传导方向 →', C.depolarized, 11, 'center');
        }
      }
    }

    // ===== 膜上标注（去极化区/静息区）=====
    function drawMembraneZoneLabels() {
      // 找到去极化区域
      let depStart = -1, depEnd = -1;
      const N = 200;
      for (let i = 0; i < N; i++) {
        const x = axonX0 + ((axonX1 - axonX0) / (N - 1)) * i;
        const v = getPotentialAt(x);
        if (v > -55) {
          if (depStart < 0) depStart = x;
          depEnd = x;
        }
      }

      if (depStart > 0 && depEnd > depStart + 20) {
        const midX = (depStart + depEnd) / 2;
        ctx.fillStyle = 'rgba(224,85,74,0.12)';
        ctx.fillRect(depStart, memTopY - 3, depEnd - depStart, 26);

        label(midX, memBotY + 16, '兴奋区（去极化）', C.depolarized, 9, 'center');

        // 左侧静息区标注
        if (depStart > axonX0 + 60) {
          label(axonX0 + (depStart - axonX0) / 2, memBotY + 16, '静息区', '#4a8dc7', 9, 'center');
        }
      }
    }

    // ===== 膜内外电荷符号 (+/−) =====
    function drawChargeSymbols() {
      const step = 32;
      const fontSize = 14;

      for (let x = axonX0 + step; x < axonX1 - step; x += step) {
        const v = getPotentialAt(x);
        const exc = clamp((v - RESTING) / (PEAK - RESTING), 0, 1);

        // 膜外侧符号
        const outY = memTopY - 7;
        if (exc < 0.45) {
          const alpha = 0.35 + 0.65 * (1 - exc / 0.45);
          ctx.globalAlpha = alpha;
          label(x, outY, '+', '#e0554a', fontSize, 'center');
        } else {
          const alpha = 0.35 + 0.65 * clamp((exc - 0.45) / 0.55, 0, 1);
          ctx.globalAlpha = alpha;
          label(x, outY, '−', '#4a8dc7', fontSize, 'center');
        }
        ctx.globalAlpha = 1;

        // 膜内侧符号
        const inY = memBotY + 7;
        if (exc < 0.45) {
          const alpha = 0.35 + 0.65 * (1 - exc / 0.45);
          ctx.globalAlpha = alpha;
          label(x, inY, '−', '#4a8dc7', fontSize, 'center');
        } else {
          const alpha = 0.35 + 0.65 * clamp((exc - 0.45) / 0.55, 0, 1);
          ctx.globalAlpha = alpha;
          label(x, inY, '+', '#e0554a', fontSize, 'center');
        }
        ctx.globalAlpha = 1;
      }
    }

    // ===== 图例 =====
    function drawLegend() {
      const lx = axonX1 + W * 0.025;
      const ly = H * 0.60;
      const items = [
        { t: 'Na⁺ 离子', c: C.naColor, r: 2.5 },
        { t: 'K⁺ 离子', c: C.kColor, r: 3 },
        { t: 'Na⁺ 通道', c: C.naColor, sq: 'rgba(75,141,239,0.2)' },
        { t: 'K⁺ 通道', c: C.kColor, sq: 'rgba(232,160,64,0.2)' },
        { t: '静息膜区', c: C.waveResting, sq: C.waveResting },
        { t: '兴奋膜区', c: C.depolarized, sq: C.depolarized },
        { t: 'Na⁺/K⁺-ATP泵', c: '#8888cc', sq: 'rgba(130,130,210,0.15)' },
      ];

      const lw = 115;
      const lh = items.length * 18 + 24;
      roundRect(lx, ly, lw, lh, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
      ctx.strokeStyle = C.gaugeRing; ctx.lineWidth = 1; roundRect(lx, ly, lw, lh, 8); ctx.stroke();

      label(lx + lw / 2, ly + 14, '图 例', C.text, 11, 'center');

      for (let i = 0; i < items.length; i++) {
        const iy = ly + 28 + i * 18;
        const it = items[i];
        if (it.r) circle(lx + 12, iy, it.r, it.c, it.c, 0.7);
        else if (it.sq) {
          ctx.fillStyle = it.sq; ctx.fillRect(lx + 4, iy - 5, 16, 10);
          ctx.strokeStyle = it.c; ctx.lineWidth = 1; ctx.strokeRect(lx + 4, iy - 5, 16, 10);
        }
        label(lx + 30, iy, it.t, C.text, 9.5, 'left');
      }
    }

    // ===== 阶段判断 =====
    function getStage(mV) {
      const dev = mV - RESTING;
      if (Math.abs(dev) < 2) return { t: '静息电位（-70mV）— 膜内负、膜外正', c: '#4a8dc7' };
      if (mV < THRESHOLD && mV >= RESTING - 4) return { t: '逐渐去极化 — Na⁺通道开始开放', c: '#e8a040' };
      if (mV >= THRESHOLD && mV < PEAK) return { t: '锋电位上升相 — Na⁺大量内流！', c: '#e0554a' };
      if (mV >= RESTING - 5 && mV < THRESHOLD) return { t: '复极化 — Na⁺通道失活，K⁺外流', c: '#e8a040' };
      if (mV < RESTING - 3) return { t: '超极化 — K⁺通道延迟关闭', c: '#b878d8' };
      if (dev > 2 && mV > -5) return { t: '锋电位下降相 — K⁺持续外流', c: '#e8a040' };
      return { t: '恢复至静息电位', c: '#4a8dc7' };
    }

    // ===== 主渲染 =====
    function render() {
      updateLayout();
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);

      // 标题
      label(W / 2, H * 0.035, '神经冲动传导演示', C.text, 22, 'center');

      // 所有组件按层绘制
      drawAxonMembrane();
      drawChargeSymbols();
      drawMembraneZoneLabels();
      drawIonChannels();
      drawNaKPump();
      updateAndDrawIons();
      drawPropagationArrow();
      drawElectrodeAndMeter();
      drawActionPotentialGraph();
      drawLegend();

      // 更新 UI
      const vRec = getRecPotential();
      const stg = getStage(vRec);
      document.getElementById('mvLabel').textContent = vRec.toFixed(1) + ' mV';
      document.getElementById('mvLabel').style.color = stg.c;
      document.getElementById('stageLabel').textContent = stg.t;
      document.getElementById('stageLabel').style.color = stg.c;
    }

    // ===== 动画循环 =====
    function tick(ts) {
      requestAnimationFrame(tick);
      if (lastTs === 0) { lastTs = ts; render(); return; }
      const dt = Math.min((ts - lastTs) / 1000, 0.06);
      lastTs = ts;

      if (playing) {
        simTime += dt * speed;
        const interval = 2.8 / speed;
        if (stimTimes.length === 0 || simTime - stimTimes[stimTimes.length - 1] > interval) {
          doStimulate();
        }
      } else {
        // 非播放模式也推进时间（显示波传播）
        simTime += dt * speed;
      }

      stimTimes = stimTimes.filter(st => simTime - st < 8);
      render();
    }

    // ===== 事件 =====
    function doStimulate() {
      stimTimes.push(simTime);
      stimTimes = stimTimes.filter(st => simTime - st < 8);
    }

    window.togglePlay = () => {
      playing = !playing;
      const btn = document.getElementById('btnPlay');
      btn.classList.toggle('on', playing);
      btn.textContent = playing ? '⏸ 暂停' : '▶ 自动演示';
    };

    window.toggleSpeed = () => {
      const speeds = [0.5, 1, 2], labels = ['0.5×', '1×', '2×'];
      let i = speeds.indexOf(speed); i = (i + 1) % 3; speed = speeds[i];
      document.getElementById('btnSpeed').textContent = labels[i];
    };

    window.doStimulate = doStimulate;

    window.resetAnim = () => {
      simTime = 0;
      stimTimes = [];
      potentialHistory = [];
      initIons();
      lastTs = 0;
    };

    window.addEventListener('keydown', e => {
      if (e.key === ' ') { e.preventDefault(); togglePlay(); }
      if (e.key === 's' || e.key === 'S') { e.preventDefault(); doStimulate(); }
      if (e.key === 'r' || e.key === 'R') resetAnim();
    });

    // 点击轴突区域触发刺激
    canvas.addEventListener('click', e => {
      if (e.clientX >= axonX0 && e.clientX <= axonX1 &&
        e.clientY >= memTopY - 50 && e.clientY <= memBotY + 50) {
        doStimulate();
      }
    });

    requestAnimationFrame(tick);
  </script>
</body>
