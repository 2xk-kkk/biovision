<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我生成的 PPT</title>
  <style>
    :root {
      --bg: #f5f9ff;
      --panel: rgba(255, 255, 255, 0.88);
      --text: #17324d;
      --muted: #6d8198;
      --blue: #6ea8ff;
      --blue-strong: #4c8dff;
      --shadow: 0 18px 50px rgba(74, 116, 176, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(110, 168, 255, 0.18), transparent 24%),
        radial-gradient(circle at 85% 20%, rgba(152, 201, 255, 0.24), transparent 20%),
        linear-gradient(180deg, #fbfdff 0%, #f3f8ff 100%);
      padding: 28px;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.82);
      box-shadow: var(--shadow);
      border-radius: 28px;
      padding: 28px;
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 42px);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .card {
      margin-top: 22px;
      border-radius: 22px;
      border: 1px solid rgba(145, 181, 223, 0.24);
      background: rgba(255,255,255,0.88);
      padding: 20px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 11px 16px;
      border-radius: 999px;
      color: white;
      text-decoration: none;
      background: linear-gradient(135deg, var(--blue), var(--blue-strong));
      box-shadow: 0 12px 24px rgba(76, 141, 255, 0.2);
      font-weight: 700;
    }

    .list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .item {
      padding: 14px 16px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(246,250,255,0.92));
      border: 1px solid rgba(145, 181, 223, 0.22);
    }

    .item strong {
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1>我生成的 PPT</h1>
    <p>这里是你生成后的 PPT 结果入口，后续可以接入导出、预览和继续编辑能力。</p>

    <section class="card">
      <p>当前页面先作为跳转落点，方便你从主界面快速进入生成结果管理区。</p>
      <div class="list">
        <div class="item">
          <strong>最近生成</strong>
          <span>用于展示最近一次的生物教学 PPT。</span>
        </div>
        <div class="item">
          <strong>继续编辑</strong>
          <span>后续可在这里加入重新生成、修改章节和导出 PPT 的功能。</span>
        </div>
      </div>
    </section>

    <a class="back" href="./index.html">返回主页 →</a>
  </main>
</body>
</html>
