<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Test Section 3: loadExams template literal</title>
</head>
<body>
    <h1>Test Section 3: loadExams template literal</h1>
    <div id="output">Testing...</div>
    <script>
    var output = document.getElementById('output');
    try {
        // 全国知名高中列表
        const FAMOUS_UNIVERSITIES = [
            '人大附中', '北京四中', '上海中学', '华师大二附中',
            '南京外国语', '杭二中', '华师一附中', '成都七中',
            '深圳中学', '衡水中学'
        ];

        const HOT_UNIVERSITIES = ['人大附中', '上海中学', '衡水中学', '成都七中', '华师一附中'];

        let selectedFile = null;
        let currentYear = '全部';
        let currentUniversity = '全部';
        let currentType = '全部';
        let years = [];

        async function loadExams(year = null, university = null, type = null) {
            const container = document.getElementById('examContainer');
            try {
                let url = 'http://localhost:8000/api/exams';
                const params = ['scope=模拟'];
                if (year && year !== '全部') params.push(`year=${year}`);
                if (university && university !== '全部') params.push(`region=${encodeURIComponent(university)}`);
                if (type && type !== '全部') params.push(`type=${encodeURIComponent(type)}`);
                if (params.length > 0) url += '?' + params.join('&');

                const response = await fetch(url);
                const result = await response.json();

                if (!result.success) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">暂无试卷</div>
                            <div class="empty-desc">${result.msg || '试卷目录为空'}</div>
                        </div>
                    `;
                    return;
                }

                const data = result.data;
                const exams = data.exams;
                const stats = data.stats || {};
                years = data.years || [];

                updateStats(stats);
                updateYearSelect(years);
                updateUniversityTags();

                if (exams.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">暂无试卷</div>
                            <div class="empty-desc">请点击上方"上传试卷"添加高中模拟题</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = exams.map((exam, index) => {
                    const gradeLabel = exam.grade || exam.year || '';
                    const gradeColor = exam.grade === '高一' ? '#10b981' : exam.grade === '高二' ? '#3b82f6' : '#f59e0b';
                    return `
                    <div class="exam-card">
                        <div class="exam-card-header">
                            <div class="exam-icon">📘</div>
                            <div class="exam-title">
                                <div class="exam-name">
                                    ${gradeLabel ? `<span class="grade-badge" style="background:${gradeColor}">${gradeLabel}</span>` : ''}
                                    ${exam.region || ''} ${exam.exam_type || '模拟题'}
                                </div>
                            </div>
                        </div>
                        <div class="exam-meta">
                            <div class="meta-item">
                                <span class="meta-icon">🏫</span>
                                <span class="meta-value">${exam.region || '未知高校'}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-icon">📄</span>
        output.innerHTML = 'SUCCESS';
    } catch(e) {
        output.innerHTML = 'ERROR: ' + e.message;
    }
    </script>
</body>
</html>
