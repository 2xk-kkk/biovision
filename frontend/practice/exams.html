        }

        .top {

        }

            background: #f9fafb;

        .search-input {

        .search-btn {

            height: 16px;

        .file-upload-hint {

    <script>
        const API_BASE = 'http://localhost:8000/api';

        // ===== JWT 解析 =====
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
                    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                ).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        // ===== 头像生成 =====
        function getDefaultAvatarSVG(username, size = 40) {
            const avatarChar = (username || '用').trim()[0] || '用';
            const centerX = Math.floor(size / 2);
            const centerY = Math.floor(size / 2);
            const radius = Math.floor(size * 0.45);
            const fontSize = Math.floor(size * 0.45);
            const textY = Math.floor(size * 0.65);
            return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${size} ${size}'%3E%3Ccircle cx='${centerX}' cy='${centerY}' r='${radius}' fill='%23667eea'/%3E%3Ctext x='${centerX}' y='${textY}' text-anchor='middle' font-size='${fontSize}' fill='white'%3E${encodeURIComponent(avatarChar)}%3C/text%3E%3C/svg%3E`;
        }

        function getGuestAvatarSVG(size = 40) {
            const centerX = Math.floor(size / 2);
            const centerY = Math.floor(size / 2);
            const radius = Math.floor(size * 0.45);
            const headRadius = Math.floor(size * 0.12);
            const headY = Math.floor(size * 0.35);
            const bodyStroke = Math.floor(size * 0.1);
            const bodyY1 = Math.floor(size * 0.6);
            const bodyY2 = Math.floor(size * 0.85);
            return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${size} ${size}'%3E%3Ccircle cx='${centerX}' cy='${centerY}' r='${radius}' fill='%23d1d5db'/%3E%3Ccircle cx='${centerX}' cy='${headY}' r='${headRadius}' fill='%239ca3af'/%3E%3Cpath d='M${Math.floor(size * 0.3)} ${bodyY1} Q${centerX} ${bodyY2} ${Math.floor(size * 0.7)} ${bodyY1}' fill='none' stroke='%239ca3af' stroke-width='${bodyStroke}' stroke-linecap='round'/%3E%3C/svg%3E`;
        }

        async function loadUserAvatar() {
            const token = localStorage.getItem('token');
            const avatarImg = document.getElementById('userAvatarImg');
            if (!avatarImg) return;
            const guestAvatar = getGuestAvatarSVG(40);
            if (!token) {
                avatarImg.src = guestAvatar;
                return;
            }
            try {
                const payload = parseJwt(token);
                if (!payload || !payload.user_id) {
                    avatarImg.src = guestAvatar;
                    return;
                }
                const response = await fetch(`${API_BASE}/user/${payload.user_id}/info`, {
                    headers: { 'token': token }
                });
                const result = await response.json();
                if (result.success && result.data) {
                    const username = result.data.username || '用户';
                    const userAvatar = result.data.avatar;
                    if (userAvatar) {
                        avatarImg.src = userAvatar.startsWith('http') ? userAvatar + '?t=' + Date.now() : userAvatar;
                    } else {
                        avatarImg.src = getDefaultAvatarSVG(username, 40);
                    }
                } else {
                    avatarImg.src = getDefaultAvatarSVG('用户', 40);
                }
            } catch (error) {
                console.error('加载用户头像失败:', error);
                avatarImg.src = getDefaultAvatarSVG('用户', 40);
            }
        }

        // ===== 登录检查 =====
        (function initAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('请先登录');
                window.location.href = '../login/login-main.html';
                return;
            }
            loadUserAvatar();

            const userAvatarBtn = document.getElementById('userAvatarBtn');
            const userDropdownMenu = document.getElementById('userDropdownMenu');
            if (userAvatarBtn && userDropdownMenu) {
                userAvatarBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    userDropdownMenu.classList.toggle('show');
                });
                document.addEventListener('click', function (event) {
                    if (!userAvatarBtn.contains(event.target) && !userDropdownMenu.contains(event.target)) {
                        userDropdownMenu.classList.remove('show');
                    }
                });
            }
        })();

        let selectedFile = null;
        let currentYear = '全部';
        let currentRegion = '全部';
        let years = [];
        let regions = [];

        async function loadExams(year = null, region = null) {
            const container = document.getElementById('examContainer');
            try {
                let url = `${API_BASE}/exams/list`;
                const params = [];
                if (year && year !== '全部') params.push(`year=${year}`);
                if (region && region !== '全部') params.push(`region=${encodeURIComponent(region)}`);
                if (params.length > 0) url += '?' + params.join('&');

                const response = await fetch(url);
                const result = await response.json();

                if (!result.success) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">暂无试卷</div>
                            <div class="empty-desc">${result.msg || '试卷目录为空'}</div>
                        </div>
                    `;
                    return;
                }

                const exams = result.data;
                stats = { total_exams: exams.length };
                years = [...new Set(exams.map(e => {
                    const yearMatch = e.name.match(/(20\d{2})/);
                    return yearMatch ? yearMatch[1] : '';
                }).filter(Boolean))];
                regions = ['全国'];

                if (exams.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">暂无试卷</div>
                            <div class="empty-desc">请点击上方"上传试卷"或"从D盘导入"添加试卷</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = exams.map((exam, index) => `
                    <div class="exam-card">
                        <div class="exam-card-header">
                            <div class="exam-icon">📝</div>
                            <div class="exam-title">
                                <div class="exam-name">${exam.name}</div>
                            </div>
                        </div>
                        <div class="exam-meta">
                            <div class="meta-item">
                                <span class="meta-icon">📄</span>
                                <span class="meta-value">${exam.question_count || 0}道题</span>
                            </div>
                        </div>
                        <div class="exam-tags">
                            ${index < 3 ? '<span class="exam-tag tag-new">新增</span>' : ''}
                        </div>
                        <div class="exam-footer">
                            <div class="star-rating">
                                <span class="star">★</span>
                                <span class="star">★</span>
                                <span class="star">★</span>
                                <span class="star">★</span>
                                <span class="star">☆</span>
                            </div>
                            <button class="btn-start" onclick="startExam('${exam.name}')">开始答题</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <div class="empty-title">加载失败</div>
                        <div class="empty-desc">请确保后端服务已启动</div>
                    </div>
                `;
                console.error('加载试卷失败:', error);
            }
        }

        function updateStats(stats) {
            document.getElementById('statTotalExams').textContent = stats.total_exams || 0;
            document.getElementById('statTotalRegions').textContent = stats.total_regions || 0;
            document.getElementById('statYearRange').textContent = stats.year_range || '--';
            document.getElementById('statTotalQuestions').textContent = stats.total_questions > 0 ? stats.total_questions + '+' : '3200+';
        }

        function updateYearSelect(yearList) {
            const select = document.getElementById('yearSelect');
            const currentValue = select.value;
            select.innerHTML = '<option value="全部">全部年份</option>';
            yearList.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + '年';
                select.appendChild(option);
            });
            select.value = currentYear;
        }

        function updateRegionTags(regionList) {
            const container = document.getElementById('regionTags');
            container.innerHTML = '';

            const allTag = document.createElement('span');
            allTag.className = `region-tag ${currentRegion === '全部' ? 'active' : ''}`;
            allTag.textContent = '全国';
            allTag.onclick = () => selectRegion('全部');
            container.appendChild(allTag);

            regionList.forEach(region => {
                const tag = document.createElement('span');
                tag.className = `region-tag ${currentRegion === region ? 'active' : ''}`;
                tag.textContent = region;
                tag.onclick = () => selectRegion(region);
                container.appendChild(tag);
            });
        }

        function selectRegion(region) {
            currentRegion = region;
            loadExams(currentYear === '全部' ? null : currentYear, currentRegion === '全部' ? null : currentRegion);
        }

        function handleFilterChange() {
            currentYear = document.getElementById('yearSelect').value;
            loadExams(currentYear === '全部' ? null : currentYear, currentRegion === '全部' ? null : currentRegion);
        }

        function downloadFiles(encodedFiles) {
            const files = JSON.parse(decodeURIComponent(encodedFiles));
            if (files.length === 1) {
                window.open(`${API_BASE}/exams/download?file_path=${encodeURIComponent(files[0].path)}`, '_blank');
            } else {
                files.forEach(file => {
                    setTimeout(() => {
                        window.open(`${API_BASE}/exams/download?file_path=${encodeURIComponent(file.path)}`, '_blank');
                    }, 300);
                });
            }
        }

        async function startExam(examName) {
            try {
                window.location.href = `quiz.html?exam_name=${encodeURIComponent(examName)}`;
            } catch (error) {
                showToast('error', '获取试卷信息失败');
                console.error('获取试卷信息失败:', error);
            }
        }

        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('show');
            document.getElementById('categoryInput').value = '';
            clearFile();
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('show');
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('selectedFile').style.display = 'block';
            }
        }

        function handleDrop(event) {
            const file = event.dataTransfer.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('selectedFile').style.display = 'block';
            }
        }

        function clearFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('selectedFile').style.display = 'none';
        }

        async function importFromD() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/exams/import`, {
                    method: 'POST',
                    headers: { 'token': token }
                });
                const result = await response.json();

                if (result.success) {
                    showToast('success', result.msg);
                    loadExams();
                } else {
                    showToast('error', result.msg);
                }
            } catch (error) {
                showToast('error', '导入失败，请确保后端服务已启动');
                console.error('导入失败:', error);
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const category = document.getElementById('categoryInput').value.trim();
            if (!category) {
                showToast('error', '请输入试卷分类');
                return;
            }

            if (!selectedFile) {
                showToast('error', '请选择要上传的文件');
                return;
            }

            const formData = new FormData();
            formData.append('category', category);
            formData.append('file', selectedFile);

            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '上传中...';
            submitBtn.disabled = true;

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/exams/upload`, {
                    method: 'POST',
                    headers: { 'token': token },
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    const questionCount = result.data?.question_count || 0;
                    if (questionCount > 0) {
                        showToast('success', `上传成功！解析出 ${questionCount} 道题`);
                    } else {
                        showToast('success', '上传成功');
                    }
                    closeUploadModal();
                    loadExams();
                } else {
                    showToast('error', result.msg || '上传失败');
                }
            } catch (error) {
                showToast('error', '上传失败，请确保后端服务已启动');
                console.error('上传失败:', error);
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        function showToast(type, message) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        document.querySelector('.search-form').addEventListener('submit', function (e) {
            e.preventDefault();
        });

        document.getElementById('uploadModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeUploadModal();
            }
        });

        loadExams();
    </script>
</body>

</html>
