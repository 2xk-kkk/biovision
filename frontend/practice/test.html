<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
</head>
<body>
    <div id="test"></div>
    <script>
        // Simple test
        const test = document.getElementById('test');
        test.innerHTML = '<h1>测试成功</h1>';
        console.log('Test page loaded successfully');
        
        // Test template literals
        const name = '测试';
        test.innerHTML += `<p>Hello ${name}</p>`;
        console.log('Template literals work');
        
        // Test arrow functions
        const arr = [1, 2, 3];
        const doubled = arr.map(x => x * 2);
        console.log('Arrow functions work:', doubled);
        
        // Test nested template literals
        const items = ['a', 'b', 'c'];
        test.innerHTML += `<ul>${items.map(i => '<li>' + i + '</li>').join('')}</ul>`;
        console.log('Nested template literals work');
    </script>
</body>
</html>
