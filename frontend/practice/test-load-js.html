<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Load External JS Test</title>
</head>
<body>
    <h1>Loading external JS...</h1>
    <div id="output">Testing...</div>
    <script>
    var output = document.getElementById('output');
    try {
        // Dynamically load and evaluate the JS file
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'exam-practice.js', false);
        xhr.send();
        if (xhr.status === 200) {
            // Evaluate the JS code
            eval(xhr.responseText);
            output.innerHTML = 'SUCCESS';
        } else {
            output.innerHTML = 'Failed to load JS file: ' + xhr.status;
        }
    } catch(e) {
        output.innerHTML = 'ERROR: ' + e.message;
    }
    </script>
</body>
</html>
