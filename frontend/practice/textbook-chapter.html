                        id: 'c2',
                        title: '第2章 细胞工程',
                        icon: '🧫',
                        sections: [
                            { id: 's2-1', title: '第1节 植物细胞工程', questions: 28 },
                            { id: 's2-2', title: '第2节 动物细胞工程', questions: 30 }
                        ]
                    },
                    {
                        id: 'c3',
                        title: '第3章 基因工程',
                        icon: '🔬',
                        sections: [
                            { id: 's3-1', title: '第1节 重组DNA技术的基本工具', questions: 25 },
                            { id: 's3-2', title: '第2节 基因工程的基本操作程序', questions: 30 },
                            { id: 's3-3', title: '第3节 基因工程的应用', questions: 22 }
                        ]
                    },
                    {
                        id: 'c4',
                        title: '第4章 生物技术的安全性与伦理问题',
                        icon: '⚖️',
                        sections: [
                            { id: 's4-1', title: '第1节 转基因产品的安全性', questions: 20 },
                            { id: 's4-2', title: '第2节 关注生殖性克隆人', questions: 18 },
                            { id: 's4-3', title: '第3节 禁止生物武器', questions: 15 }
                        ]
                    }
                ]
            }
        };

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function renderChapters() {
            const textbookId = getUrlParam('textbook') || '必修一：分子与细胞';
            const textbook = textbooks[textbookId];
            
            if (!textbook) {
                document.getElementById('chapterList').innerHTML = '<div style="padding: 40px; text-align: center; color: #999;">未找到该教材</div>';
                return;
            }

            document.getElementById('textbookName').textContent = textbookId;
            
            const chapterList = document.getElementById('chapterList');
            chapterList.innerHTML = '';

            textbook.chapters.forEach((chapter, chapterIndex) => {
                const chapterItem = document.createElement('div');
                chapterItem.className = 'chapter-item';
                
                const totalQuestions = chapter.sections.reduce((sum, s) => sum + s.questions, 0);
                
                chapterItem.innerHTML = `
                    <div class="chapter-header" onclick="toggleChapter('${chapter.id}')">
                        <div class="chapter-info">
                            <div class="chapter-icon chapter">${chapter.icon}</div>
                            <div>
                                <div class="chapter-title">${chapter.title}</div>
                                <div class="chapter-desc">共 ${chapter.sections.length} 节 · ${totalQuestions} 题</div>
                            </div>
                        </div>
                        <div class="chapter-progress">
                            <span class="progress-text">0%</span>
                            <span class="chapter-arrow">›</span>
                        </div>
                    </div>
                    <div class="section-list" id="${chapter.id}-sections">
                        ${chapter.sections.map(section => `
                            <div class="section-item">
                                <div class="section-info">
                                    <div class="section-title">${section.title}</div>
                                </div>
                                <div class="section-action">
                                    <span class="question-count">${section.questions}题</span>
                                    <a href="quiz.html?textbook=${encodeURIComponent(textbookId)}&chapter=${encodeURIComponent(chapter.title)}&section=${encodeURIComponent(section.title)}" class="btn-practice">开始练习</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                chapterList.appendChild(chapterItem);
            });

            if (textbook.chapters.length > 0) {
                toggleChapter(textbook.chapters[0].id);
            }
        }

        function toggleChapter(chapterId) {
            const sectionList = document.getElementById(`${chapterId}-sections`);
            const headers = document.querySelectorAll('.chapter-header');
            
            headers.forEach(header => {
                header.classList.remove('active');
                const arrow = header.querySelector('.chapter-arrow');
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            });
            
            const activeHeader = document.querySelector(`[onclick="toggleChapter('${chapterId}')"]`);
            if (activeHeader) {
                activeHeader.classList.add('active');
            }
            
            document.querySelectorAll('.section-list').forEach(list => {
                list.classList.remove('show');
            });
            
            if (sectionList) {
                sectionList.classList.add('show');
            }
        }

        renderChapters();

        document.querySelectorAll('.dropdown-toggle').forEach(toggle => {
            toggle.addEventListener('click', (e) => {
                e.preventDefault();
                const dropdown = toggle.parentElement;
                dropdown.classList.toggle('show');
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown').forEach(dropdown => {
                    dropdown.classList.remove('show');
                });
            }
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.classList.contains('dropdown-toggle')) return;
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
