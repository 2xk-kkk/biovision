            const files = JSON.parse(decodeURIComponent(encodedFiles));
            if (files.length === 1) {
                window.open(`http://localhost:8000/api/exams/download?file_path=${encodeURIComponent(files[0].path)}`, '_blank');
            } else {
                files.forEach(file => {
                    setTimeout(() => {
                        window.open(`http://localhost:8000/api/exams/download?file_path=${encodeURIComponent(file.path)}`, '_blank');

                });

        }
