<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>在线答题 - 生物视界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SimSun', 'Songti SC', serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .quiz-header {
            background: linear-gradient(135deg, #0066cc 0%, #0099ff 100%);
            color: white;
            padding: 24px 32px;
            text-align: center;
        }

        .quiz-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .quiz-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .quiz-info-bar {
            background: #f8f9fa;
            padding: 12px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            color: #666;
        }

        .quiz-paper {
            padding: 32px;
        }

        .paper-header {
            text-align: center;
            padding-bottom: 24px;
            border-bottom: 2px solid #0066cc;
            margin-bottom: 32px;
        }

        .paper-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .paper-info {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #0099ff;
        }

        .question-item {
            margin-bottom: 24px;
            page-break-inside: avoid;
        }

        .question-header {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .question-number {
            font-weight: bold;
            color: #0066cc;
            min-width: 30px;
        }

        .question-score {
            color: #999;
            font-size: 14px;
        }

        .question-stem {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 16px;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 12px 0;
            display: block;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-left: 40px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-item:hover {
            background: #e8f4ff;
            border-color: #b3d9ff;
        }

        .option-item.selected {
            background: #e8f4ff;
            border-color: #0066cc;
        }

        .option-item.correct {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        .option-item.wrong {
            background: #ffebee;
            border-color: #f44336;
        }

        .option-letter {
            font-weight: bold;
            color: #666;
            min-width: 24px;
            text-align: center;
        }

        .option-item.selected .option-letter {
            color: #0066cc;
        }

        .option-item.correct .option-letter {
            color: #4caf50;
        }

        .option-item.wrong .option-letter {
            color: #f44336;
        }

        .option-content {
            font-size: 15px;
            line-height: 1.6;
            color: #444;
        }

        .fill-blank-area {
            padding-left: 40px;
        }

        .fill-blank-item {
            margin-bottom: 20px;
        }

        .fill-blank-text {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 8px;
        }

        .fill-blank-input {
            display: inline-block;
            width: 120px;
            padding: 0 0 4px 0;
            border: none;
            border-bottom: 2px solid #333;
            border-radius: 0;
            font-size: 16px;
            text-align: center;
            background: transparent;
            transition: all 0.2s ease;
            margin: 0 4px;
        }

        .fill-blank-input:focus {
            outline: none;
            border-bottom-color: #0066cc;
        }

        .fill-blank-input.correct {
            border-bottom-color: #4caf50;
            background: transparent;
            color: #4caf50;
        }

        .fill-blank-input.wrong {
            border-bottom-color: #f44336;
            background: transparent;
            color: #f44336;
        }

        .fill-blank-input.blank {
            border-bottom-color: #9e9e9e;
            background: transparent;
        }

        .answer-reveal {
            margin-top: 12px;
            padding: 12px 16px;
            background: #fff3e0;
            border-radius: 6px;
            font-size: 14px;
            color: #e65100;
            display: none;
        }

        .answer-reveal.show {
            display: block;
        }

        .quiz-footer {
            background: #f8f9fa;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e0e0e0;
        }

        .btn {
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0066cc, #0099ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            border-color: #0066cc;
            color: #0066cc;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .submit-warning {
            font-size: 14px;
            color: #ff9800;
        }

        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result-icon {
            font-size: 72px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .result-desc {
            font-size: 15px;
            color: #666;
            margin-bottom: 28px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #0066cc;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-large {
            padding: 14px 36px;
            font-size: 16px;
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
        }

        .question-nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .nav-dot {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #e0e0e0;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-dot:hover {
            background: #0066cc;
            color: white;
        }

        .nav-dot.current {
            background: #0066cc;
            color: white;
        }

        .nav-dot.answered {
            background: #4caf50;
            color: white;
        }

        .nav-dot.correct {
            background: #4caf50;
            color: white;
        }

        .nav-dot.wrong {
            background: #f44336;
            color: white;
        }

        @media (max-width: 768px) {
            .options-grid {
                grid-template-columns: 1fr;
            }

            .quiz-paper {
                padding: 16px;
            }

            .question-stem {
                font-size: 15px;
            }

            .fill-blank-input {
                width: 100%;
                margin: 4px 0;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <div class="quiz-title">在线答题</div>
            <div class="quiz-subtitle" id="examTitle">试卷练习</div>
        </div>

        <div class="quiz-info-bar">
            <div>⏱️ 用时: <span id="timeElapsed">0</span> 秒</div>
            <div>📝 已答: <span id="answeredCount">0</span> / <span id="totalQuestions">0</span></div>
            <div>✅ 正确: <span id="correctCount">0</span></div>
        </div>

        <div class="quiz-paper" id="quizPaper">
            <div style="text-align: center; padding: 60px;">
                <div style="font-size: 48px; margin-bottom: 16px;">📝</div>
                <div style="font-size: 20px; color: #666;">加载中...</div>
            </div>
        </div>

        <div class="quiz-footer">
            <div class="submit-warning" id="submitWarning" style="display: none;">⚠️ 还有题目未作答</div>
            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="window.location.href='exams.html'">返回列表</button>
                <button class="btn btn-primary" onclick="submitExam()">提交试卷</button>
            </div>
        </div>
    </div>

    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-title" id="resultTitle">练习完成！</div>
            <div class="result-desc" id="resultDesc">恭喜你完成了本次练习</div>
            <div class="result-stats">
                <div class="stat-item">
                    <div class="stat-value" id="resultTotal">0</div>
                    <div class="stat-label">总题数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="resultCorrect">0</div>
                    <div class="stat-label">正确数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="resultRate">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
            </div>
            <div class="result-actions">
                <button class="btn btn-secondary btn-large" onclick="closeResult()">返回试卷列表</button>
                <button class="btn btn-primary btn-large" onclick="viewAnswers()">查看答案</button>
                <button class="btn btn-success btn-large" onclick="restartQuiz()">再做一次</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        
        let examId = null;
        let questions = [];
        let answers = {};
        let results = {};
        let correctCount = 0;
        let startTime = null;
        let timer = null;
        let isSubmitted = false;

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function loadExam() {
            examId = getQueryParam('exam_id');
            
            if (!examId) {
                document.getElementById('quizPaper').innerHTML = `
                    <div style="text-align: center; padding: 60px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
                        <div style="font-size: 20px; color: #666;">未选择试卷，请返回选择试卷</div>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/exams/${examId}/questions`);
                const result = await response.json();

                if (result.success && result.data) {
                    let qs = [];
                    let examName = '试卷练习';
                    
                    if (result.data.questions && result.data.questions.length > 0) {
                        qs = result.data.questions;
                        examName = result.data.exam_name || '试卷练习';
                    } else if (Array.isArray(result.data) && result.data.length > 0) {
                        qs = result.data;
                    }

                    if (qs.length === 0) {
                        document.getElementById('quizPaper').innerHTML = `
                            <div style="text-align: center; padding: 60px;">
                                <div style="font-size: 48px; margin-bottom: 16px;">📝</div>
                                <div style="font-size: 20px; color: #666;">该试卷暂无题目</div>
                            </div>
                        `;
                        return;
                    }

                    questions = qs;
                    document.getElementById('examTitle').textContent = examName;
                    document.getElementById('totalQuestions').textContent = questions.length;
                    
                    startTime = Date.now();
                    startTimer();
                    renderPaper();
                } else {
                    document.getElementById('quizPaper').innerHTML = `
                        <div style="text-align: center; padding: 60px;">
                            <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
                            <div style="font-size: 20px; color: #666;">${result.msg || '加载失败'}</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('quizPaper').innerHTML = `
                    <div style="text-align: center; padding: 60px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">🔌</div>
                        <div style="font-size: 20px; color: #666;">网络错误，请检查后端服务是否启动</div>
                    </div>
                `;
            }
        }

        function startTimer() {
            timer = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timeElapsed').textContent = elapsed;
            }, 1000);
        }

        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        function getQuestionType(question) {
            const hasOptions = question.options && Object.keys(question.options).some(k => question.options[k]);
            const hasAnswer = question.answer && question.answer.trim() !== '';
            
            if (hasOptions) {
                return 'choice';
            }
            return 'fill';
        }

        function renderPaper() {
            const choiceQuestions = questions.filter(q => getQuestionType(q) === 'choice');
            const fillQuestions = questions.filter(q => getQuestionType(q) === 'fill');

            let html = `
                <div class="paper-header">
                    <div class="paper-title">${document.getElementById('examTitle').textContent}</div>
                    <div class="paper-info">
                        选择题：共 ${choiceQuestions.length} 题，每题 6 分，共 ${choiceQuestions.length * 6} 分<br>
                        非选择题：共 ${fillQuestions.length} 题，共 ${fillQuestions.length * 8} 分<br>
                        考试时间：45分钟
                    </div>
                </div>
            `;

            if (choiceQuestions.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-title">一、选择题（本题共${choiceQuestions.length}小题，每题6分，共${choiceQuestions.length * 6}分）</div>
                `;

                choiceQuestions.forEach((question, index) => {
                    html += renderChoiceQuestion(question, index + 1);
                });

                html += '</div>';
            }

            if (fillQuestions.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-title">二、非选择题（本题共${fillQuestions.length}小题，共${fillQuestions.length * 8}分）</div>
                `;

                fillQuestions.forEach((question, index) => {
                    html += renderFillQuestion(question, choiceQuestions.length + index + 1);
                });

                html += '</div>';
            }

            document.getElementById('quizPaper').innerHTML = html;
            updateAnsweredCount();
        }

        function renderChoiceQuestion(question, displayNumber) {
            const isAnswered = answers[question.id] !== undefined;
            const isCorrect = results[question.id];
            const selectedAnswer = answers[question.id];
            const correctAnswer = question.answer || '';

            let optionsHtml = '';
            const optionKeys = ['A', 'B', 'C', 'D'];
            
            optionKeys.forEach(key => {
                const optionValue = question.options ? question.options[key] : '';
                if (!optionValue) return;

                let optionClass = 'option-item';
                if (isSubmitted) {
                    if (key === selectedAnswer) {
                        optionClass += isCorrect ? ' correct' : ' wrong';
                    } else if (key === correctAnswer) {
                        optionClass += ' correct';
                    }
                } else if (key === selectedAnswer) {
                    optionClass += ' selected';
                }

                const onclick = isSubmitted ? '' : `onclick="selectChoice('${key}', ${question.id})"`;
                
                optionsHtml += `
                    <div class="${optionClass}" ${onclick}>
                        <div class="option-letter">${key}.</div>
                        <div class="option-content">${optionValue}</div>
                    </div>
                `;
            });

            let imageHtml = '';
            if (question.images) {
                const imagePaths = question.images.split(',');
                imagePaths.forEach(imgPath => {
                    imgPath = imgPath.trim();
                    if (imgPath) {
                        const imgUrl = `http://localhost:8000${imgPath}`;
                        imageHtml += `<img src="${encodeURI(imgUrl)}" class="question-image" alt="题目图片">`;
                    }
                });
            }

            let feedbackHtml = '';
            if (isSubmitted) {
                const feedbackType = isCorrect ? 'correct' : 'wrong';
                const feedbackText = isCorrect ? '✓ 回答正确' : `✗ 回答错误，正确答案：${correctAnswer}`;
                
                feedbackHtml = `
                    <div class="answer-reveal ${feedbackType === 'correct' ? 'correct' : 'wrong'} show">
                        ${feedbackText}
                    </div>
                `;
            }

            return `
                <div class="question-item" id="question-${question.id}">
                    <div class="question-header">
                        <span class="question-number">${displayNumber}.</span>
                        <span class="question-score">（6分）</span>
                    </div>
                    <div class="question-stem">${question.stem}</div>
                    ${imageHtml}
                    <div class="options-grid">${optionsHtml}</div>
                    ${feedbackHtml}
                </div>
            `;
        }

        function renderFillQuestion(question, displayNumber) {
            const isAnswered = answers[question.id] !== undefined && answers[question.id] !== '';
            const isCorrect = results[question.id];
            const userAnswer = answers[question.id] || '';
            const correctAnswer = question.answer || '';

            let stemHtml = question.stem;
            const blankCount = (stemHtml.match(/____/g) || []).length;
            
            if (blankCount > 0) {
                for (let i = 0; i < blankCount; i++) {
                    const inputId = `fill-input-${question.id}-${i}`;
                    const inputValue = userAnswer ? userAnswer.split(';')[i] || '' : '';
                    
                    let inputClass = 'fill-blank-input';
                    if (isSubmitted) {
                        const correctPart = correctAnswer.split(';')[i] || '';
                        const isPartCorrect = inputValue.trim() === correctPart.trim();
                        
                        if (inputValue.trim() === '') {
                            inputClass += ' blank';
                        } else if (isPartCorrect) {
                            inputClass += ' correct';
                        } else {
                            inputClass += ' wrong';
                        }
                    }

                    const onChange = isSubmitted ? '' : `oninput="updateFillAnswer(${question.id}, ${blankCount})"`;
                    
                    stemHtml = stemHtml.replace('____', `<input type="text" class="${inputClass}" id="${inputId}" value="${inputValue}" ${onChange}>`);
                }
            }

            let imageHtml = '';
            if (question.images) {
                const imagePaths = question.images.split(',');
                imagePaths.forEach(imgPath => {
                    imgPath = imgPath.trim();
                    if (imgPath) {
                        const imgUrl = `http://localhost:8000${imgPath}`;
                        imageHtml += `<img src="${encodeURI(imgUrl)}" class="question-image" alt="题目图片">`;
                    }
                });
            }

            let feedbackHtml = '';
            if (isSubmitted) {
                feedbackHtml = `
                    <div class="answer-reveal show">
                        <strong>参考答案：</strong>${correctAnswer.replace(';', '；')}
                    </div>
                `;
            }

            return `
                <div class="question-item" id="question-${question.id}">
                    <div class="question-header">
                        <span class="question-number">${displayNumber}.</span>
                        <span class="question-score">（8分）</span>
                    </div>
                    <div class="fill-blank-area">
                        <div class="fill-blank-text">${stemHtml}</div>
                        ${imageHtml}
                        ${feedbackHtml}
                    </div>
                </div>
            `;
        }

        function selectChoice(key, questionId) {
            if (isSubmitted) return;

            answers[questionId] = key;
            updateAnsweredCount();
            renderPaper();
        }

        function updateFillAnswer(questionId, blankCount) {
            if (isSubmitted) return;

            let answerParts = [];
            for (let i = 0; i < blankCount; i++) {
                const input = document.getElementById(`fill-input-${questionId}-${i}`);
                answerParts.push(input ? input.value : '');
            }
            
            answers[questionId] = answerParts.join(';');
            updateAnsweredCount();
        }

        function updateAnsweredCount() {
            const answered = Object.keys(answers).filter(key => {
                const val = answers[key];
                return val !== undefined && val !== '';
            }).length;
            document.getElementById('answeredCount').textContent = answered;
        }

        function submitExam() {
            const answeredQuestions = questions.filter(q => {
                const ans = answers[q.id];
                return ans !== undefined && ans !== '';
            });

            if (answeredQuestions.length === 0) {
                document.getElementById('submitWarning').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('submitWarning').style.display = 'none';
                }, 3000);
                return;
            }

            isSubmitted = true;
            correctCount = 0;

            questions.forEach(question => {
                const userAnswer = answers[question.id];
                const correctAnswer = question.answer || '';
                
                let isCorrect = false;
                
                if (userAnswer !== undefined && userAnswer !== '') {
                    if (getQuestionType(question) === 'choice') {
                        isCorrect = userAnswer === correctAnswer;
                    } else {
                        const userParts = userAnswer.split(';');
                        const correctParts = correctAnswer.split(';');
                        let correctCountParts = 0;
                        
                        userParts.forEach((part, index) => {
                            const correctPart = correctParts[index] || '';
                            if (part.trim() === correctPart.trim()) {
                                correctCountParts++;
                            }
                        });
                        
                        isCorrect = correctCountParts === correctParts.length && userParts.length === correctParts.length;
                    }
                }

                results[question.id] = isCorrect;
                if (isCorrect) {
                    correctCount++;
                }
            });

            document.getElementById('correctCount').textContent = correctCount;
            stopTimer();
            renderPaper();
            showResult();
        }

        function showResult() {
            const total = questions.length;
            const correct = correctCount;
            const rate = Math.round((correct / total) * 100);

            document.getElementById('resultTotal').textContent = total;
            document.getElementById('resultCorrect').textContent = correct;
            document.getElementById('resultRate').textContent = `${rate}%`;

            let icon = '🎉';
            let title = '练习完成！';
            let desc = '恭喜你完成了本次练习';
            
            if (rate >= 90) {
                icon = '🏆';
                title = '太棒了！';
                desc = '你的表现非常出色！';
            } else if (rate >= 70) {
                icon = '👍';
                title = '做得不错！';
                desc = '继续加油，你可以做得更好！';
            } else if (rate >= 60) {
                icon = '💪';
                title = '及格了！';
                desc = '还需要多加练习哦！';
            } else {
                icon = '📚';
                title = '需要努力！';
                desc = '多多练习，相信你会进步的！';
            }

            document.getElementById('resultIcon').textContent = icon;
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultDesc').textContent = desc;

            document.getElementById('resultModal').classList.add('show');
        }

        function closeResult() {
            window.location.href = 'exams.html';
        }

        function viewAnswers() {
            document.getElementById('resultModal').classList.remove('show');
        }

        function restartQuiz() {
            document.getElementById('resultModal').classList.remove('show');
            answers = {};
            results = {};
            correctCount = 0;
            isSubmitted = false;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('answeredCount').textContent = '0';
            
            startTime = Date.now();
            startTimer();
            renderPaper();
        }

        window.addEventListener('load', loadExam);
    </script>
</body>
</html>
