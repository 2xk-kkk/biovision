<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线答题 - 生物视界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .quiz-header {
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quiz-title {
            font-size: 24px;
            font-weight: 600;
        }

        .quiz-info {
            display: flex;
            gap: 24px;
            font-size: 14px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .quiz-progress {
            background: #f0f0f0;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00b4db, #0083b0);
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 500;
            color: #666;
        }

        .quiz-content {
            padding: 32px;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .question-number {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
        }

        .question-type {
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .question-stem {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 20px;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 16px 0;
            display: block;
        }

        .options-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .option-item:hover {
            border-color: #00b4db;
            background: #f0f9ff;
        }

        .option-item.selected {
            border-color: #00b4db;
            background: #e3f2fd;
        }

        .option-item.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .option-item.wrong {
            border-color: #f44336;
            background: #ffebee;
        }

        .option-letter {
            background: #e0e0e0;
            color: #666;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .option-item.selected .option-letter {
            background: #00b4db;
            color: white;
        }

        .option-item.correct .option-letter {
            background: #4caf50;
            color: white;
        }

        .option-item.wrong .option-letter {
            background: #f44336;
            color: white;
        }

        .option-content {
            font-size: 16px;
            line-height: 1.6;
            color: #444;
        }

        .answer-feedback {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            display: none;
        }

        .answer-feedback.show {
            display: block;
        }

        .answer-feedback.correct {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
        }

        .answer-feedback.wrong {
            background: #ffebee;
            border: 1px solid #ffcdd2;
        }

        .feedback-icon {
            font-size: 24px;
            margin-right: 12px;
        }

        .feedback-text {
            font-size: 16px;
        }

        .feedback-correct-answer {
            margin-top: 8px;
            font-weight: 600;
            color: #4caf50;
        }

        .quiz-footer {
            background: #f8f9fa;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e0e0e0;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 131, 176, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            border-color: #00b4db;
            color: #00b4db;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .question-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 600px;
        }

        .nav-dot {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #e0e0e0;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-dot:hover {
            background: #00b4db;
            color: white;
        }

        .nav-dot.current {
            background: #00b4db;
            color: white;
            box-shadow: 0 2px 8px rgba(0, 180, 219, 0.4);
        }

        .nav-dot.answered {
            background: #4caf50;
            color: white;
        }

        .nav-dot.correct {
            background: #4caf50;
            color: white;
        }

        .nav-dot.wrong {
            background: #f44336;
            color: white;
        }

        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: white;
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .result-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .result-desc {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #00b4db;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .result-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn-large {
            padding: 16px 40px;
            font-size: 18px;
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
        }

        @media (max-width: 768px) {
            .options-list {
                grid-template-columns: 1fr;
            }

            .quiz-info {
                flex-direction: column;
                gap: 8px;
            }

            .question-nav {
                display: none;
            }

            .quiz-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <div class="quiz-title" id="examTitle">试卷练习</div>
            <div class="quiz-info">
                <div class="info-item">📝 题目: <span id="totalQuestions">0</span> 道</div>
                <div class="info-item">✅ 正确: <span id="correctCount">0</span> 道</div>
                <div class="info-item">⏱️ 用时: <span id="timeElapsed">0</span> 秒</div>
            </div>
        </div>

        <div class="quiz-progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">1 / 1</div>
        </div>

        <div class="quiz-content" id="quizContent">
            <div style="text-align: center; padding: 60px;">
                <div style="font-size: 48px; margin-bottom: 16px;">📝</div>
                <div style="font-size: 20px; color: #666;">加载中...</div>
            </div>
        </div>

        <div class="quiz-footer">
            <div class="question-nav" id="questionNav">
            </div>
            <div class="nav-buttons">
                <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()" disabled>上一题</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">下一题</button>
            </div>
        </div>
    </div>

    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-title" id="resultTitle">练习完成！</div>
            <div class="result-desc" id="resultDesc">恭喜你完成了本次练习</div>
            <div class="result-stats">
                <div class="stat-item">
                    <div class="stat-value" id="resultTotal">0</div>
                    <div class="stat-label">总题数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="resultCorrect">0</div>
                    <div class="stat-label">正确数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="resultRate">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
            </div>
            <div class="result-actions">
                <button class="btn btn-secondary btn-large" onclick="closeResult()">返回试卷列表</button>
                <button class="btn btn-success btn-large" onclick="restartQuiz()">再做一次</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        
        let examId = null;
        let questions = [];
        let currentIndex = 0;
        let answers = {};
        let results = {};
        let correctCount = 0;
        let startTime = null;
        let timer = null;

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function loadExam() {
            examId = getQueryParam('exam_id');
            
            if (!examId) {
                document.getElementById('quizContent').innerHTML = `
                    <div style="text-align: center; padding: 60px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
                        <div style="font-size: 20px; color: #666;">未选择试卷，请返回选择试卷</div>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/exams/${examId}/questions`);
                const result = await response.json();

                if (result.code === 200 && result.data) {
                    if (result.data.questions && result.data.questions.length > 0) {
                        questions = result.data.questions;
                        document.getElementById('examTitle').textContent = result.data.exam_name || '试卷练习';
                        document.getElementById('totalQuestions').textContent = questions.length;
                        
                        startTime = Date.now();
                        startTimer();
                        renderQuestion();
                        renderNav();
                    } else if (Array.isArray(result.data) && result.data.length > 0) {
                        questions = result.data;
                        document.getElementById('examTitle').textContent = '试卷练习';
                        document.getElementById('totalQuestions').textContent = questions.length;
                        
                        startTime = Date.now();
                        startTimer();
                        renderQuestion();
                        renderNav();
                    } else {
                        document.getElementById('quizContent').innerHTML = `
                            <div style="text-align: center; padding: 60px;">
                                <div style="font-size: 48px; margin-bottom: 16px;">📝</div>
                                <div style="font-size: 20px; color: #666;">该试卷暂无题目</div>
                            </div>
                        `;
                    }
                } else {
                    document.getElementById('quizContent').innerHTML = `
                        <div style="text-align: center; padding: 60px;">
                            <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
                            <div style="font-size: 20px; color: #666;">${result.msg || '加载失败'}</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('quizContent').innerHTML = `
                    <div style="text-align: center; padding: 60px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">🔌</div>
                        <div style="font-size: 20px; color: #666;">网络错误，请检查后端服务是否启动</div>
                    </div>
                `;
            }
        }

        function startTimer() {
            timer = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timeElapsed').textContent = elapsed;
            }, 1000);
        }

        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        function renderQuestion() {
            const question = questions[currentIndex];
            if (!question) return;

            const isAnswered = answers[question.id] !== undefined;
            const isCorrect = results[question.id];
            const selectedAnswer = answers[question.id];
            const correctAnswer = question.answer || '';

            let optionsHtml = '';
            const optionKeys = ['A', 'B', 'C', 'D'];
            
            optionKeys.forEach(key => {
                const optionValue = question.options ? question.options[key] : '';
                if (!optionValue) return;

                let optionClass = 'option-item';
                if (isAnswered) {
                    if (key === selectedAnswer) {
                        optionClass += isCorrect ? ' correct' : ' wrong';
                    } else if (key === correctAnswer) {
                        optionClass += ' correct';
                    } else {
                        optionClass += ' selected';
                    }
                }

                optionsHtml += `
                    <div class="${optionClass}" onclick="${isAnswered ? '' : `selectOption('${key}', ${question.id})`}">
                        <div class="option-letter">${key}</div>
                        <div class="option-content">${optionValue}</div>
                    </div>
                `;
            });

            let imageHtml = '';
            if (question.images) {
                const imagePaths = question.images.split(',');
                imagePaths.forEach(imgPath => {
                    imgPath = imgPath.trim();
                    if (imgPath) {
                        const imgUrl = `http://localhost:8000/api${imgPath.replace('backend', '')}`;
                        imageHtml += `<img src="${imgUrl}" class="question-image" alt="题目图片">`;
                    }
                });
            }

            let feedbackHtml = '';
            if (isAnswered) {
                const feedbackType = isCorrect ? 'correct' : 'wrong';
                const feedbackIcon = isCorrect ? '✅' : '❌';
                const feedbackText = isCorrect ? '回答正确！' : `回答错误，正确答案是 ${correctAnswer}`;
                
                feedbackHtml = `
                    <div class="answer-feedback ${feedbackType} show">
                        <div class="feedback-text"><span class="feedback-icon">${feedbackIcon}</span>${feedbackText}</div>
                    </div>
                `;
            }

            document.getElementById('quizContent').innerHTML = `
                <div class="question-card">
                    <div class="question-header">
                        <div class="question-number">${currentIndex + 1}</div>
                        <div class="question-type">选择题</div>
                    </div>
                    <div class="question-stem">${question.stem}</div>
                    ${imageHtml}
                    <div class="options-list">${optionsHtml}</div>
                    ${feedbackHtml}
                </div>
            `;

            updateProgress();
            updateNav();
            updateButtons();
        }

        function selectOption(key, questionId) {
            if (answers[questionId] !== undefined) return;

            const question = questions.find(q => q.id === questionId);
            if (!question) return;

            answers[questionId] = key;
            const correctAnswer = question.answer || '';
            const isCorrect = key === correctAnswer;
            results[questionId] = isCorrect;

            if (isCorrect) {
                correctCount++;
                document.getElementById('correctCount').textContent = correctCount;
            }

            renderQuestion();
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            renderQuestion();
        }

        function updateProgress() {
            const progress = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${currentIndex + 1} / ${questions.length}`;
        }

        function renderNav() {
            const navContainer = document.getElementById('questionNav');
            navContainer.innerHTML = '';

            questions.forEach((q, index) => {
                let navClass = 'nav-dot';
                if (index === currentIndex) {
                    navClass += ' current';
                }
                if (answers[q.id] !== undefined) {
                    if (results[q.id]) {
                        navClass += ' correct';
                    } else {
                        navClass += ' wrong';
                    }
                }

                navContainer.innerHTML += `
                    <div class="${navClass}" onclick="jumpToQuestion(${index})">${index + 1}</div>
                `;
            });
        }

        function updateNav() {
            const navDots = document.querySelectorAll('.nav-dot');
            navDots.forEach((dot, index) => {
                dot.classList.remove('current');
                if (index === currentIndex) {
                    dot.classList.add('current');
                }
            });
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            
            const nextBtn = document.getElementById('nextBtn');
            if (currentIndex === questions.length - 1) {
                nextBtn.textContent = '提交试卷';
            } else {
                nextBtn.textContent = '下一题';
            }
        }

        function showResult() {
            stopTimer();
            
            const total = questions.length;
            const correct = correctCount;
            const rate = Math.round((correct / total) * 100);

            document.getElementById('resultTotal').textContent = total;
            document.getElementById('resultCorrect').textContent = correct;
            document.getElementById('resultRate').textContent = `${rate}%`;

            let icon = '🎉';
            let title = '练习完成！';
            let desc = '恭喜你完成了本次练习';
            
            if (rate >= 90) {
                icon = '🏆';
                title = '太棒了！';
                desc = '你的表现非常出色！';
            } else if (rate >= 70) {
                icon = '👍';
                title = '做得不错！';
                desc = '继续加油，你可以做得更好！';
            } else if (rate >= 60) {
                icon = '💪';
                title = '及格了！';
                desc = '还需要多加练习哦！';
            } else {
                icon = '📚';
                title = '需要努力！';
                desc = '多多练习，相信你会进步的！';
            }

            document.getElementById('resultIcon').textContent = icon;
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultDesc').textContent = desc;

            document.getElementById('resultModal').classList.add('show');
        }

        function closeResult() {
            window.location.href = 'exams.html';
        }

        function restartQuiz() {
            document.getElementById('resultModal').classList.remove('show');
            currentIndex = 0;
            answers = {};
            results = {};
            correctCount = 0;
            document.getElementById('correctCount').textContent = '0';
            
            startTime = Date.now();
            startTimer();
            renderQuestion();
            renderNav();
        }

        window.addEventListener('load', loadExam);
    </script>
</body>
</html>
