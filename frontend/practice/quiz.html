    <script>
        const API_BASE = 'http://localhost:8000/api';

        // ===== JWT 解析 =====
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
                    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                ).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        // ===== 头像生成 =====
        function getDefaultAvatarSVG(username, size = 40) {
            const avatarChar = (username || '用').trim()[0] || '用';
            const centerX = Math.floor(size / 2);
            const centerY = Math.floor(size / 2);
            const radius = Math.floor(size * 0.45);
            const fontSize = Math.floor(size * 0.45);
            const textY = Math.floor(size * 0.65);
            return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${size} ${size}'%3E%3Ccircle cx='${centerX}' cy='${centerY}' r='${radius}' fill='%23667eea'/%3E%3Ctext x='${centerX}' y='${textY}' text-anchor='middle' font-size='${fontSize}' fill='white'%3E${encodeURIComponent(avatarChar)}%3C/text%3E%3C/svg%3E`;
        }

        function getGuestAvatarSVG(size = 40) {
            const centerX = Math.floor(size / 2);
            const centerY = Math.floor(size / 2);
            const radius = Math.floor(size * 0.45);
            const headRadius = Math.floor(size * 0.12);
            const headY = Math.floor(size * 0.35);
            const bodyStroke = Math.floor(size * 0.1);
            const bodyY1 = Math.floor(size * 0.6);
            const bodyY2 = Math.floor(size * 0.85);
            return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${size} ${size}'%3E%3Ccircle cx='${centerX}' cy='${centerY}' r='${radius}' fill='%23d1d5db'/%3E%3Ccircle cx='${centerX}' cy='${headY}' r='${headRadius}' fill='%239ca3af'/%3E%3Cpath d='M${Math.floor(size * 0.3)} ${bodyY1} Q${centerX} ${bodyY2} ${Math.floor(size * 0.7)} ${bodyY1}' fill='none' stroke='%239ca3af' stroke-width='${bodyStroke}' stroke-linecap='round'/%3E%3C/svg%3E`;
        }

        async function loadUserAvatar() {
            const token = localStorage.getItem('token');
            const avatarImg = document.getElementById('userAvatarImg');
            if (!avatarImg) return;
            const guestAvatar = getGuestAvatarSVG(40);
            if (!token) {
                avatarImg.src = guestAvatar;
                return;
            }
            try {
                const payload = parseJwt(token);
                if (!payload || !payload.user_id) {
                    avatarImg.src = guestAvatar;
                    return;
                }
                const response = await fetch(`${API_BASE}/user/${payload.user_id}/info`, {
                    headers: { 'token': token }
                });
                const result = await response.json();
                if (result.success && result.data) {
                    const username = result.data.username || '用户';
                    const userAvatar = result.data.avatar;
                    if (userAvatar) {
                        avatarImg.src = userAvatar.startsWith('http') ? userAvatar + '?t=' + Date.now() : userAvatar;
                    } else {
                        avatarImg.src = getDefaultAvatarSVG(username, 40);
                    }
                } else {
                    avatarImg.src = getDefaultAvatarSVG('用户', 40);
                }
            } catch (error) {
                console.error('加载用户头像失败:', error);
                avatarImg.src = getDefaultAvatarSVG('用户', 40);
            }
        }

        // ===== 登录检查 =====
        (function initAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('请先登录');
                window.location.href = '../login/login-main.html';
                return;
            }
            loadUserAvatar();

            const userAvatarBtn = document.getElementById('userAvatarBtn');
            const userDropdownMenu = document.getElementById('userDropdownMenu');
            if (userAvatarBtn && userDropdownMenu) {
                userAvatarBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    userDropdownMenu.classList.toggle('show');
                });
                document.addEventListener('click', function (event) {
                    if (!userAvatarBtn.contains(event.target) && !userDropdownMenu.contains(event.target)) {
                        userDropdownMenu.classList.remove('show');
                    }
                });
            }
        })();

        let questions = [];
        let userAnswers = {};
        let showAnswerMode = false;
        let quizMode = '';

        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function loadExamQuestions() {
            const examName = getUrlParam('exam_name');
            if (!examName) {
                showStartScreen();
                return;
            }

            quizMode = 'exam';
            document.getElementById('paperContainer').innerHTML = `
                <div class="loading">⏳ 正在加载试卷...</div>`;
            try {
                const response = await fetch(`${API_BASE}/exams/list`);
                const result = await response.json();

                if (!result.success || !result.data.length) {
                    document.getElementById('paperContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">暂无试卷</div>
                            <div class="empty-desc">请确保后端服务已启动</div>
                        </div>
                    `;
                    return;
                }

                const exam = result.data.find(e => e.name === examName);
                if (!exam) {
                    document.getElementById('paperContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">试卷不存在</div>
                            <div class="empty-desc">请从真题大观选择试卷</div>
                        </div>
                    `;
                    return;
                }

                document.getElementById('examName').textContent = exam.name;
                document.getElementById('selectSection').style.display = 'none';
                document.getElementById('quizSection').style.display = 'block';

                const qResponse = await fetch(`${API_BASE}/exams/${exam.id}/questions`);
                const qResult = await qResponse.json();

                if (!qResult.success) {
                    document.getElementById('paperContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">暂无题目</div>
                            <div class="empty-desc">该试卷没有提取到题目</div>
                        </div>
                    `;
                    return;
                }

                questions = qResult.data.questions;
                document.getElementById('questionCount').textContent = questions.length;
                userAnswers = {};
                showAnswerMode = false;

                renderPaper();
            } catch (error) {
                document.getElementById('paperContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <div class="empty-title">加载失败</div>
                        <div class="empty-desc">请确保后端服务已启动</div>
                    </div>
                `;
                console.error('加载题目失败:', error);
            }
        }

        function parseOptions(optionsData) {
            if (typeof optionsData === 'string') {
                try {
                    return JSON.parse(optionsData);
                } catch (e) {
                    return {};
                }
            }
            return optionsData || {};
        }

        function showStartScreen() {
            document.getElementById('selectSection').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            document.getElementById('examName').textContent = '在线答题';

            document.getElementById('paperContainer').innerHTML = `
                <div class="start-screen">
                    <div class="start-icon">📝</div>
                    <div class="start-title">在线答题</div>
                    <div class="start-desc">从真题大观中随机抽取选择题进行练习</div>
                    <div class="question-count-select">
                        <label>题目数量：</label>
                        <select id="questionCountSelect">
                            <option value="5">5题</option>
                            <option value="10" selected>10题</option>
                            <option value="15">15题</option>
                            <option value="20">20题</option>
                        </select>
                    </div>
                    <button class="btn-start-quiz" onclick="startRandomQuiz()">开始答题</button>
                </div>
            `;
        }

        async function startRandomQuiz() {
            const count = parseInt(document.getElementById('questionCountSelect').value);
            quizMode = 'random';

            // 显示加载状态，避免闪烁
            document.getElementById('paperContainer').innerHTML = `
                <div class="loading">⏳ 正在加载题目...</div>`;

            try {
                const response = await fetch(`${API_BASE}/quiz/random?count=${count}`);
                const result = await response.json();

                if (!result.success) {
                    document.getElementById('paperContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">获取题目失败</div>
                            <div class="empty-desc">${result.msg || '请确保后端服务已启动'}</div>
                        </div>
                    `;
                    return;
                }

                questions = result.data.questions;
                document.getElementById('questionCount').textContent = questions.length;
                userAnswers = {};
                showAnswerMode = false;

                renderPaper();
            } catch (error) {
                document.getElementById('paperContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <div class="empty-title">加载失败</div>
                        <div class="empty-desc">请确保后端服务已启动</div>
                    </div>
                `;
                console.error('加载题目失败:', error);
            }
        }

        function renderPaper() {
            let paperTitle = quizMode === 'random' ? '随机答题' : document.getElementById('examName').textContent;
            let paperHtml = `<div class="paper-title">${paperTitle}</div>`;

            questions.forEach((question, index) => {
                const options = parseOptions(question.options);
                const userAnswer = userAnswers[question.id] || '';
                const correctAnswer = question.answer || '';

                const hasOptions = Object.values(options).some(v => v && v.trim());
                const isChoice = hasOptions;

                let imagesHtml = '';

                let stemHtml = question.stem;
                if (!isChoice) {
                    stemHtml = stemHtml.replace(/____+/g, (_, i) => {
                        const blankIndex = (stemHtml.match(/____+/g) || []).indexOf(_) + 1;
                        return `<input type="text" class="fill-blank-input" 
                            placeholder="请输入答案" 
                            oninput="saveFillAnswer(${question.id}, ${blankIndex}, this.value)"
                            value="${userAnswers[question.id] && userAnswers[question.id][blankIndex - 1] || ''}"
                            ${showAnswerMode ? 'disabled' : ''}>`;
                    });
                }

                let optionsHtml = '';
                if (isChoice) {
                    optionsHtml = `<div class="options-list">`;
                    Object.entries(options).forEach(([key, value]) => {
                        if (!value || !value.trim()) return;
                        let className = 'option-item';
                        if (showAnswerMode) {
                            if (key === correctAnswer) {
                                className += ' correct';
                            } else if (userAnswer === key && userAnswer !== correctAnswer) {
                                className += ' wrong';
                            }
                        } else if (userAnswer === key) {
                            className += ' selected';
                        }
                        optionsHtml += `
                            <div class="${className}" onclick="selectOption(${question.id}, '${key}')">
                                <div class="option-letter">${key}</div>
                                <div class="option-text">${value}</div>
                            </div>
                        `;
                    });
                    optionsHtml += `</div>`;
                }

                let feedbackHtml = '';
                if (showAnswerMode && correctAnswer) {
                    feedbackHtml = `<div class="answer-feedback ${userAnswer === correctAnswer ? 'correct' : 'wrong'}">
                        正确答案：${correctAnswer}
                    </div>`;
                }

                paperHtml += `
                    <div class="question-block" id="question-${question.id}">
                        <div class="question-header">
                            <div class="question-number">${index + 1}</div>
                            <div class="question-stem">${stemHtml}</div>
                        </div>
                        ${imagesHtml}
                        ${optionsHtml}
                        ${feedbackHtml}
                    </div>
                `;
            });

            document.getElementById('paperContainer').innerHTML = paperHtml;
        }

        function selectOption(questionId, optionKey) {
            if (showAnswerMode) return;
            userAnswers[questionId] = optionKey;
            renderPaper();
        }

        function saveFillAnswer(questionId, blankIndex, value) {
            if (showAnswerMode) return;
            if (!userAnswers[questionId]) {
                userAnswers[questionId] = {};
            }
            userAnswers[questionId][blankIndex] = value.trim();
        }

        async function submitAll() {
            showAnswerMode = true;
            renderPaper();

            const token = localStorage.getItem('token');

            // 将答案提交到后端
            let submitErrors = 0;
            for (const q of questions) {
                const userAnswer = userAnswers[q.id];
                if (userAnswer) {
                    try {
                        const resp = await fetch(`${API_BASE}/questions/answer?question_id=${q.id}&answer=${encodeURIComponent(userAnswer)}`, {
                            method: 'POST',
                            headers: { 'token': token }
                        });
                        const result = await resp.json();
                        if (!result.success) {
                            submitErrors++;
                            console.error('提交答案失败:', q.id, result.msg);
                        }
                    } catch (e) {
                        submitErrors++;
                        console.error('提交答案失败:', e);
                    }
                }
            }
            if (submitErrors > 0) {
                console.warn(`共 ${submitErrors} 道题答案提交失败，错题本可能不完整`);
            }

            let correct = 0;
            let wrong = 0;

            questions.forEach(q => {
                const userAnswer = userAnswers[q.id];
                const correctAnswer = q.answer || '';

                if (userAnswer && String(userAnswer).toUpperCase() === String(correctAnswer).toUpperCase()) {
                    correct++;
                } else if (userAnswer) {
                    wrong++;
                }
            });

            const totalAnswered = correct + wrong;
            const accuracy = totalAnswered > 0 ? Math.round((correct / totalAnswered) * 100) : 0;
            const score = Math.round((correct / questions.length) * 100);

            document.getElementById('finalScore').textContent = score;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('accuracy').textContent = accuracy + '%';

            const icon = score >= 80 ? '🎉' : score >= 60 ? '👍' : '💪';
            document.getElementById('resultIcon').textContent = icon;

            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function restartQuiz() {
            userAnswers = {};
            showAnswerMode = false;
            document.getElementById('resultSection').style.display = 'none';
            renderPaper();
        }

        function backToSelect() {
            window.location.href = 'exams.html';
        }

        // 知识清单下拉菜单
        document.querySelectorAll('.dropdown-toggle').forEach(toggle => {
            toggle.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                const dropdown = this.closest('.dropdown');
                dropdown.classList.toggle('show');
            });
        });
        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        });

        document.querySelector('.search-form').addEventListener('submit', function (e) {
            e.preventDefault();
        });

        document.addEventListener('DOMContentLoaded', function () {
            loadExamQuestions();
        });
    </script>
</body>

</html>
