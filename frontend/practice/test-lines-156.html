var document = {

    }; },

try {

        const FAMOUS_UNIVERSITIES = [
            '人大附中', '北京四中', '上海中学', '华师大二附中',
            '南京外国语', '杭二中', '华师一附中', '成都七中',
            '深圳中学', '衡水中学'
        ];

        const HOT_UNIVERSITIES = ['人大附中', '上海中学', '衡水中学', '成都七中', '华师一附中'];

        let selectedFile = null;
        let currentYear = '全部';
        let currentUniversity = '全部';
        let currentType = '全部';
        let years = [];

        async function loadExams(year = null, university = null, type = null) {
            const container = document.getElementById('examContainer');
            try {
                let url = 'http://localhost:8000/api/exams';
                const params = ['scope=模拟'];
                if (year && year !== '全部') params.push(`year=${year}`);
                if (university && university !== '全部') params.push(`region=${encodeURIComponent(university)}`);
                if (type && type !== '全部') params.push(`type=${encodeURIComponent(type)}`);
                if (params.length > 0) url += '?' + params.join('&');

                const response = await fetch(url);
                const result = await response.json();

                if (!result.success) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">暂无试卷</div>
                            <div class="empty-desc">${result.msg || '试卷目录为空'}</div>
                        </div>
                    `;
                    return;
                }

                const data = result.data;
                const exams = data.exams;
                const stats = data.stats || {};
                years = data.years || [];

                updateStats(stats);
                updateYearSelect(years);
                updateUniversityTags();

                if (exams.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">暂无试卷</div>
                            <div class="empty-desc">请点击上方"上传试卷"添加高中模拟题</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = exams.map((exam, index) => {
                    const gradeLabel = exam.grade || exam.year || '';
                    const gradeColor = exam.grade === '高一' ? '#10b981' : exam.grade === '高二' ? '#3b82f6' : '#f59e0b';
                    return `
                    <div class="exam-card">
                        <div class="exam-card-header">
                            <div class="exam-icon">📘</div>
                            <div class="exam-title">
                                <div class="exam-name">
                                    ${gradeLabel ? `<span class="grade-badge" style="background:${gradeColor}">${gradeLabel}</span>` : ''}
                                    ${exam.region || ''} ${exam.exam_type || '模拟题'}
                                </div>
                            </div>
                        </div>
                        <div class="exam-meta">
                            <div class="meta-item">
                                <span class="meta-icon">🏫</span>
                                <span class="meta-value">${exam.region || '未知高校'}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-icon">📄</span>
                                <span class="meta-value">${exam.file_count || 0}份文件</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-icon">📝</span>
                                <span class="meta-value">${exam.has_answers ? exam.question_count + '题' : '未解析'}</span>
                            </div>
                        </div>
                        <div class="exam-tags">
                            ${index < 3 ? '<span class="exam-tag tag-new">新增</span>' : ''}
                            ${HOT_UNIVERSITIES.includes(exam.region) ? '<span class="exam-tag tag-hot">热门高中</span>' : ''}
                        </div>
                        <div class="exam-footer">
                            <div class="star-rating">
                                <span class="star">★</span>
                                <span class="star">★</span>
                                <span class="star">★</span>
                                <span class="star">★</span>
                                <span class="star">☆</span>
                            </div>
                            <div class="exam-actions">
                                <button class="btn-preview" onclick="previewExam(${exam.id || 'null'}, '${exam.name.replace(/'/g, "\\'")}')">预览</button>
                                ${exam.has_answers ? 
                                    `<button class="btn-quiz" onclick="startQuiz(${exam.id})">开始练习</button>` : 
                                    `<button class="btn-quiz" onclick="parseExam('${exam.name.replace(/'/g, "\\'")}')">📝 解析</button>`
                                }
                                <button class="btn-start" onclick="downloadFiles('${encodeURIComponent(JSON.stringify(exam.files))}')">下载</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <div class="empty-title">加载失败</div>
                        <div class="empty-desc">请确保后端服务已启动</div>
                    </div>
                `;
                console.error('加载试卷失败:', error);
            }
        }

        function updateStats(stats) {
            document.getElementById('statTotalExams').textContent = stats.total_exams || 0;
            document.getElementById('statTotalRegions').textContent = stats.total_regions || 0;
            document.getElementById('statYearRange').textContent = stats.year_range || '--';
            document.getElementById('statTotalQuestions').textContent = stats.total_questions > 0 ? stats.total_questions + '+' : '0';
        }

        function updateYearSelect(yearList) {
            const select = document.getElementById('yearSelect');
            const currentValue = select.value;
            select.innerHTML = '<option value="全部">全部年份</option>';
            yearList.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + '年';
                select.appendChild(option);
            });
            select.value = currentYear;
        }

        function updateUniversityTags() {
            const container = document.getElementById('uniTags');
            container.innerHTML = '';

            // "全部高校" 标签
            const allTag = document.createElement('span');
            allTag.className = `region-tag ${currentUniversity === '全部' ? 'active' : ''}`;
            allTag.textContent = '全部高中';
            allTag.onclick = () => selectUniversity('全部');
            container.appendChild(allTag);

            // 知名高校标签
            FAMOUS_UNIVERSITIES.forEach(uni => {

} catch(e) {
    document.getElementById('output').innerHTML = 'ERROR: ' + e.message;
}
    </script>
</body>
</html>
