<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>答题 - 生物视界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SimSun', '宋体', 'Microsoft YaHei', serif;
            background: #e8eaed;
            min-height: 100vh;
            color: #1a1a1a;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 20px;
        }
        /* ===== 试卷样式 ===== */
        .quiz-header {
            background: white;
            padding: 28px 40px;
            margin-bottom: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: block;
            text-align: center;
        }
        .quiz-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a237e;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .quiz-info {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 13px;
            color: #555;
            flex-wrap: wrap;
        }
        .quiz-info span {
            padding: 4px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fafafa;
        }
        .quiz-actions {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            font-family: inherit;
        }
        .back-btn:hover { background: #5568d3; }
        
        /* Progress */
        .progress-bar {
            background: white;
            padding: 14px 40px;
            margin-bottom: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-top: 1px solid #eee;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
            color: #555;
        }
        .progress-track {
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1a237e, #3b82f6);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        
        /* Question card */
        .question-card {
            background: white;
            padding: 40px 48px;
            margin-bottom: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            min-height: 400px;
        }
        .question-stem {
            font-size: 15px;
            line-height: 2;
            color: #1a1a1a;
            margin-bottom: 24px;
            text-indent: 2em;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .question-stem img {
            max-width: 100%;
            border: 1px solid #ddd;
            padding: 4px;
            margin: 10px auto;
            display: block;
            background: white;
        }
        
        /* Options - 试卷风格 */
        .options-list { list-style: none; }
        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 8px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 14px;
            line-height: 2;
            color: #1a1a1a;
        }
        .option-item:hover {
            background: #f0f4ff;
        }
        .option-item.selected {
            background: #e3f2fd;
            border-radius: 6px;
        }
        .option-item.selected .option-label {
            background: #1a237e;
            color: white;
        }
        .option-item.correct {
            background: #e8f5e9;
            border-radius: 6px;
        }
        .option-item.correct .option-label {
            background: #2e7d32;
            color: white;
        }
        .option-item.wrong {
            background: #ffebee;
            border-radius: 6px;
        }
        .option-item.wrong .option-label {
            background: #c62828;
            color: white;
        }
        .option-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e0e0e0;
            color: #333;
            font-weight: 700;
            margin-right: 10px;
            flex-shrink: 0;
            font-size: 13px;
        }
        .option-text {
            font-size: 14px;
            line-height: 2;
        }
        
        /* Fill-in answer */
        .fill-answer-input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            background: #fafafa;
            transition: border-color 0.2s;
            line-height: 2;
        }
        .fill-answer-input:focus {
            outline: none;
            border-color: #1a237e;
            background: white;
        }
        
        /* Navigation */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 40px;
            background: white;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .nav-btn {
            flex: 1;
            padding: 12px 24px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: white;
            color: #333;
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .nav-btn-prev:hover:not(:disabled) {
            background: #f5f5f5;
        }
        .nav-btn-next {
            background: #1a237e;
            color: white;
            border-color: #1a237e;
        }
        .nav-btn-next:hover:not(:disabled) {
            background: #283593;
        }
        .submit-btn {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
        }
        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.4);
        }
        
        /* Result page */
        .result-card {
            background: white;
            padding: 40px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .result-score {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, #1a237e, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .result-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 24px;
        }
        .result-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 32px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .stat-value.correct { color: #2e7d32; }
        .stat-value.wrong { color: #c62828; }
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .result-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 32px;
        }
        .result-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .result-btn-primary {
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
        }
        .result-btn-primary:hover { transform: translateY(-1px); }
        .result-btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        .result-btn-secondary:hover { background: #d1d5db; }
        
        /* Review section */
        .review-section {
            margin-top: 32px;
            text-align: left;
        }
        .review-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a237e;
            margin-bottom: 16px;
            padding-left: 10px;
            border-left: 4px solid #1a237e;
        }
        .review-item {
            background: #fafafa;
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-left: 4px solid #1a237e;
        }
        .review-item.correct { border-left-color: #2e7d32; }
        .review-item.wrong { border-left-color: #c62828; }
        .review-q-num {
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .review-q-stem {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.8;
        }
        .review-answer-info {
            font-size: 13px;
            color: #666;
        }
        .review-your-answer { color: #c62828; font-weight: 500; }
        .review-correct-answer { color: #2e7d32; font-weight: 500; }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #333;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top-color: #1a237e;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 16px;
            color: #555;
        }
        
        /* Question navigator */
        .q-nav {
            background: white;
            padding: 14px 40px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .q-nav-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            transition: all 0.15s;
            font-family: inherit;
        }
        .q-nav-btn:hover { border-color: #1a237e; color: #1a237e; }
        .q-nav-btn.current {
            background: #1a237e;
            color: white;
            border-color: #1a237e;
        }
        .q-nav-btn.answered {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }
        .q-nav-btn.answered.current {
            background: #1a237e;
            border-color: #1a237e;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Content injected by JS -->
    </div>

    <script>
        const __PROTO__ = (typeof location !== 'undefined' && location.protocol) || '';
        const API_BASE = (__PROTO__ === 'file:') ? 'http://localhost:8000/api' : '/api';
        const __STATIC_PREFIX__ = (__PROTO__ === 'file:') ? 'http://localhost:8000' : '';
        function _u(raw) {
            if (!raw || typeof raw !== 'string') return '';
            if (/^https?:/i.test(raw)) return raw;
            if (raw.charAt(0) === '/') return __STATIC_PREFIX__ + raw;
            return raw;
        }
        let examId = null;
        let examData = null;
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let answeredStatus = {};

        function getParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                examId: params.get('exam_id') || params.get('examId') || params.get('id'),
                examName: params.get('exam_name') || ''
            };
        }

        async function init() {
            const params = getParams();
            examId = params.examId;
            
            if (!examId) {
                showError('缺少试卷ID参数');
                return;
            }

            renderLoading('正在加载试卷...');

            try {
                const response = await fetch(`${API_BASE}/exams/${examId}/questions`);
                const result = await response.json();
                
                if (result.code === 200 && result.data) {
                    const data = result.data;
                    const examInfo = data.exam_info || {};
                    examData = {
                        id: data.exam_id,
                        name: examInfo.name || data.exam_name || '生物试卷',
                        grade: examInfo.grade || '',
                        region: examInfo.region || '',
                        exam_type: examInfo.exam_type || ''
                    };
                    
                    if (Array.isArray(data.questions)) {
                        questions = data.questions.map((q, idx) => ({
                            ...q,
                            originalIndex: idx
                        }));
                    } else if (data.questions && Array.isArray(data.questions.questions)) {
                        questions = data.questions.questions.map((q, idx) => ({
                            ...q,
                            originalIndex: idx
                        }));
                    }
                    
                    if (questions.length === 0) {
                        showError('该试卷暂无题目');
                        return;
                    }
                    
                    renderQuiz();
                } else {
                    showError('加载试卷失败');
                }
            } catch (err) {
                console.error(err);
                showError('加载试卷失败，请确保后端服务已启动');
            }
        }

        function showError(msg) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="quiz-header" style="justify-content:center;">
                    <div style="text-align:center;">
                        <div style="font-size:48px;margin-bottom:12px;">📝</div>
                        <div style="font-size:18px;color:#555;">${msg}</div>
                        <button class="back-btn" style="margin-top:16px;" onclick="history.back()">返回</button>
                    </div>
                </div>
            `;
        }

        function renderLoading(text) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">${text}</div>
                </div>
            `;
        }

        function renderQuiz() {
            const app = document.getElementById('app');
            const examTitle = examData.name || '生物试卷';
            const grade = examData.grade || '';
            const region = examData.region || '';
            const examType = examData.exam_type || '';
            
            app.innerHTML = `
                <div class="quiz-header">
                    <div class="quiz-title">${examTitle}</div>
                    <div class="quiz-info">
                        ${grade ? `<span>年级：${grade}</span>` : ''}
                        ${region ? `<span>学校：${region}</span>` : ''}
                        ${examType ? `<span>类型：${examType}</span>` : ''}
                        <span>共 ${questions.length} 题</span>
                        <span>已答 <span id="answeredCount">0</span> 题</span>
                    </div>
                    <div class="quiz-actions">
                        <button class="submit-btn" onclick="submitQuiz()">📤 交卷</button>
                        <button class="back-btn" onclick="if(confirm('确定要退出吗？')) history.back()">← 返回</button>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-info">
                        <span>第 ${currentIndex + 1} / ${questions.length} 题</span>
                        <span>${Math.round((currentIndex + 1) / questions.length * 100)}%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${(currentIndex + 1) / questions.length * 100}%"></div>
                    </div>
                </div>

                <div class="q-nav" id="qNav"></div>

                <div id="questionArea"></div>

                <div class="nav-buttons">
                    <button class="nav-btn nav-btn-prev" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''}>← 上一题</button>
                    ${currentIndex === questions.length - 1 ? 
                        `<button class="nav-btn nav-btn-next" onclick="submitQuiz()">提交答卷</button>` :
                        `<button class="nav-btn nav-btn-next" onclick="nextQuestion()">下一题 →</button>`
                    }
                </div>
            `;

            renderQuestionNav();
            renderQuestion();
            updateAnsweredCount();
        }

        function renderQuestionNav() {
            const nav = document.getElementById('qNav');
            let html = '';
            questions.forEach((q, idx) => {
                let cls = 'q-nav-btn';
                if (idx === currentIndex) cls += ' current';
                if (answeredStatus[idx]) cls += ' answered';
                html += `<button class="${cls}" onclick="jumpToQuestion(${idx})">${idx + 1}</button>`;
            });
            nav.innerHTML = html;
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            const area = document.getElementById('questionArea');
            const userAnswer = userAnswers[currentIndex] || null;
            const options = parseOptions(q.options);
            const isChoice = options.length > 0;
            
            let typeBadge = '';
            if (isChoice) {
                typeBadge = '<span class="quiz-type-badge choice">选择题</span>';
            } else {
                typeBadge = '<span class="quiz-type-badge fill">非选择题</span>';
            }
            
            let optionsHtml = '';
            if (isChoice) {
                optionsHtml = `<ul class="options-list">`;
                options.forEach(opt => {
                    const selected = userAnswer === opt.key ? ' selected' : '';
                    optionsHtml += `
                        <li class="option-item${selected}" onclick="selectOption('${opt.key}')">
                            <span class="option-label">${opt.key}</span>
                            <span class="option-text">${opt.text || ''}</span>
                        </li>
                    `;
                });
                optionsHtml += `</ul>`;
            } else {
                optionsHtml = `
                    <textarea class="fill-answer-input" placeholder="请输入你的答案..." 
                        oninput="saveFillAnswer(this.value)">${userAnswer || ''}</textarea>
                `;
            }

            let imagesHtml = '';
            const images = parseImages(q.images);
            if (images.length > 0) {
                imagesHtml = images.map(img => 
                    '<img src="' + img + '" alt="题目图片" onerror="this.style.display=\'none\'">'
                ).join('');
            }

            const stem = q.stem || q.content || q.question || '';

            area.innerHTML = `
                <div class="question-card">
                    <div class="question-stem"><strong>${currentIndex + 1}.</strong> ${stem}</div>
                    ${imagesHtml}
                    ${optionsHtml}
                </div>
            `;

            renderQuestionNav();
        }

        function parseOptions(optionsData) {
            if (!optionsData) return [];
            if (typeof optionsData === 'string') {
                try {
                    const parsed = JSON.parse(optionsData);
                    if (Array.isArray(parsed)) return parsed;
                    if (typeof parsed === 'object' && parsed !== null) {
                        return Object.keys(parsed).map(key => ({ key, text: parsed[key] }));
                    }
                    return [];
                } catch (e) {
                    return parseOptionsFromString(optionsData);
                }
            }
            if (Array.isArray(optionsData)) return optionsData;
            if (typeof optionsData === 'object' && optionsData !== null) {
                return Object.keys(optionsData)
                    .filter(k => optionsData[k] && optionsData[k].trim())
                    .map(key => ({ key, text: optionsData[key] }));
            }
            return [];
        }

        function parseOptionsFromString(text) {
            const options = [];
            const pattern = /([A-D])\s*[.．、)）:：]\s*(.*?)(?=(?:[A-D])\s*[.．、)）:：]|$)/g;
            let match;
            while ((match = pattern.exec(text)) !== null) {
                const content = match[2].trim();
                if (content) {
                    options.push({ key: match[1], text: content });
                }
            }
            return options;
        }

        function parseImages(imagesData) {
            if (!imagesData) return [];
            if (Array.isArray(imagesData)) return imagesData.filter(img => img && typeof img === 'string');
            if (typeof imagesData === 'string') {
                try {
                    const parsed = JSON.parse(imagesData);
                    if (Array.isArray(parsed)) return parsed.filter(img => img && typeof img === 'string');
                } catch (e) {
                    return [];
                }
            }
            return [];
        }

        function selectOption(key) {
            userAnswers[currentIndex] = key;
            answeredStatus[currentIndex] = true;
            renderQuestion();
            updateAnsweredCount();
        }

        function saveFillAnswer(value) {
            if (value && value.trim()) {
                userAnswers[currentIndex] = value.trim();
                answeredStatus[currentIndex] = true;
            } else {
                delete userAnswers[currentIndex];
                answeredStatus[currentIndex] = false;
            }
            updateAnsweredCount();
        }

        function jumpToQuestion(idx) {
            currentIndex = idx;
            renderQuiz();
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuiz();
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuiz();
            }
        }

        function updateAnsweredCount() {
            const count = Object.values(answeredStatus).filter(Boolean).length;
            const el = document.getElementById('answeredCount');
            if (el) el.textContent = count;
        }

        function submitQuiz() {
            const unanswered = [];
            questions.forEach((_, idx) => {
                if (!answeredStatus[idx]) unanswered.push(idx + 1);
            });

            let msg = '确定要提交答卷吗？';
            if (unanswered.length > 0) {
                msg = `您还有 ${unanswered.length} 道题未作答（第 ${unanswered.join(', ')} 题），确定要提交吗？`;
            }

            if (confirm(msg)) {
                showResult();
            }
        }

        function showResult() {
            let correctCount = 0;
            let wrongCount = 0;
            let noAnswerCount = 0;
            const reviewItems = [];

            questions.forEach((q, idx) => {
                const userAnswer = userAnswers[idx] || '';
                const correctAnswer = (q.answer || '').trim().toUpperCase();
                const userAns = (userAnswer || '').trim().toUpperCase();
                
                let isCorrect = false;
                if (!userAnswer) {
                    noAnswerCount++;
                } else if (correctAnswer && userAns === correctAnswer) {
                    isCorrect = true;
                    correctCount++;
                } else {
                    wrongCount++;
                }

                const options = parseOptions(q.options);
                let userAnsText = userAnswer || '未作答';
                if (options.length > 0 && userAnswer) {
                    const opt = options.find(o => o.key === userAnswer);
                    if (opt) userAnsText = `${userAnswer}. ${opt.text}`;
                }

                let correctAnsText = correctAnswer || '无答案';
                if (options.length > 0 && correctAnswer) {
                    const opt = options.find(o => o.key === correctAnswer);
                    if (opt) correctAnsText = `${correctAnswer}. ${opt.text}`;
                }

                reviewItems.push({
                    index: idx,
                    stem: q.stem || q.content || '',
                    userAnswer: userAnsText,
                    correctAnswer: correctAnsText,
                    isCorrect: isCorrect,
                    noAnswer: !userAnswer
                });
            });

            const totalAnswered = correctCount + wrongCount;
            const score = totalAnswered > 0 ? Math.round(correctCount / questions.length * 100) : 0;
            const accuracy = totalAnswered > 0 ? Math.round(correctCount / totalAnswered * 100) : 0;

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="result-card">
                    <div style="font-size:48px;margin-bottom:8px;">${score >= 60 ? '🎉' : '💪'}</div>
                    <div class="result-score">${score}</div>
                    <div class="result-label">总得分 (满分100)</div>
                    
                    <div class="result-stats">
                        <div class="stat-item">
                            <div class="stat-value correct">${correctCount}</div>
                            <div class="stat-label">答对</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value wrong">${wrongCount}</div>
                            <div class="stat-label">答错</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" style="color:#6b7280;">${noAnswerCount}</div>
                            <div class="stat-label">未答</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" style="color:#1a237e;">${accuracy}%</div>
                            <div class="stat-label">正确率</div>
                        </div>
                    </div>

                    <div class="result-actions">
                        <button class="result-btn result-btn-secondary" onclick="restartQuiz()">🔄 重新作答</button>
                        <button class="result-btn result-btn-primary" onclick="history.back()">← 返回试卷列表</button>
                    </div>

                    <div class="review-section">
                        <div class="review-title">📋 答题详情</div>
                        ${reviewItems.map(item => `
                            <div class="review-item ${item.isCorrect ? 'correct' : 'wrong'}">
                                <div class="review-q-num">
                                    第 ${item.index + 1} 题 
                                    ${item.isCorrect ? '✅' : item.noAnswer ? '❓' : '❌'}
                                </div>
                                <div class="review-q-stem">${item.stem}</div>
                                <div class="review-answer-info">
                                    <div>你的答案：<span class="review-your-answer">${item.userAnswer}</span></div>
                                    <div>正确答案：<span class="review-correct-answer">${item.correctAnswer}</span></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartQuiz() {
            userAnswers = {};
            answeredStatus = {};
            currentIndex = 0;
            renderQuiz();
        }

        // Start
        document.addEventListener('DOMContentLoaded', () => {
            init();
        });
    </script>
</body>
</html>
