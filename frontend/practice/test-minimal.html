<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Minimal Error Test</title>
</head>
<body>
    <h1>Minimal Test</h1>
    <div id="output">Testing...</div>
    <script>
    var document = { 
        getElementById: function(id) { return { 
            innerHTML: '', textContent: '', value: '',
            style: {}, classList: { add: function(){}, remove: function(){} },
            appendChild: function(){}, addEventListener: function(){},
            querySelectorAll: function(){ return []; },
            onclick: null, textContent: ''
        }; },
        createElement: function(tag) { return { 
            className: '', textContent: '', innerHTML: '',
            style: {}, setAttribute: function(){},
            appendChild: function(){}, onclick: null
        }; },
        querySelectorAll: function(sel) { return []; },
        querySelector: function(sel) { return null; }
    };
    var window = { location: { href: '' }, open: function(){} };
    var alert = function(){};
    var fetch = function() { return Promise.resolve(); };
    var atob = function(s) { return s; };
    
    try {
        // Simulating the problematic code
        const exams = [{id: 1, name: "test", grade: "高一", region: "学校", exam_type: "模拟题", has_answers: true, question_count: 10, file_count: 1, files: []}];
        const HOT_UNIVERSITIES = ['人大附中', '上海中学', '衡水中学', '成都七中', '华师一附中'];
        const container = document.getElementById('output');
        
        container.innerHTML = exams.map((exam, index) => {
            const gradeLabel = exam.grade || exam.year || '';
            const gradeColor = exam.grade === '高一' ? '#10b981' : exam.grade === '高二' ? '#3b82f6' : '#f59e0b';
            return `
            <div class="exam-card">
                <div class="exam-card-header">
                    <div class="exam-icon">📘</div>
                    <div class="exam-title">
                        <div class="exam-name">
                            ${gradeLabel ? `<span class="grade-badge" style="background:${gradeColor}">${gradeLabel}</span>` : ''}
                            ${exam.region || ''} ${exam.exam_type || '模拟题'}
                        </div>
                    </div>
                </div>
                <div class="exam-meta">
                    <div class="meta-item">
                        <span class="meta-icon">🏫</span>
                        <span class="meta-value">${exam.region || '未知高校'}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-icon">📄</span>
                        <span class="meta-value">${exam.file_count || 0}份文件</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-icon">📝</span>
                        <span class="meta-value">${exam.has_answers ? exam.question_count + '题' : '未解析'}</span>
                    </div>
                </div>
                <div class="exam-tags">
                    ${index < 3 ? '<span class="exam-tag tag-new">新增</span>' : ''}
                    ${HOT_UNIVERSITIES.includes(exam.region) ? '<span class="exam-tag tag-hot">热门高中</span>' : ''}
                </div>
                <div class="exam-footer">
                    <div class="star-rating">
                        <span class="star">★</span>
                        <span class="star">★</span>
                        <span class="star">★</span>
                        <span class="star">★</span>
                        <span class="star">☆</span>
                    </div>
                    <div class="exam-actions">
                        <button class="btn-preview" onclick="previewExam(${exam.id || 'null'}, '${exam.name.replace(/'/g, "\\'")}')">预览</button>
                        ${exam.has_answers ? 
                            `<button class="btn-quiz" onclick="startQuiz(${exam.id})">开始练习</button>` : 
                            `<button class="btn-quiz" onclick="parseExam('${exam.name.replace(/'/g, "\\'")}')">📝 解析</button>`
                        }
                        <button class="btn-start" onclick="downloadFiles('${encodeURIComponent(JSON.stringify(exam.files))}')">下载</button>
                    </div>
                </div>
            </div>
        `).join('');
        
        document.getElementById('output').innerHTML = 'SUCCESS: ' + container.innerHTML.length + ' chars generated';
    } catch(e) {
        document.getElementById('output').innerHTML = 'ERROR: ' + e.message;
    }
    </script>
</body>
</html>
